<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1D3FAF">
<title>thuis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --kobalt:#1D3FAF; --paars:#4B3CC0; --violet:#7A3FC8; --turkoois:#0A7581; --eenmalig:#6A3BC4;
    --tekst:#18202B; --zacht:#3A4250; --grijs:#5A6472; --lijn:#DEDCEE; --rij:#EFEEF7; --achter:#F4F3FB;
    --oranje-bg:#FFF5E6; --oranje:#6B3D02; --rood:#B42318;
  }
  *{box-sizing:border-box}
  /* Een eigen display (flex) mag hidden niet overstemmen. */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;color:var(--tekst);background:var(--achter);
       display:flex;flex-direction:column;overflow:hidden;position:fixed;inset:0}
  /* Vast aan de randen van het scherm (zoals trends) in plaats van 100dvh: die
     hoogte klopt bij het openen van de geïnstalleerde app op Android niet altijd,
     waardoor de tabbalk onder het scherm viel. Met resizes-content krimpt het
     scherm mee met het toetsenbord, zodat het invoervak erboven blijft. */
  button,input{font:inherit}
  /* Vaste kop, scrollend midden, vaste tabbalk: de navigatie scrollt niet weg. */
  header{flex-shrink:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;color:#FFFFFF;
         background:linear-gradient(115deg,var(--kobalt) 0%,var(--paars) 60%,var(--violet) 100%)}
  .merk{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
  #wolk{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;background:transparent;color:#E4E0FF;font-size:17px}
  #wolk svg{flex-shrink:0}
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scherm{padding:14px;display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto}
  .scherm[hidden]{display:none}
  h2{margin:0 0 6px 2px;font-size:17px;font-weight:700;color:var(--paars)}
  .kaart{background:#FFFFFF;border:1px solid var(--lijn)}
  .rij{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 14px;border-bottom:1px solid var(--rij)}
  .rij:last-child{border-bottom:0}
  .rij .label{flex:1}
  .rij .waarde{font-size:17px;color:var(--grijs);text-align:right}
  .leeg{padding:28px 18px;text-align:center;color:var(--zacht);font-size:17px;line-height:1.45}
  .leeg b{display:block;font-size:19px;color:var(--tekst);margin-bottom:6px}
  .knop{min-height:52px;border:0;padding:0 16px;font-size:18px;font-weight:600;color:#FFFFFF;background:linear-gradient(135deg,var(--paars),var(--violet))}
  .knop.tweede{background:#FFFFFF;color:var(--paars);border:2px solid var(--paars)}
  .knop.rood{background:#FFFFFF;color:var(--rood);border:2px solid var(--rood)}
  .knop:disabled{opacity:.45}
  .knoppen{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
  .knoppen.vol .knop{flex:1 1 100%}
  .veld{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .veld label{font-size:17px;font-weight:600;color:var(--paars)}
  .veld input{height:52px;border:2px solid #CFCBE6;padding:0 12px;font-size:18px;width:100%;background:#FFFFFF;color:var(--tekst)}
  .stempel{text-align:center;font-size:17px;color:#6B7482;padding:4px 0 8px}
  /* Meldingen: één melding per regel, de knoppen eronder; ze blijven staan tot je
     ze wegtikt of het is opgelost (gedeelde conventie). */
  #meldingen{display:flex;flex-direction:column;gap:8px;padding:14px 14px 0;max-width:640px;margin:0 auto}
  #meldingen:empty{display:none}
  .melding{background:var(--oranje-bg);color:var(--oranje);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .melding.info{background:#ECEAF8;color:#2E2A4F}
  .melding p{margin:0;font-size:17px;line-height:1.4}
  .melding .knoppen{padding:0}
  nav{flex-shrink:0;height:64px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid var(--lijn);
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;border-top:3px solid transparent;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
  nav button svg{width:28px;height:28px;stroke:#6B7482;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current="page"]{border-top-color:var(--paars);background:#F1EFFB}
  nav button[aria-current="page"] svg{stroke:var(--paars)}
  /* ---------- boodschappen ---------- */
  /* Invoer onderaan, boven de tabbalk: met de duim te bereiken en altijd in beeld. */
  .onderbalk{flex-shrink:0;padding:10px 14px 12px;background:#FFFFFF;border-top:1px solid var(--lijn);box-shadow:0 -4px 12px rgba(24,20,60,.06)}
  .onderbalk .invoerbalk{max-width:612px;margin:0 auto;height:56px;box-shadow:none}
  /* Tijdens het typen staan de treffers onderaan, vlak boven het vak. */
  body.typen #scherm-boodschappen{min-height:100%;justify-content:flex-end}
  .invoerbalk{position:relative;display:flex;align-items:stretch;height:60px;background:#FFFFFF;border:2px solid var(--paars);box-shadow:0 4px 14px rgba(75,60,192,.14)}
  .invoerbalk input{flex:1;min-width:0;border:0;outline:none;padding:0 12px;font-size:19px;color:var(--tekst);background:transparent}
  .soortknop{width:52px;flex-shrink:0;border:0;border-right:1px solid var(--lijn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
  .plusknop{width:56px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--paars),var(--violet))}
  .menu{position:absolute;z-index:10;bottom:56px;left:-2px;width:230px;background:#FFFFFF;border:1px solid #CFCBE6;box-shadow:0 10px 28px rgba(30,20,80,.22)}
  .menu button{width:100%;height:52px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:18px;color:var(--tekst);text-align:left}
  .menu button:first-child{border-top:0}
  .menu button span{flex:1}
  #achtergrond{position:fixed;inset:0;z-index:5;border:0;padding:0;background:rgba(24,20,60,.12)}
  .filters{display:flex;gap:6px}
  .filter{flex:1;height:46px;border:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px}
  .kopregel{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0}
  .kopregel h2{margin:0;font-size:18px}
  .kopregel span{font-size:17px;color:var(--grijs)}
  .lijst{background:#FFFFFF;border:1px solid var(--lijn)}
  .item{display:flex;align-items:center;gap:8px;min-height:54px;padding:4px 6px 4px 10px;border-bottom:1px solid var(--rij)}
  .item:last-child{border-bottom:0}
  .item .icoon{width:30px;flex-shrink:0;display:flex;justify-content:center}
  .item .tekst{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:44px}
  .item .naam{font-size:19px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
  .item .naam span{overflow:hidden;text-overflow:ellipsis}
  .item .hint{font-size:17px;color:var(--grijs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nieuw{padding:1px 7px;background:#DDF1F2;color:#0A6570;font-size:17px;font-weight:600}
  .rondje{width:44px;height:44px;flex-shrink:0;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
  .lijst .leeg{padding:16px 14px;text-align:left}
  /* Tijdens het typen de onderbalk weg: dan is er ruimte voor de zoekresultaten. */
  body.typen nav{display:none}
  /* ---------- tabblad Winkels ---------- */
  .wsectie{display:flex;flex-direction:column;gap:8px}
  .wsectie > button.kop{min-height:44px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0 2px;color:var(--paars);font-size:18px;font-weight:700;text-align:left}
  .wsectie > button.kop span{flex:1}
  .wsectie > button.kop .tal{flex:0;font-size:17px;font-weight:400;color:var(--grijs)}
  .wkaart{background:#FFFFFF;border:1px solid var(--lijn)}
  .wkaart > *{border-top:1px solid var(--rij)}
  .wkaart > *:first-child{border-top:0}
  .winkelrij{width:100%;min-height:60px;border:0;background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:6px 12px 6px 14px;text-align:left;color:var(--tekst)}
  .winkelrij .nm{flex:1;min-width:0;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
  .winkelrij .sub{display:block;font-size:16px;color:var(--grijs)}
  .wdkop{position:sticky;top:-14px;z-index:2;margin:-14px -14px 0;height:60px;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;background:#FFFFFF;border-bottom:1px solid var(--lijn)}
  #winkelDetail{display:flex;flex-direction:column;gap:12px}
  #winkelsOverzicht{display:flex;flex-direction:column;gap:12px}
  .wdkop h2{flex:1;min-width:0;margin:0;font-size:21px;font-weight:700;color:var(--tekst);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wdkop .terug{width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
  .kopregel2{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  .kopregel2 h3{margin:0;font-size:18px;color:var(--paars)}
  .kopregel2 span{font-size:17px;color:var(--grijs)}
  .arij{min-height:56px;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 2px;background:#FFFFFF;position:relative}
  .arij .nm{flex:1;min-width:0;font-size:19px;overflow-wrap:anywhere}
  .arij.sleept{z-index:3;background:#F1EFFB;box-shadow:0 6px 16px rgba(24,20,60,.18)}
  .greep{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  .potlood{width:44px;height:44px;flex-shrink:0;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
  .leegregel{padding:16px 14px;font-size:18px;color:var(--grijs)}
  #keuze .naamveld{display:flex;flex-direction:column;gap:6px;padding:8px 16px 14px}
  #keuze .naamveld label{font-size:17px;font-weight:600;color:var(--paars)}
  #keuze .naamveld input{height:54px;border:2px solid var(--paars);padding:0 12px;font-size:19px;outline:none}
  #keuze .bewerkknoppen{display:flex;gap:10px;padding:0 16px 14px}
  #keuze .bewerkknoppen .prul{width:54px;height:54px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#FBE4E5}
  #keuze .bewerkknoppen .knop{flex:1;min-height:54px;font-size:19px}
  /* ---------- tabblad Winkel ---------- */
  .winkelbalk{background:#FFFFFF;border:1px solid var(--lijn)}
  .winkelbalk .boven{height:56px;display:flex;align-items:center;gap:6px;padding:0 6px 0 14px}
  .winkelbalk .winkelnaam{flex:1;min-width:0;height:48px;border:0;background:transparent;color:var(--tekst);font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;padding:0;text-align:left}
  .winkelbalk .winkelnaam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .winkelbalk .onder{display:flex;align-items:center;gap:10px;padding:0 14px 10px}
  .winkelbalk .balk{flex:1;height:6px;background:#ECEAF8}
  .winkelbalk .balk div{height:6px;width:0;background:linear-gradient(90deg,#5EE0E8,var(--violet))}
  .winkelbalk .artikelen{font-size:17px;color:var(--grijs)}
  #winkelLijst{display:flex;flex-direction:column;gap:12px}
  .afd{background:#FFFFFF;border:1px solid var(--lijn)}
  .afd .afdkop{min-height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:#ECEAF8}
  .afd .afdkop span{flex:1;font-size:17px;font-weight:600;color:var(--paars)}
  .afd.grijs{background:#FAFAFD}
  .afd.grijs .afdkop{background:transparent}
  .afd.grijs .afdkop span{color:var(--grijs)}
  .wrij{display:flex;align-items:center;gap:6px;padding-right:8px;border-top:1px solid var(--rij)}
  .afd > .wrij:first-child{border-top:0}
  .wrij .vink{flex:1;min-width:0;min-height:56px;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:4px 6px 4px 14px;color:var(--tekst);text-align:left}
  .wrij .vink .nm{flex:1;min-width:0;font-size:20px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
  .wrij.gedaan .vink{color:#6B7482}
  .wrij.gedaan .vink .nm{text-decoration:line-through;font-weight:400}
  .wrij .elders{font-size:17px;color:var(--grijs);flex-shrink:0}
  .afd .uitklap{flex:1;min-height:44px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0;font-size:17px;font-weight:600;color:var(--grijs);text-align:left}
  .afd .uitklap span{flex:1}
  /* Icoonknop: vierkant van 44 px, lichte tint, geen rand. */
  .icoonknop{width:44px;height:44px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#E9E6F8}
  .icoonknop.amber{background:#FBF0DA}
  /* ---------- keuzelijst van onderen ---------- */
  #keuze{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(24,20,60,.35)}
  #keuze .paneel{background:#FFFFFF;max-height:80dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #keuze .kop{display:flex;align-items:center;gap:8px;padding:6px 6px 4px 16px}
  #keuze h3{flex:1;min-width:0;margin:0;font-size:18px;color:var(--paars)}
  #keuze .kruis{width:44px;height:44px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#E9E6F8}
  #keuze .opties{flex:1;min-height:120px;overflow-y:auto}
  #keuze .optie{width:100%;min-height:56px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:18px;color:var(--tekst);text-align:left}
  #keuze .optie .nm{flex:1;min-width:0;line-height:1.3;overflow-wrap:anywhere}
  #keuze .optie .sub{display:block;font-size:16px;color:var(--grijs)}
  #keuze .optie.actief{color:var(--paars);font-weight:700}
  #keuze .optie.actief .sub{font-weight:400}
  #keuze .optie .tal{min-width:32px;height:30px;padding:0 8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#ECEAF8;color:var(--paars);font-size:17px;font-weight:700}
  #keuze .uitklapper{width:100%;min-height:48px;border:0;border-top:1px solid var(--lijn);background:#FAFAFD;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:17px;font-weight:600;color:var(--grijs);text-align:left}
  #keuze .uitklapper span{flex:1}
  #keuze .uitleg{padding:2px 16px 8px;font-size:17px;color:var(--grijs)}
  #keuze .leeg{padding:14px 16px;font-size:17px;color:var(--zacht)}
  #keuze .zoek{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--lijn);background:var(--achter)}
  #keuze .zoek label{font-size:17px;font-weight:600;color:var(--paars)}
  #keuze .zoekbalk{display:flex;height:54px;border:2px solid var(--paars);background:#FFFFFF}
  #keuze .zoekbalk input{flex:1;min-width:0;border:0;outline:none;padding:0 12px;font-size:19px}
  /* ---------- van de lijst gehaald (boodschappen) ---------- */
  .item.vertrekt{opacity:.55}
  .weggehaald .item{opacity:.7}
  .rondsvg{flex-shrink:0}
  button:focus-visible,input:focus-visible{outline:3px solid #5EE0E8;outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="merk">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5EE0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
    <span>thuis</span>
  </div>
  <button id="wolk" type="button" aria-label="Synchroniseren">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4E0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"></path><path id="wolkTeken" d="M9.5 13.5l2 2 3.5-3.5"></path></svg>
    <span id="wolkTekst">—</span>
  </button>
</header>

<main id="midden">
  <div id="meldingen" aria-live="polite"></div>
  <section class="scherm" id="scherm-winkels" aria-labelledby="tab-winkels" hidden>
    <div id="winkelsOverzicht"></div>
    <div id="winkelDetail" hidden></div>
  </section>

  <section class="scherm" id="scherm-boodschappen" aria-labelledby="tab-boodschappen">
    <div class="filters" id="filters" role="group" aria-label="Welke lijst"></div>
    <div class="kopregel"><h2 id="lijstTitel">Op de lijst</h2><span id="lijstAantal"></span></div>
    <div class="lijst" id="lijst"></div>
  </section>

  <section class="scherm" id="scherm-winkel" aria-labelledby="tab-winkel" hidden>
    <div class="winkelbalk">
      <div class="boven">
        <button class="winkelnaam" id="winkelKies" type="button" aria-haspopup="dialog">
          <span id="winkelNaam">Winkel kiezen</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <div class="onder">
        <div class="balk" aria-hidden="true"><div id="winkelVoortgang"></div></div>
        <span class="artikelen" id="winkelTeller"></span>
      </div>
    </div>
    <div id="winkelLijst"></div>
  </section>

  <section class="scherm" id="scherm-doen" aria-labelledby="tab-doen" hidden>
    <div class="kaart leeg">
      <b>Nog geen acties</b>
      <span>Hier komen de dingen die gedaan moeten worden.</span>
    </div>
  </section>

  <section class="scherm" id="scherm-instellingen" aria-labelledby="tab-instellingen" hidden>
    <div>
      <h2>Synchroniseren</h2>
      <div class="kaart">
        <div class="rij"><span class="label">Aangemeld als</span><span class="waarde" id="wieAangemeld">niet aangemeld</span></div>
        <div class="rij"><span class="label">Gedeelde map</span><span class="waarde" id="mapNaam">nog geen</span></div>
        <div class="veld" id="mapVeld">
          <label for="deellink">Deellink naar de map</label>
          <input id="deellink" type="url" inputmode="url" autocomplete="off" placeholder="https://1drv.ms/…">
          <button class="knop tweede" id="btnMap" type="button">Map koppelen</button>
        </div>
        <div class="knoppen vol">
          <button class="knop" id="btnAanmelden" type="button">Aanmelden bij Microsoft</button>
          <button class="knop rood" id="btnAfmelden" type="button" hidden>Afmelden</button>
        </div>
      </div>
    </div>
    <div>
      <h2>App</h2>
      <div class="kaart">
        <div class="rij"><span class="label">Browser</span><span class="waarde" id="appBrowser">—</span></div>
        <div class="rij"><span class="label">Aanmelding geldig</span><span class="waarde" id="appToken">—</span></div>
        <div class="rij"><span class="label">Opslag vastgezet</span><span class="waarde" id="appOpslag">—</span></div>
      </div>
    </div>
    <div class="stempel" id="app-version-stamp">Versie 1352902-005</div>
  </section>
</main>

    <div class="onderbalk" id="balk-boodschappen">
  <div class="invoerbalk">
    <button class="soortknop" id="invoerSoort" type="button" aria-haspopup="menu" aria-expanded="false"></button>

<script>
'use strict';
/* thuis — app-shell (stap 2 van het bouwplan in ontwerp.md): indeling, tabbladen,
   aanmelden bij Microsoft, de gedeelde map koppelen en de melding bij een nieuwe
   versie. Lijsten, samenvoegen en synchroniseren volgen in de volgende stappen. */

const APP_FILE = 'thuis.html';
const CACHE_PREFIX = 'thuis-';
const VERSION_RE = /Versie ([0-9A-F]+-[0-9A-F]+)/;

const CLIENT_ID = 'ce3baf27-62c5-4e28-956a-d306ddb0947c';
const AUTH = 'https://login.microsoftonline.com/consumers/oauth2/v2.0';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const SCOPE = 'Files.ReadWrite.All offline_access User.Read';
const REDIRECT = new URL(APP_FILE, location.href).href.split('?')[0].split('#')[0];
const GRENS = 10000;
/* Microsoft laat een webapp een aanmelding hooguit 24 uur vernieuwen. */
const AANMELD_GRENS = 24 * 3600 * 1000;

const $ = (id) => document.getElementById(id);

/* == kern == */
/* De kern: thuis.json lezen en schrijven (stap 3) en handelingen samenvoegen
   (stap 4). Alleen pure functies, zonder DOM of netwerk, zodat thuis-tests.cjs
   dit blok los kan uitvoeren. Het formaat staat in ontwerp.md §3, het samenvoegen
   in §4. */

const SOORTWOORDEN = ['instelling', 'winkel', 'artikel', 'actie', 'hernoemd'];
/* De delen van thuis.json en het soort record dat erin staat. */
const SECTIE_SOORT = { instellingen: 'instelling', winkels: 'winkel', artikelen: 'artikel', acties: 'actie', hernoemd: 'hernoemd' };
const FORMAAT = '1352902-3FF';
/* Volgorde waarin bekende velden worden geschreven; onbekende volgen erna, in hun eigen volgorde. */
const VELDVOLGORDE = {
  winkel: ['route'],
  artikel: ['soort', 'ligt', 'op', 'opdoor', 'gekocht'],
  actie: ['datum', 'herhaal', 'wie', 'notitie', 'link', 'foto', 'klaar', 'door'],
  hernoemd: ['nieuw', 'op'],
  instelling: ['namen', 'dag', 'tijd', 'teruggezet']
};
/* Velden waarin | een lijstscheider is. */
const LIJSTVELDEN = { route: true, ligt: true, gekocht: true, namen: true };
const MAX_GEKOCHT = 6;
const SORTEER = new Intl.Collator('nl', { sensitivity: 'base', numeric: true });

/* Vergelijkingsvorm van een naam: NFC, spaties samengevoegd, zonder hoofdletters. */
/* Voor zoeken: ook zonder accenten (creme vindt Crème), zoals in events. */
function zoekVorm(s) { return normNaam(s).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function normNaam(s) {
  return String(s).normalize('NFC').replace(/\s+/g, ' ').trim().toLocaleLowerCase('nl');
}

/* Invoer van de gebruiker: één regel, zonder ; en |, spaties samengevoegd. */
function schoonTekst(s) {
  return String(s).normalize('NFC')
    .replace(/[\u0000-\u001F\u007F]/g, ' ')
    .replace(/;/g, ',').replace(/\|/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

/* Een link mag ; en | bevatten: die worden gecodeerd. */
function schoonLink(s) {
  return String(s).trim().replace(/[\u0000-\u001F\u007F\s]/g, '').replace(/;/g, '%3B').replace(/\|/g, '%7C');
}

function sleutel(soort, vast) {
  return soort + '\u0001' + vast.map(normNaam).join('\u0001');
}

function tweeCijfers(n) { return (n < 10 ? '0' : '') + n; }
function datumTekst(d) { return d.getFullYear() + '-' + tweeCijfers(d.getMonth() + 1) + '-' + tweeCijfers(d.getDate()); }
function tijdstipTekst(d) { return datumTekst(d) + 'T' + tweeCijfers(d.getHours()) + ':' + tweeCijfers(d.getMinutes()); }

/* bytes (Uint8Array) of tekst → { ok, reden?, model, meldingen } */
function leesBestand(invoer) {
  let tekst = invoer;
  if (typeof invoer !== 'string') {
    try { tekst = new TextDecoder('utf-8', { fatal: true }).decode(invoer); }
    catch (e) { return { ok: false, reden: 'geen-utf8', meldingen: [] }; }
  }
  const meldingen = [];
  const bom = tekst.charCodeAt(0) === 0xFEFF;
  if (bom) tekst = tekst.slice(1);
  const model = { bom, records: new Map(), extra: {} };
  if (tekst.trim() === '') return { ok: true, model, meldingen };
  let data;
  try { data = JSON.parse(tekst); } catch (e) { return { ok: false, reden: 'geen-json', meldingen: [] }; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) return { ok: false, reden: 'geen-json', meldingen: [] };
  const v = formaatGetal(data.versie);
  if (v === null || v < formaatGetal(FORMAAT)) return { ok: false, reden: 'onbekend-formaat', meldingen: [] };
  if (v > formaatGetal(FORMAAT)) return { ok: false, reden: 'nieuwer-formaat', meldingen: [] };
  const voegToe = (soort, vast, obj) => {
    const rec = { soort, vast: vast.map((x) => String(x).normalize('NFC').replace(/\s+/g, ' ').trim()), velden: new Map() };
    if (rec.vast.some((x) => x === '')) return;
    for (const k of Object.keys(obj || {})) {
      const w = uitJson(soort, k, obj[k]);
      if (w === '' || w === null || w === undefined) continue;
      rec.velden.set(veldIntern(soort, k), w);
    }
    const s = sleutel(soort, rec.vast);
    const bestaand = model.records.get(s);
    if (bestaand) {
      /* Dezelfde naam twee keer (verschil alleen in hoofdletters of spaties):
         samenvoegen, de eerste wint bij verschil, en melden. */
      for (const [k, w] of rec.velden) if (!bestaand.velden.has(k)) bestaand.velden.set(k, w);
      meldingen.push({ soort: 'dubbele-naam', recordsoort: soort, naam: rec.vast[rec.vast.length - 1] });
    } else model.records.set(s, rec);
  };
  for (const k of Object.keys(data)) {
    const soort = SECTIE_SOORT[k];
    const deel = data[k];
    if (k === 'versie') continue;
    if (!soort) { model.extra[k] = deel; continue; }
    if (soort === 'hernoemd') {
      for (const h of Array.isArray(deel) ? deel : []) {
        if (!h || typeof h !== 'object' || !h.soort || !h.oud) continue;
        const rest = Object.assign({}, h); delete rest.soort; delete rest.oud;
        voegToe('hernoemd', [h.soort, h.oud], rest);
      }
      continue;
    }
    if (!deel || typeof deel !== 'object' || Array.isArray(deel)) continue;
    for (const naam of Object.keys(deel)) voegToe(soort, [naam], deel[naam]);
  }
  return { ok: true, model, meldingen };
}

/* Formaat: datum en tijd van de laatste formaatwijziging, in hex (zoals het
   versiestempel van de app): 1352902-3FF = 20261122, 10:23. */
function formaatGetal(v) {
  const m = /^([0-9A-F]{1,8})-([0-9A-F]{1,4})$/i.exec(String(v || ''));
  return m ? parseInt(m[1], 16) * 10000 + parseInt(m[2], 16) : null;
}
/* JSON-waarde ↔ interne veldwaarde (tekst; lijsten met |). */
function uitJson(soort, k, w) {
  if (soort === 'artikel' && k === 'ligt' && w && typeof w === 'object' && !Array.isArray(w)) {
    return plekTekst(Object.keys(w).map((winkel) => ({ winkel, afd: typeof w[winkel] === 'string' ? w[winkel] : '' })));
  }
  if (Array.isArray(w) && LIJSTVELDEN[veldIntern(soort, k)]) return w.map(String).filter((x) => x !== '').join('|');
  if (typeof w === 'string') return w;
  return w; // onbekend: ongewijzigd bewaren
}
function naarJson(soort, k, w) {
  if (typeof w !== 'string') return w;
  if (soort === 'artikel' && k === 'ligt') {
    const o = {};
    for (const p of plekLijst(w)) o[p.winkel] = p.afd;
    return o;
  }
  if (LIJSTVELDEN[k]) return lijst(w);
  return w;
}
function veldIntern(soort, k) { return soort === 'winkel' && k === 'afdelingen' ? 'route' : k; }
function veldExtern(soort, k) { return soort === 'winkel' && k === 'route' ? 'afdelingen' : k; }

/* model → JSON-tekst: één record per regel, op naam, velden in vaste volgorde. */
function schrijfBestand(model) {
  const perSoort = {};
  for (const r of model.records.values()) (perSoort[r.soort] = perSoort[r.soort] || []).push(r);
  const velden = (r) => {
    const volgorde = VELDVOLGORDE[r.soort] || [];
    const ks = volgorde.filter((k) => r.velden.has(k)).concat(Array.from(r.velden.keys()).filter((k) => volgorde.indexOf(k) === -1));
    const o = {};
    for (const k of ks) {
      const w = r.velden.get(k);
      if (w === undefined || w === null || w === '') continue;
      o[veldExtern(r.soort, k)] = naarJson(r.soort, k, w);
    }
    return o;
  };
  const delen = ['"versie": ' + JSON.stringify(FORMAAT)];
  for (const sectie of Object.keys(SECTIE_SOORT)) {
    const soort = SECTIE_SOORT[sectie];
    const recs = (perSoort[soort] || []).sort((a, b) => {
      for (let i = 0; i < a.vast.length; i++) { const c = SORTEER.compare(a.vast[i] || '', b.vast[i] || ''); if (c) return c; }
      return 0;
    });
    let regels;
    if (soort === 'hernoemd') {
      regels = recs.map((r) => JSON.stringify(Object.assign({ soort: r.vast[0], oud: r.vast[1] }, velden(r))));
      delen.push(JSON.stringify(sectie) + ': ' + (regels.length ? '[\n ' + regels.join(',\n ') + '\n]' : '[]'));
    } else {
      regels = recs.map((r) => JSON.stringify(r.vast[0]) + ': ' + JSON.stringify(velden(r)));
      delen.push(JSON.stringify(sectie) + ': ' + (regels.length ? '{\n ' + regels.join(',\n ') + '\n}' : '{}'));
    }
  }
  for (const k of Object.keys(model.extra || {})) delen.push(JSON.stringify(k) + ': ' + JSON.stringify(model.extra[k]));
  return '{\n' + delen.join(',\n') + '\n}\n';
}

function lijst(w) { return w ? String(w).split('|').filter((x) => x !== '') : []; }

/* Waar een artikel te koop is: ligt=Albert Heijn:Zuivel|Plus:Koeling|Jumbo
   (winkel, dan na de eerste : de afdeling in die winkel; zonder : nog onbekend).
   Leeg = nog nergens vastgelegd: dan staat het in elke winkel bovenaan. */
function plekLijst(w) {
  return lijst(w).map((x) => { const i = x.indexOf(':'); return i < 0 ? { winkel: x, afd: '' } : { winkel: x.slice(0, i), afd: x.slice(i + 1) }; });
}
function plekTekst(plekken) { return plekken.map((p) => p.afd ? p.winkel + ':' + p.afd : p.winkel).join('|'); }
function plekkenVan(r) { return plekLijst(r.velden.get('ligt')); }
function zetPlekken(r, plekken) {
  if (plekken.length) r.velden.set('ligt', plekTekst(plekken)); else r.velden.delete('ligt');
}

/* Zoekt een record; via een hernoemd-spoor ook onder een oude naam. */
function vindRecord(model, soort, naam) {
  let n = naam;
  for (let stap = 0; stap < 6; stap++) {
    const r = model.records.get(sleutel(soort, [n]));
    if (r) return r;
    const spoor = model.records.get(sleutel('hernoemd', [soort, n]));
    if (!spoor || !spoor.velden.get('nieuw')) return null;
    n = spoor.velden.get('nieuw');
  }
  return null;
}

/* Hernoemen: verwijzingen meenemen en een spoor achterlaten. */
function hernoem(model, rec, nieuweNaam, nu) {
  const oud = rec.vast[0];
  model.records.delete(sleutel(rec.soort, rec.vast));
  rec.vast = [nieuweNaam];
  model.records.set(sleutel(rec.soort, rec.vast), rec);
  const oudN = normNaam(oud);
  for (const r of model.records.values()) {
    if (rec.soort === 'winkel' && r.soort === 'artikel' && r.velden.has('ligt')) {
      r.velden.set('ligt', plekTekst(plekLijst(r.velden.get('ligt')).map((p) =>
        normNaam(p.winkel) === oudN ? { winkel: nieuweNaam, afd: p.afd } : p)));
    }
  }
  if (normNaam(oud) === normNaam(nieuweNaam)) return; // alleen hoofdletters of spaties: geen spoor nodig
  model.records.set(sleutel('hernoemd', [rec.soort, oud]), {
    soort: 'hernoemd', vast: [rec.soort, oud], velden: new Map([['nieuw', nieuweNaam], ['op', datumTekst(nu)]]), los: []
  });
}

/* Past één handeling toe op het model. Geeft { status, vorige? }:
   ok, al (er gebeurde al hetzelfde), heropend, botsing (toegepast; vorige
   waarde erbij voor 'andere versie terugzetten'), vervallen (bestaat niet
   meer of de nieuwe naam is al bezet). */
function pasToe(model, h, nu) {
  const nuD = nu || new Date();
  if (h.actie === 'nieuw') {
    const r = vindRecord(model, h.soort, h.naam);
    if (r) {
      if (h.soort === 'artikel') {
        if (r.velden.get('op')) return { status: 'al' };
        r.velden.set('op', h.t);
        if (h.wie) r.velden.set('opdoor', h.wie);
        return { status: 'ok' };
      }
      if (h.soort === 'actie' && r.velden.get('klaar')) {
        r.velden.delete('klaar'); r.velden.delete('door');
        return { status: 'heropend' };
      }
      return { status: 'al' };
    }
    const velden = new Map();
    for (const k of Object.keys(h.velden || {})) if (h.velden[k] !== '' && h.velden[k] != null) velden.set(k, String(h.velden[k]));
    model.records.set(sleutel(h.soort, [h.naam]), { soort: h.soort, vast: [h.naam], velden, los: [] });
    return { status: 'ok' };
  }
  const r = vindRecord(model, h.soort, h.naam);
  if (h.actie === 'weg') {
    if (!r) return { status: 'al' };
    model.records.delete(sleutel(r.soort, r.vast));
    if (r.soort === 'winkel') {
      /* Een verwijderde winkel verdwijnt ook bij de artikelen. */
      const n = normNaam(r.vast[0]);
      for (const a of model.records.values()) {
        if (a.soort !== 'artikel') continue;
        const voor = plekkenVan(a);
        const na = voor.filter((p) => normNaam(p.winkel) !== n);
        if (na.length !== voor.length) zetPlekken(a, na);
      }
    }
    return { status: 'ok' };
  }
  if (!r) return { status: 'vervallen' };
  if (h.actie === 'hernoem') {
    if (normNaam(r.vast[0]) === normNaam(h.nieuw)) {
      if (r.vast[0] === h.nieuw) return { status: 'al' };
    } else if (model.records.has(sleutel(h.soort, [h.nieuw]))) {
      return { status: 'vervallen', reden: 'naam-bezet' };
    }
    hernoem(model, r, h.nieuw, nuD);
    return { status: 'ok' };
  }
  if (h.actie === 'gekocht') {
    const data = lijst(r.velden.get('gekocht'));
    if (data.indexOf(h.datum) === -1) data.push(h.datum);
    data.sort();
    r.velden.set('gekocht', data.slice(-MAX_GEKOCHT).join('|'));
    return { status: 'ok' };
  }
  if (h.actie === 'nietGekocht') {
    const data = lijst(r.velden.get('gekocht')).filter((d) => d !== h.datum);
    if (data.length) r.velden.set('gekocht', data.join('|')); else r.velden.delete('gekocht');
    return { status: 'ok' };
  }
  if (h.actie === 'plaats') {
    /* Te koop in deze winkel, eventueel met de afdeling daar. Botst niet met
       een plaatsing in een andere winkel. */
    const plekken = plekkenVan(r);
    const oud = plekken.find((p) => normNaam(p.winkel) === normNaam(h.winkel));
    if (oud && oud.afd === (h.afd || '')) return { status: 'al' };
    zetPlekken(r, plekken.filter((p) => p !== oud).concat([{ winkel: oud ? oud.winkel : h.winkel, afd: h.afd || '' }]));
    return { status: 'ok' };
  }
  if (h.actie === 'volgorde') {
    /* Nieuwe volgorde van de afdelingen van een winkel. Wat de ander intussen
       toevoegde blijft achteraan staan; wat hij weghaalde blijft weg. */
    const cur = lijst(r.velden.get('route'));
    const curN = cur.map(normNaam);
    const nieuw = h.volgorde.filter((x) => curN.indexOf(normNaam(x)) !== -1).map((x) => cur[curN.indexOf(normNaam(x))]);
    for (const x of cur) if (!nieuw.some((y) => normNaam(y) === normNaam(x))) nieuw.push(x);
    if (nieuw.join('|') === cur.join('|')) return { status: 'al' };
    r.velden.set('route', nieuw.join('|'));
    return { status: 'ok' };
  }
  if (h.actie === 'afdHernoem' || h.actie === 'afdWeg') {
    /* Een afdeling van één winkel hernoemen of weghalen; de artikelen die daar
       liggen gaan mee (bij weghalen: nog te koop in die winkel, afdeling onbekend). */
    const cur = lijst(r.velden.get('route'));
    const i = cur.findIndex((x) => normNaam(x) === normNaam(h.afd));
    if (i === -1) return { status: h.actie === 'afdWeg' ? 'al' : 'vervallen' };
    if (h.actie === 'afdHernoem') {
      if (cur.some((x, j) => j !== i && normNaam(x) === normNaam(h.nieuw))) return { status: 'vervallen', reden: 'naam-bezet' };
      if (cur[i] === h.nieuw) return { status: 'al' };
      cur[i] = h.nieuw;
    } else cur.splice(i, 1);
    if (cur.length) r.velden.set('route', cur.join('|')); else r.velden.delete('route');
    const w = normNaam(r.vast[0]), oud = normNaam(h.afd);
    for (const a of model.records.values()) {
      if (a.soort !== 'artikel' || !a.velden.has('ligt')) continue;
      const pl = plekLijst(a.velden.get('ligt'));
      let veranderd = false;
      for (const p of pl) if (normNaam(p.winkel) === w && normNaam(p.afd) === oud) { p.afd = h.actie === 'afdHernoem' ? h.nieuw : ''; veranderd = true; }
      if (veranderd) a.velden.set('ligt', plekTekst(pl));
    }
    return { status: 'ok' };
  }
  if (h.actie === 'lijstErbij') {
    /* Een element aan een lijstveld toevoegen (zoals een afdeling aan een route);
       botst nooit, ook niet als de ander tegelijk iets toevoegt. */
    const items = lijst(r.velden.get(h.veld));
    if (items.some((x) => normNaam(x) === normNaam(h.waarde))) return { status: 'al' };
    items.push(h.waarde);
    r.velden.set(h.veld, items.join('|'));
    return { status: 'ok' };
  }
  if (h.actie === 'zet') {
    const cur = r.velden.get(h.veld) || '';
    const oud = h.oud || '', nieuw = h.nieuw || '';
    const zet = () => { if (nieuw === '') r.velden.delete(h.veld); else r.velden.set(h.veld, nieuw); };
    if (cur === nieuw) return { status: 'al' };
    if (cur === oud) { zet(); return { status: 'ok' }; }
    if (h.veld === 'op' || h.veld === 'opdoor') {
      /* Op of van de lijst: staat het er bij beiden op, dan is er niets te doen;
         anders wint de laatste handeling, zonder melding. */
      if (h.veld === 'op' && cur !== '' && nieuw !== '') return { status: 'al' };
      zet();
      return { status: 'ok' };
    }
    zet();
    return { status: 'botsing', vorige: cur };
  }
  return { status: 'vervallen', reden: 'onbekende-handeling' };
}

/* Het laatste moment (dag + tijd) op of vóór nu, in lokale tijd. */
const WEEKDAG = { zo: 0, ma: 1, di: 2, wo: 3, do: 4, vr: 5, za: 6 };
function laatsteMoment(nu, dag, tijd) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(tijd || '');
  if (!(dag in WEEKDAG) || !m) return null;
  const d = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate(), +m[1], +m[2]);
  d.setDate(d.getDate() - ((d.getDay() - WEEKDAG[dag] + 7) % 7));
  if (d > nu) d.setDate(d.getDate() - 7);
  return d;
}

/* Wekelijkse artikelen terug op de lijst. Geen handeling in de wachtrij: elke
   telefoon rekent het uit tegen het bestand, zodat een telefoon die offline was
   net gekochte artikelen niet opnieuw op de lijst zet. Geeft het aantal. */
function wekelijksTerug(model, nu) {
  const inst = model.records.get(sleutel('instelling', ['wekelijks']));
  if (!inst) return 0;
  const moment = laatsteMoment(nu, inst.velden.get('dag'), inst.velden.get('tijd'));
  if (!moment) return 0;
  const mTekst = tijdstipTekst(moment), mDatum = datumTekst(moment);
  const vorige = inst.velden.get('teruggezet') || '';
  if (vorige >= mTekst) return 0;
  inst.velden.set('teruggezet', mTekst);
  if (vorige === '') return 0; // eerste keer: alleen het moment vastleggen
  let n = 0;
  for (const r of model.records.values()) {
    if (r.soort !== 'artikel' || r.velden.get('soort') !== 'wekelijks' || r.velden.get('op')) continue;
    if (lijst(r.velden.get('gekocht')).some((d) => d >= mDatum)) continue;
    r.velden.set('op', mTekst);
    r.velden.delete('opdoor');
    n++;
  }
  return n;
}

/* Opruimen: sporen van hernoemen na 30 dagen, afgeronde acties zonder herhaling
   na 92 dagen, eenmalige artikelen die 365 dagen niet gekocht zijn. */
function opruimen(model, nu) {
  const grens = (dagen) => datumTekst(new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() - dagen));
  let n = 0;
  for (const [s, r] of Array.from(model.records)) {
    let weg = false;
    if (r.soort === 'hernoemd') weg = (r.velden.get('op') || '') < grens(30);
    else if (r.soort === 'actie' && r.velden.get('klaar') && !r.velden.get('herhaal')) weg = r.velden.get('klaar') < grens(92);
    else if (r.soort === 'artikel' && r.velden.get('soort') === 'eenmalig' && !r.velden.get('op')) {
      const g = lijst(r.velden.get('gekocht'));
      weg = g.length > 0 && g[g.length - 1] < grens(365);
    }
    if (weg) { model.records.delete(s); n++; }
  }
  return n;
}

/* Eén synchronisatieronde, zonder netwerk: de nieuwste tekst uit OneDrive plus de
   wachtrij → de tekst om terug te schrijven. Geeft { ok, tekst, resultaten,
   gewijzigd } of { ok: false, reden }. */
function synchroniseer(remote, wachtrij, nu) {
  const gelezen = leesBestand(remote);
  if (!gelezen.ok) return { ok: false, reden: gelezen.reden };
  const model = gelezen.model;
  const voor = schrijfBestand(model);
  if (!model.records.has(sleutel('instelling', ['wekelijks']))) {
    model.records.set(sleutel('instelling', ['wekelijks']), { soort: 'instelling', vast: ['wekelijks'], velden: new Map([['dag', 'za'], ['tijd', '06:00']]) });
  }
  const resultaten = wachtrij.map((h) => Object.assign({ h }, pasToe(model, h, nu)));
  const terug = wekelijksTerug(model, nu);
  opruimen(model, nu);
  const tekst = schrijfBestand(model);
  return { ok: true, tekst, resultaten, terug, meldingen: gelezen.meldingen, gewijzigd: tekst !== voor || model.bom };
}

/* ---------- weergave van artikelen (stap 6) ---------- */
const SOORT_LETTER = { eenmalig: 'E', wekelijks: 'W', regelmatig: 'R' };
const LETTER_SOORT = { E: 'eenmalig', W: 'wekelijks', R: 'regelmatig' };
const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

/* Alle artikelen, op naam gesorteerd, met de velden die het scherm nodig heeft.
   Een artikel zonder (bekende) soort telt als eenmalig. */
function artikelLijst(model) {
  const uit = [];
  for (const r of model.records.values()) {
    if (r.soort !== 'artikel') continue;
    const soort = SOORT_LETTER[r.velden.get('soort')] ? r.velden.get('soort') : 'eenmalig';
    uit.push({
      naam: r.vast[0], sleutel: normNaam(r.vast[0]), zoek: zoekVorm(r.vast[0]), soort, letter: SOORT_LETTER[soort],
      plekken: plekkenVan(r),
      op: r.velden.get('op') || '', opdoor: r.velden.get('opdoor') || '',
      gekocht: lijst(r.velden.get('gekocht'))
    });
  }
  return uit.sort((a, b) => SORTEER.compare(a.naam, b.naam));
}

function dagNummer(datum) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(datum);
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : NaN;
}

/* Suggestie op basis van koopgedrag: minstens drie aankopen, en langer geleden
   dan het gebruikelijke interval (de mediaan van de tussenpozen). */
function suggestie(gekocht, vandaag) {
  const d = gekocht.map(dagNummer).filter((x) => !isNaN(x)).sort((a, b) => a - b);
  if (d.length < 3) return null;
  const gaten = [];
  for (let i = 1; i < d.length; i++) if (d[i] > d[i - 1]) gaten.push(d[i] - d[i - 1]);
  if (gaten.length < 2) return null;
  gaten.sort((a, b) => a - b);
  const mid = Math.floor(gaten.length / 2);
  const interval = gaten.length % 2 ? gaten[mid] : Math.round((gaten[mid - 1] + gaten[mid]) / 2);
  const laatst = d[d.length - 1];
  if (dagNummer(vandaag) - laatst < interval) return null;
  return { laatst, interval };
}

function suggestieTekst(s) {
  const dt = new Date(s.laatst * 86400000);
  const elke = s.interval >= 14 ? 'elke ' + Math.round(s.interval / 7) + ' weken'
    : s.interval === 7 ? 'elke week'
    : s.interval === 1 ? 'elke dag' : 'elke ' + s.interval + ' dagen';
  return 'laatst ' + dt.getUTCDate() + ' ' + MAANDEN[dt.getUTCMonth()] + ' · meestal ' + elke;
}

/* Zoeken: bevat de tekst, zonder verschil in hoofdletters en spaties. */
function zoekArtikelen(artikelen, tekst) {
  const t = zoekVorm(tekst);
  if (!t) return [];
  return artikelen.filter((a) => a.zoek.indexOf(t) !== -1);
}

/* ---------- winkel (stap 7) ---------- */
function winkelLijst(model) {
  const uit = [];
  for (const r of model.records.values()) {
    if (r.soort === 'winkel') uit.push({ naam: r.vast[0], route: lijst(r.velden.get('route')) });
  }
  return uit.sort((a, b) => SORTEER.compare(a.naam, b.naam));
}


/* Is dit artikel te koop in deze winkel? */
function teKoopIn(a, winkelNaam) {
  const n = normNaam(winkelNaam);
  return !a.plekken.length || a.plekken.some((p) => normNaam(p.winkel) === n);
}
/* De afdeling van dit artikel in deze winkel ('' = nog onbekend). */
function afdelingIn(a, winkelNaam) {
  const p = a.plekken.find((x) => normNaam(x.winkel) === normNaam(winkelNaam));
  return p ? p.afd : '';
}

/* Deelt de artikelen op de lijst in voor één winkel:
   boven  — nog niet bekend waar het ligt (met "Waar ligt dit?")
   groepen — per afdeling, in looproute
   elders — niet te koop in deze winkel */
function winkelIndeling(artikelen, winkel) {
  const route = winkel ? winkel.route : [];
  const routeN = route.map(normNaam);
  const boven = [], elders = [];
  const perAfd = route.map(() => []);
  for (const a of artikelen) {
    if (!a.op) continue;
    if (winkel && !teKoopIn(a, winkel.naam)) { elders.push(a); continue; }
    const afd = winkel ? afdelingIn(a, winkel.naam) : '';
    const i = afd ? routeN.indexOf(normNaam(afd)) : -1;
    if (i === -1) boven.push(a); else perAfd[i].push(a);
  }
  const groepen = route.map((afd, i) => ({ afd, items: perAfd[i] })).filter((g) => g.items.length);
  return { boven, groepen, elders };
}

/* Voor de winkelkeuze: per winkel hoeveel van de lijst je er kunt halen. Alleen
   wat bij die winkel is vastgelegd telt; wat overal te koop is, telt nergens.
   Winkels met 0 vallen weg; meeste eerst. */
function winkelTellingen(artikelen, winkels) {
  const uit = [];
  for (const w of winkels) {
    const n = normNaam(w.naam);
    const hier = artikelen.filter((a) => a.op && a.plekken.some((p) => normNaam(p.winkel) === n));
    if (hier.length) uit.push({ naam: w.naam, aantal: hier.length, artikelen: hier.map((a) => a.naam) });
  }
  return uit.sort((x, y) => y.aantal - x.aantal || SORTEER.compare(x.naam, y.naam));
}

/* ---------- kleine hulpfuncties (getest in thuis-tests.cjs) ---------- */
function browserNaam(ua) {
  if (/\bEdg(A|iOS)?\//.test(ua)) return 'Edge';
  if (/SamsungBrowser\//.test(ua)) return 'Samsung Internet';
  if (/Firefox\//.test(ua)) return 'Firefox';
  if (/Chrome\//.test(ua)) return 'Chrome';
  return 'andere browser';
}

function base64url(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* De deellink van OneDrive als sleutel voor /shares (Microsoft Graph). */
function deelSleutel(link) {
  return 'u!' + base64url(new TextEncoder().encode(link.trim()));
}

function duurTekst(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' u ' + (m % 60) + ' min';
}

/* ---------- opslag in de browser: IndexedDB ---------- */
let __db = null;
function db() {
  if (__db) return __db;
  __db = new Promise((resolve, reject) => {
    const req = indexedDB.open('thuis', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return __db;
}
async function kvGet(sleutel) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const r = d.transaction('kv').objectStore('kv').get(sleutel);
    r.onsuccess = () => resolve(r.result === undefined ? null : r.result);
    r.onerror = () => reject(r.error);
  });
}
async function kvSet(sleutel, waarde) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction('kv', 'readwrite');
    t.objectStore('kv').put(waarde, sleutel);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}
async function kvDel(sleutel) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction('kv', 'readwrite');
    t.objectStore('kv').delete(sleutel);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

/* ---------- netwerk met tijdsgrens ---------- */
async function metGrens(url, init) {
  const ac = new AbortController();
  const klok = setTimeout(() => ac.abort(), GRENS);
  try {
    return await fetch(url, Object.assign({}, init || {}, { signal: ac.signal }));
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'geen antwoord binnen 10 s' : 'geen verbinding');
  } finally {
    clearTimeout(klok);
  }
}

/* ---------- aanmelden: eigen PKCE-flow, zonder externe bibliotheek ---------- */
function willekeurig(n) {
  const b = new Uint8Array(n);
  crypto.getRandomValues(b);
  return base64url(b);
}
async function sha256(tekst) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(tekst)));
}

async function aanmelden() {
  const verifier = willekeurig(48);
  const state = willekeurig(16);
  await kvSet('pkce', { verifier, state, t: Date.now() });
  const p = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT,
    response_mode: 'query',
    scope: SCOPE,
    state,
    code_challenge: base64url(await sha256(verifier)),
    code_challenge_method: 'S256'
  });
  location.assign(AUTH + '/authorize?' + p.toString());
}

async function tokenAanvraag(velden) {
  const body = new URLSearchParams(Object.assign({ client_id: CLIENT_ID, scope: SCOPE }, velden));
  const res = await metGrens(AUTH + '/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(json.error || ('code ' + res.status));
    err.opnieuwAanmelden = json.error === 'invalid_grant';
    throw err;
  }
  const nu = Date.now();
  const oud = (await kvGet('auth')) || {};
  const nieuw = {
    access: json.access_token,
    accessTot: nu + (json.expires_in || 3600) * 1000,
    refresh: json.refresh_token || oud.refresh,
    /* Vernieuwen verlengt de grens van 24 uur niet: die telt vanaf het aanmelden. */
    aangemeldOp: velden.grant_type === 'authorization_code' ? nu : oud.aangemeldOp,
    naam: oud.naam || ''
  };
  await kvSet('auth', nieuw);
  return nieuw;
}

async function terugVanMicrosoft() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', REDIRECT);
  const pkce = await kvGet('pkce');
  await kvDel('pkce');
  if (q.has('error')) {
    if (q.get('error') !== 'access_denied') melding('m-aanmelden', 'Aanmelden is niet gelukt (' + q.get('error') + ').', [{ tekst: 'Opnieuw aanmelden', actie: aanmelden }]);
    return;
  }
  if (!pkce || pkce.state !== q.get('state')) {
    melding('m-aanmelden', 'Aanmelden is niet gelukt: de aanmeldpoging is verlopen.', [{ tekst: 'Opnieuw aanmelden', actie: aanmelden }]);
    return;
  }
  try {
    await tokenAanvraag({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: pkce.verifier });
    meldingWeg('m-aanmelden');
  } catch (e) {
    melding('m-aanmelden', 'Aanmelden is niet gelukt (' + e.message + ').', [{ tekst: 'Opnieuw aanmelden', actie: aanmelden }]);
  }
}

/* Geeft een geldige toegangscode, of gooit een fout. Een verlopen aanmelding
   blokkeert niets: er komt een rustige melding met de weg terug. */
async function toegang() {
  const auth = await kvGet('auth');
  if (!auth || !auth.refresh) throw new Error('niet aangemeld');
  if (auth.access && auth.accessTot - Date.now() > 60000) return auth.access;
  try {
    return (await tokenAanvraag({ grant_type: 'refresh_token', refresh_token: auth.refresh })).access;
  } catch (e) {
    if (e.opnieuwAanmelden) {
      melding('m-aanmelden', 'De aanmelding bij Microsoft is verlopen.', [{ tekst: 'Opnieuw aanmelden', actie: aanmelden }]);
    }
    throw e;
  }
}

async function graph(pad, init) {
  const opt = Object.assign({}, init || {});
  opt.headers = Object.assign({ Authorization: 'Bearer ' + await toegang() }, opt.headers || {});
  return metGrens(pad.startsWith('http') ? pad : GRAPH + pad, opt);
}

/* Bij het openen: nadert de grens van 24 uur en is er netwerk, dan vraagt de app
   om opnieuw aan te melden — liever thuis bij het openen dan straks in de winkel.
   Eén tik; meestal hoeft er niets te worden ingevuld. */
async function aanmeldingOpTijd() {
  const auth = await kvGet('auth');
  if (!auth || !auth.aangemeldOp || !navigator.onLine) return;
  const over = AANMELD_GRENS - (Date.now() - auth.aangemeldOp);
  if (over < 4 * 3600 * 1000) {
    melding('m-aanmelden', over > 0
      ? 'De aanmelding bij Microsoft verloopt over ' + duurTekst(over) + '. Vernieuw hem nu, dan werkt alles straks ook onderweg.'
      : 'De aanmelding bij Microsoft is verlopen.', [{ tekst: 'Opnieuw aanmelden', actie: aanmelden }]);
  }
}

/* ---------- nieuwe versie (volgens conventies.md §3, naar het voorbeeld van trends) ---------- */
let updateBarShown = false;
function toonUpdateBalk() {
  if (updateBarShown) return;
  if ('serviceWorker' in navigator && !navigator.serviceWorker.controller) return;
  updateBarShown = true;
  melding('m-versie', 'Er is een nieuwe versie van thuis.', [{ tekst: 'Nu laden', actie: herlaadMetWachtendeWorker }], 'info');
}

function currentVersionStamp() {
  const el = $('app-version-stamp');
  const m = el && el.textContent.match(VERSION_RE);
  return m ? m[1] : null;
}

/* Het stempel staat in de pagina: de stroom lezen en stoppen zodra het gevonden is. */
async function stempelUitResponse(resp) {
  if (!resp.body || typeof resp.body.getReader !== 'function') {
    const m = (await resp.text()).match(VERSION_RE);
    return m ? m[1] : null;
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const m = buffer.match(VERSION_RE);
      if (m) return m[1];
      if (buffer.length > 8192) buffer = buffer.slice(-2048);
    }
  } catch (e) { return null; }
  finally { try { reader.cancel(); } catch (e) { /* al klaar */ } }
  return null;
}

async function cachedVersionStamp() {
  if (!('caches' in window)) return null;
  /* De cache is van het hele domein (ook golf-score, trends en events): alleen de
     eigen caches tellen, en zonder eigen cache meldt de app niets. */
  const namen = (await caches.keys()).filter((n) => n.startsWith(CACHE_PREFIX));
  if (!namen.length) return null;
  let nieuwste = null;
  for (const naam of namen) {
    try {
      const cache = await caches.open(naam);
      const resp = await cache.match(APP_FILE) || await cache.match('./' + APP_FILE) ||
        await cache.match(new URL(APP_FILE, location.href).href);
      if (!resp) continue;
      const gevonden = await stempelUitResponse(resp);
      if (gevonden && (nieuwste === null || gevonden > nieuwste)) nieuwste = gevonden;
    } catch (e) { /* deze cache overslaan, met de rest doorgaan */ }
  }
  return nieuwste;
}

async function checkAppUpdate() {
  if (updateBarShown || location.protocol === 'file:') return;
  try {
    const cur = currentVersionStamp();
    if (!cur) return;
    const cached = await cachedVersionStamp();
    if (cached && cached > cur) toonUpdateBalk();
  } catch (e) { /* stil: liever geen melding dan een valse */ }
}

let __herladen = false;
function herlaadNu() {
  if (__herladen) return;
  __herladen = true;
  location.reload();
}
function herlaadMetWachtendeWorker() {
  const wachtend = __swRegistratie && __swRegistratie.waiting;
  if (!wachtend) { herlaadNu(); return; }
  navigator.serviceWorker.addEventListener('controllerchange', herlaadNu, { once: true });
  setTimeout(herlaadNu, 3000);
  wachtend.postMessage({ type: 'nuOverstappen' });
}

const SW_UPDATE_INTERVAL = 30 * 60 * 1000;
let __swUpdateLaatst = 0;
let __swRegistratie = null;
function vraagSwUpdate() {
  if (!__swRegistratie) return;
  const nu = Date.now();
  if (nu - __swUpdateLaatst < SW_UPDATE_INTERVAL) return;
  __swUpdateLaatst = nu;
  __swRegistratie.update().catch(() => {});
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'kopieVernieuwd') checkAppUpdate();
  });
}
setTimeout(checkAppUpdate, 4000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  vraagSwUpdate();
  checkAppUpdate();
  toonStatus();
});
setInterval(() => {
  if (document.hidden) return;
  vraagSwUpdate();
  checkAppUpdate();
}, SW_UPDATE_INTERVAL);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-thuis.js').then((reg) => {
      __swRegistratie = reg;
      __swUpdateLaatst = Date.now();
      if (reg.waiting) toonUpdateBalk();
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state !== 'installed') return;
          if (reg.waiting) toonUpdateBalk(); else checkAppUpdate();
        });
      });
    }).catch(() => { /* zonder service worker werkt de app gewoon, alleen niet offline */ });
  });
}

/* ---------- gegevens: lokale kopie + wachtrij (stap 5) ---------- */
/* De app werkt altijd op de lokale kopie van thuis.json plus de wachtrij met
   handelingen die nog niet in OneDrive staan. Een handeling wordt meteen lokaal
   toegepast en na een korte pauze gebundeld verstuurd. */
const SYNC_PAUZE = 1500;
const VERVERS_GEWOON = 3 * 60 * 1000;
const BESTAND = 'thuis.json';

let kopie = null;          // { tekst, eTag, fileId, tijd }
let wachtrij = [];         // handelingen, oudste eerst
let model = null;          // kopie + wachtrij, voor de weergave
let artikelen = [];        // artikelLijst(model), één keer per wijziging
let ik = '';
let gekoppeld = false;
const sync = { bezig: false, opnieuw: false, klok: null, laatst: 0, fout: '', offline: false };

function bouwModel() {
  const gelezen = leesBestand(kopie ? kopie.tekst : '');
  model = gelezen.ok ? gelezen.model : leesBestand('').model;
  const nu = new Date();
  for (const h of wachtrij) pasToe(model, h, nu);
  artikelen = artikelLijst(model);
}

async function handelen(lijstVanHandelingen) {
  const t = tijdstipTekst(new Date());
  for (const h of lijstVanHandelingen) {
    const volledig = Object.assign({ t, wie: ik }, h);
    wachtrij.push(volledig);
    pasToe(model, volledig, new Date());
  }
  artikelen = artikelLijst(model);
  /* Eerst tekenen, dan opslaan: de tik is meteen zichtbaar. */
  tekenAlles();
  planSync(SYNC_PAUZE);
  await kvSet('wachtrij', wachtrij);
}

function planSync(ms) {
  clearTimeout(sync.klok);
  sync.klok = setTimeout(synchroniseerNu, ms);
}

async function synchroniseerNu() {
  if (navigator.locks && navigator.locks.request) {
    return navigator.locks.request('thuis-sync', { ifAvailable: true }, async (slot) => {
      if (!slot) { sync.opnieuw = true; return; }
      await syncRonde();
    });
  }
  return syncRonde();
}

async function bestandOphalen(map) {
  /* Eerst alleen de kenmerken; de inhoud pas als de eTag anders is. */
  const pad = kopie && kopie.fileId
    ? '/drives/' + map.driveId + '/items/' + kopie.fileId
    : '/drives/' + map.driveId + '/items/' + map.itemId + ':/' + BESTAND;
  const res = await graph(pad);
  if (res.status === 404) return { weg: true };
  if (!res.ok) throw new Error('lezen: code ' + res.status);
  const item = await res.json();
  if (kopie && kopie.eTag === item.eTag) return { item, tekst: kopie.tekst, bytes: null };
  const inhoud = await metGrens(item['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
  if (!inhoud.ok) throw new Error('downloaden: code ' + inhoud.status);
  return { item, bytes: new Uint8Array(await inhoud.arrayBuffer()) };
}

async function dagbackup(map, tekst) {
  const vandaag = datumTekst(new Date()).replace(/-/g, '');
  if ((await kvGet('backupDag')) === vandaag) return;
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/thuis_backup_' + vandaag + '.json:/content?@microsoft.graph.conflictBehavior=fail', {
    method: 'PUT', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: tekst
  });
  /* 409: de andere telefoon maakte de backup van vandaag al. */
  if (res.ok || res.status === 409) await kvSet('backupDag', vandaag);
}

async function syncRonde() {
  if (sync.bezig) { sync.opnieuw = true; return; }
  const auth = await kvGet('auth');
  const map = await kvGet('map');
  if (!auth || !auth.refresh || !map) { tekenWolk(); return; }
  if (!navigator.onLine) { sync.offline = true; tekenWolk(); return; }
  sync.bezig = true; sync.fout = ''; sync.offline = false; tekenWolk();
  try {
    for (let poging = 0; poging < 4; poging++) {
      let opgehaald = await bestandOphalen(map);
      if (opgehaald.weg) {
        if (kopie && kopie.fileId) {
          /* Een bestand dat er was en nu weg is, wordt niet stil opnieuw gemaakt. */
          melding('m-weg', [{ vet: BESTAND }, ' staat niet meer in de map ', { vet: map.naam }, '. Er is niets opgeslagen.'], [
            { tekst: 'Nieuw bestand maken', actie: async () => { kopie = null; await kvDel('kopie'); meldingWeg('m-weg'); planSync(0); } }
          ]);
          return;
        }
        const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/' + BESTAND + ':/content?@microsoft.graph.conflictBehavior=fail', {
          method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: schrijfBestand(leesBestand('').model)
        });
        if (!res.ok && res.status !== 409) throw new Error('aanmaken: code ' + res.status);
        continue;
      }
      meldingWeg('m-weg');
      const remote = opgehaald.bytes || opgehaald.tekst;
      const inBehandeling = wachtrij.slice();
      const remoteTekst = typeof remote === 'string' ? remote : new TextDecoder().decode(remote);
      const ronde = synchroniseer(remote, inBehandeling, new Date());
      if (!ronde.ok) {
        melding('m-utf8', BESTAND + ' ' + ({
          'geen-utf8': 'is niet in UTF-8 opgeslagen.',
          'geen-json': 'is beschadigd.',
          'nieuwer-formaat': 'is gemaakt door een nieuwere versie van de app. Werk de app bij.',
          'onbekend-formaat': 'heeft een onbekend formaat.'
        }[ronde.reden] || 'is niet te lezen.') + ' De app schrijft er niets in.', []);
        return;
      }
      meldingWeg('m-utf8');
      if (!ronde.gewijzigd) {
        kopie = { bestand: BESTAND, tekst: remoteTekst, eTag: opgehaald.item.eTag, fileId: opgehaald.item.id, tijd: Date.now() };
        wachtrij = wachtrij.slice(inBehandeling.length);
        break;
      }
      await dagbackup(map, remoteTekst);
      const res = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag },
        body: ronde.tekst
      });
      if (res.status === 412) continue; // intussen gewijzigd: opnieuw lezen en toepassen
      if (!res.ok) throw new Error('schrijven: code ' + res.status);
      const item = await res.json();
      kopie = { bestand: BESTAND, tekst: ronde.tekst, eTag: item.eTag, fileId: item.id, tijd: Date.now() };
      wachtrij = wachtrij.slice(inBehandeling.length);
      meldResultaten(ronde.resultaten);
      break;
    }
    await kvSet('kopie', kopie);
    await kvSet('wachtrij', wachtrij);
    sync.laatst = Date.now();
    bouwModel();
    tekenAlles();
  } catch (e) {
    sync.fout = e.message;
    if (!navigator.onLine || /verbinding|10 s/.test(e.message)) sync.offline = true;
  } finally {
    sync.bezig = false;
    tekenWolk();
    if (sync.opnieuw) { sync.opnieuw = false; planSync(SYNC_PAUZE); }
    else if (wachtrij.length && !sync.offline && !sync.fout) planSync(SYNC_PAUZE);
  }
}

function meldResultaten(resultaten) {
  const vervallen = resultaten.filter((r) => r.status === 'vervallen').map((r) => r.h.naam);
  if (vervallen.length) {
    melding('m-vervallen', ['Niet doorgevoerd, want intussen verwijderd of hernoemd: ', { vet: vervallen.join(', ') }, '.'],
      [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-vervallen') }]);
  }
  const botsing = resultaten.filter((r) => r.status === 'botsing');
  if (botsing.length) {
    const r = botsing[botsing.length - 1];
    melding('m-botsing', [{ vet: r.h.naam }, ' was intussen ook gewijzigd. Jouw versie staat erin; de andere was: "' + r.vorige + '".'], [
      { tekst: 'Andere terugzetten', actie: () => { meldingWeg('m-botsing'); handelen([{ actie: 'zet', soort: r.h.soort, naam: r.h.naam, veld: r.h.veld, oud: r.h.nieuw, nieuw: r.vorige }]); } },
      { tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-botsing') }
    ]);
  }
}

function tekenWolk() {
  kvGet('map').then((map) => kvGet('auth').then((auth) => {
    let tekst;
    if (!auth || !auth.refresh) tekst = 'niet aangemeld';
    else if (!map) tekst = 'geen map';
    else if (sync.bezig) tekst = 'bezig…';
    else if (sync.offline) tekst = 'offline' + (wachtrij.length ? ' · ' + wachtrij.length : '');
    else if (sync.fout) tekst = 'niet gelukt';
    else if (sync.laatst) tekst = new Date(sync.laatst).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    else tekst = 'gekoppeld';
    $('wolkTekst').textContent = tekst;
    $('wolk').setAttribute('aria-label', 'Synchroniseren: ' + tekst + (sync.fout ? ' (' + sync.fout + ')' : ''));
  }));
}

/* ---------- gegevens: lokale kopie + wachtrij (stap 5) ---------- */
/* De app werkt altijd op de lokale kopie van thuis.json plus de wachtrij met
   handelingen die nog niet in OneDrive staan. Een handeling wordt meteen lokaal
   toegepast en na een korte pauze gebundeld verstuurd. */
const SYNC_PAUZE = 1500;
const VERVERS_GEWOON = 3 * 60 * 1000;
const BESTAND = 'thuis.json';

let kopie = null;          // { formaat, tekst, eTag, fileId, tijd }
let wachtrij = [];         // handelingen, oudste eerst
let model = null;          // kopie + wachtrij, voor de weergave
let artikelen = [];        // artikelLijst(model), één keer per wijziging
let winkels = [];          // winkelLijst(model), één keer per wijziging
let winkelOpId = new Map();
let ik = '';
let gekoppeld = false;
const sync = { bezig: false, opnieuw: false, klok: null, laatst: 0, fout: '', offline: false };

function nieuweId() { return maakId(model, (n) => crypto.getRandomValues(new Uint8Array(n))); }

function afgeleid() {
  artikelen = artikelLijst(model);
  winkels = winkelLijst(model);
  winkelOpId = new Map(winkels.map((w) => [w.id, w]));
}

function bouwModel() {
  const gelezen = leesBestand(kopie ? kopie.tekst : '');
  model = gelezen.ok ? gelezen.model : leegModel();
  const { alias } = pasAllesToe(model, wachtrij);
  if (alias.size) vervangLokaal(alias);
  afgeleid();
}

/* Bewaren op de telefoon. Mislukt het, dan een melding die blijft staan tot het
   weer lukt: wat niet bewaard is, gaat verloren als de app sluit. */
const nietBewaard = new Set();
async function bewaar(sleutelKv, waarde) {
  try {
    await kvSet(sleutelKv, waarde);
    nietBewaard.delete(sleutelKv);
  } catch (e) {
    nietBewaard.add(sleutelKv);
  }
  if (nietBewaard.size) {
    melding('m-opslag', 'Opslaan niet gelukt', [{ tekst: 'Opnieuw proberen', actie: () => bewaarOpnieuw() }]);
  } else meldingWeg('m-opslag');
}
function bewaarOpnieuw() {
  for (const k of Array.from(nietBewaard)) {
    if (k === 'wachtrij') bewaar('wachtrij', wachtrij);
    else if (k === 'kopie') bewaar('kopie', kopie);
    else if (k === 'mandje') bewaar('mandje', Array.from(winkel.mandje.values()));
    else if (k === 'favorieten') bewaar('favorieten', ws.favorieten);
    else if (k === 'winkel') bewaar('winkel', winkel.id);
  }
}

async function handelen(lijstVanHandelingen) {
  const t = tijdstipTekst(new Date());
  const nieuw = lijstVanHandelingen.map((h) => Object.assign({ t, wie: ik }, h));
  wachtrij.push(...nieuw);
  const { alias } = pasAllesToe(model, nieuw);
  if (alias.size) vervangLokaal(alias);
  afgeleid();
  /* Eerst tekenen, dan opslaan: de tik is meteen zichtbaar. */
  tekenAlles();
  planSync(SYNC_PAUZE);
  await bewaar('wachtrij', wachtrij);
}

/* Een id die bij het samenvoegen in een bestaande opging (twee keer "Melk"):
   ook de wachtrij en wat deze telefoon bewaart, wijzen voortaan naar de
   bestaande. */
function vervangLokaal(alias) {
  wachtrij = wachtrij.map((h) => vervangIds(h, alias));
  const a = (id) => (alias.has(id) ? alias.get(id) : id);
  if (winkel.id && alias.has(winkel.id)) { winkel.id = a(winkel.id); bewaar('winkel', winkel.id); }
  if (ws.favorieten.some((f) => alias.has(f))) { ws.favorieten = Array.from(new Set(ws.favorieten.map(a))); bewaar('favorieten', ws.favorieten); }
  if (ws.open) ws.open = a(ws.open);
  let mandjeAnders = false;
  for (const [id, m] of Array.from(winkel.mandje)) {
    if (!alias.has(id)) continue;
    winkel.mandje.delete(id);
    winkel.mandje.set(a(id), Object.assign({}, m, { id: a(id) }));
    mandjeAnders = true;
  }
  for (const m of winkel.mandje.values()) if (alias.has(m.winkel)) { m.winkel = a(m.winkel); mandjeAnders = true; }
  if (mandjeAnders) bewaar('mandje', Array.from(winkel.mandje.values()));
}

function planSync(ms) {
  clearTimeout(sync.klok);
  sync.klok = setTimeout(synchroniseerNu, ms);
}

async function synchroniseerNu() {
  if (navigator.locks && navigator.locks.request) {
    return navigator.locks.request('thuis-sync', { ifAvailable: true }, async (slot) => {
      if (!slot) { sync.opnieuw = true; return; }
      await syncRonde();
    });
  }
  return syncRonde();
}

async function bestandOphalen(map) {
  /* Eerst alleen de kenmerken; de inhoud pas als de eTag anders is. */
  const pad = kopie && kopie.fileId
    ? '/drives/' + map.driveId + '/items/' + kopie.fileId
    : '/drives/' + map.driveId + '/items/' + map.itemId + ':/' + BESTAND;
  const res = await graph(pad);
  if (res.status === 404) return { weg: true };
  if (!res.ok) throw new Error('lezen: code ' + res.status);
  const item = await res.json();
  if (kopie && kopie.eTag === item.eTag) return { item, tekst: kopie.tekst, bytes: null };
  const inhoud = await metGrens(item['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
  if (!inhoud.ok) throw new Error('downloaden: code ' + inhoud.status);
  return { item, bytes: new Uint8Array(await inhoud.arrayBuffer()) };
}

/* Elke dag één backup van de versie van vóór het eerste schrijven; daarna de
   oude opruimen (backupsWeg). Opruimen mag mislukken: dan de volgende dag. */
async function dagbackup(map, tekst) {
  const vandaag = datumTekst(new Date());
  const kort = vandaag.replace(/-/g, '');
  if ((await kvGet('backupDag')) === kort) return;
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/thuis_backup_' + kort + '.json:/content?@microsoft.graph.conflictBehavior=fail', {
    method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: tekst
  });
  /* 409: de andere telefoon maakte de backup van vandaag al. */
  if (!res.ok && res.status !== 409) return;
  await bewaar('backupDag', kort);
  try {
    const lijstRes = await graph('/drives/' + map.driveId + '/items/' + map.itemId + '/children?$select=id,name&$top=999');
    if (!lijstRes.ok) return;
    const items = (await lijstRes.json()).value || [];
    const weg = new Set(backupsWeg(items.map((i) => i.name), vandaag));
    for (const i of items) {
      if (weg.has(i.name)) await graph('/drives/' + map.driveId + '/items/' + i.id, { method: 'DELETE' });
    }
  } catch (e) { /* volgende dag opnieuw */ }
}

/* Logboek van wat de app stil rechtzette (voor het sync-overzicht, stap 9). */
async function logboek(regels) {
  if (!regels.length) return;
  const tijd = tijdstipTekst(new Date()).replace('T', ' ');
  const oud = (await kvGet('logboek')) || [];
  await bewaar('logboek', oud.concat(regels.map((r) => tijd + ' · ' + r)).slice(-100));
}

const LEESREDEN = {
  'geen-utf8': 'is niet in UTF-8 opgeslagen.',
  'geen-json': 'is beschadigd.',
  'onjuiste-opbouw': 'heeft een opbouw die de app niet kent.',
  'nieuwer-formaat': 'is gemaakt door een nieuwere versie van de app. Werk de app bij.',
  'onbekend-formaat': 'heeft een onbekend formaat.'
};

/* Nog geen bestand: een leeg aanmaken. Een bestand dat er was en nu weg is,
   wordt niet stil opnieuw gemaakt (dan een melding; geeft false). */
async function bestandMaken(map) {
  if (kopie && kopie.fileId) {
    melding('m-weg', [{ vet: BESTAND }, ' staat niet meer in de map ', { vet: map.naam }, '. Er is niets opgeslagen.'], [
      { tekst: 'Nieuw bestand maken', actie: async () => { kopie = null; await kvDel('kopie'); meldingWeg('m-weg'); planSync(0); } }
    ]);
    return false;
  }
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/' + BESTAND + ':/content?@microsoft.graph.conflictBehavior=fail', {
    method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: schrijfBestand(leegModel())
  });
  if (!res.ok && res.status !== 409) throw new Error('aanmaken: code ' + res.status);
  return true;
}

/* Na een geslaagde ronde: wat verstuurd is uit de wachtrij, vervangen id's
   doorvoeren, en wat stil is rechtgezet in het logboek. */
function rondeKlaar(ronde, aantal) {
  wachtrij = wachtrij.slice(aantal);
  if (ronde.alias.size) vervangLokaal(ronde.alias);
  logboek(ronde.opgelost.concat(ronde.resultaten.filter((r) => r.status === 'samengevoegd')
    .map((r) => (r.h.velden && r.h.velden.naam || (r.h.afd && r.h.afd.naam) || '') + ': dubbel, samengevoegd')));
}

async function syncRonde() {
  if (sync.bezig) { sync.opnieuw = true; return; }
  const auth = await kvGet('auth');
  const map = await kvGet('map');
  if (!auth || !auth.refresh || !map) { tekenWolk(); return; }
  if (!navigator.onLine) { sync.offline = true; tekenWolk(); return; }
  sync.bezig = true; sync.fout = ''; sync.offline = false; tekenWolk();
  try {
    for (let poging = 0; poging < 4; poging++) {
      const opgehaald = await bestandOphalen(map);
      if (opgehaald.weg) {
        if (!(await bestandMaken(map))) return;
        continue;
      }
      meldingWeg('m-weg');
      const remote = opgehaald.bytes || opgehaald.tekst;
      const inBehandeling = wachtrij.slice();
      const remoteTekst = typeof remote === 'string' ? remote : new TextDecoder().decode(remote);
      const ronde = synchroniseer(remote, inBehandeling, new Date());
      if (!ronde.ok) {
        /* Liever niets schrijven dan stil iets kwijtraken: de app werkt verder op
           de laatste goede kopie op deze telefoon. */
        melding('m-bestand', [{ vet: BESTAND }, ' ' + (LEESREDEN[ronde.reden] || 'is niet te lezen.') + ' De app schrijft er niets in.'], []);
        return;
      }
      meldingWeg('m-bestand');
      if (!ronde.gewijzigd) {
        kopie = { formaat: FORMAAT, tekst: remoteTekst, eTag: opgehaald.item.eTag, fileId: opgehaald.item.id, tijd: Date.now() };
        rondeKlaar(ronde, inBehandeling.length);
        break;
      }
      await dagbackup(map, remoteTekst);
      const res = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag },
        body: ronde.tekst
      });
      if (res.status === 412) continue; // intussen gewijzigd: opnieuw lezen en toepassen
      if (!res.ok) throw new Error('schrijven: code ' + res.status);
      const item = await res.json();
      kopie = { formaat: FORMAAT, tekst: ronde.tekst, eTag: item.eTag, fileId: item.id, tijd: Date.now() };
      rondeKlaar(ronde, inBehandeling.length);
      meldResultaten(ronde.resultaten);
      break;
    }
    await bewaar('kopie', kopie);
    await bewaar('wachtrij', wachtrij);
    sync.laatst = Date.now();
    bouwModel();
    tekenAlles();
  } catch (e) {
    sync.fout = e.message;
    if (!navigator.onLine || /verbinding|10 s/.test(e.message)) sync.offline = true;
  } finally {
    sync.bezig = false;
    tekenWolk();
    if (sync.opnieuw) { sync.opnieuw = false; planSync(SYNC_PAUZE); }
    else if (wachtrij.length && !sync.offline && !sync.fout) planSync(SYNC_PAUZE);
  }
}

/* De naam bij een handeling, voor een melding. */
function naamVan(h) {
  if (h.velden && h.velden.naam) return h.velden.naam;
  if (h.record && h.record.naam) return h.record.naam;
  const verz = model && verzameling(model, h.soort);
  const r = verz && verz.get(h.id);
  return r ? r.naam : (h.naam || 'iets');
}

function meldResultaten(resultaten) {
  const vervallen = resultaten.filter((r) => r.status === 'vervallen').map((r) => naamVan(r.h));
  if (vervallen.length) {
    melding('m-vervallen', ['Niet doorgevoerd, want intussen verwijderd of de naam bestond al: ', { vet: Array.from(new Set(vervallen)).join(', ') }, '.'],
      [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-vervallen') }]);
  }
  const botsing = resultaten.filter((r) => r.status === 'botsing');
  if (botsing.length) {
    const r = botsing[botsing.length - 1];
    melding('m-botsing', [{ vet: naamVan(r.h) }, ' was intussen ook gewijzigd. Jouw versie staat erin; de andere was: "' + r.vorige + '".'], [
      { tekst: 'Andere terugzetten', actie: () => { meldingWeg('m-botsing'); handelen([{ actie: 'zet', soort: r.h.soort, id: r.h.id, veld: r.h.veld, oud: r.h.nieuw, nieuw: r.vorige }]); } },
      { tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-botsing') }
    ]);
  }
}

function tekenWolk() {
  kvGet('map').then((map) => kvGet('auth').then((auth) => {
    let tekst;
    if (!auth || !auth.refresh) tekst = 'niet aangemeld';
    else if (!map) tekst = 'geen map';
    else if (sync.bezig) tekst = 'bezig…';
    else if (sync.offline) tekst = 'offline' + (wachtrij.length ? ' · ' + wachtrij.length : '');
    else if (sync.fout) tekst = 'niet gelukt';
    else if (sync.laatst) tekst = new Date(sync.laatst).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    else tekst = 'gekoppeld';
    $('wolkTekst').textContent = tekst;
    $('wolk').setAttribute('aria-label', 'Synchroniseren: ' + tekst + (sync.fout ? ' (' + sync.fout + ')' : ''));
  }));
}

/* ---------- boodschappenscherm (stap 6) ---------- */
const KLEUR = { E: '#6A3BC4', W: '#1D3FAF', R: '#0A7581', L: '#4B3CC0', S: '#9A5B06' };
const TINT = { E: '#EDE6FA', W: '#E3E8FA', R: '#DDF1F2', L: '#E9E6F8', S: '#FBF0DA' };
const SOORTNAAM = { E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig' };
const PADEN = {
  E: '<rect x="4" y="4" width="16" height="16"></rect><path d="M10.2 9.2l2.3-1.7V17"></path>',
  W: '<circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 8.5h4.8l-3 7"></path>',
  R: '<path d="M3.5 4h17v4h-17z"></path><path d="M5 8h14v12H5z"></path><path d="M10 12h4"></path>',
  L: '<path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"></path>',
  S: '<path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path>'
};
const WINKELSYMBOOL = '<path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M10 20v-5h4v5"></path>';
function svgIcoon(pad, kleur, maat) {
  return '<svg width="' + maat + '" height="' + maat + '" viewBox="0 0 24 24" fill="none" stroke="' + kleur +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">' + pad + '</svg>';
}

const scherm = { filter: 'L', nieuwSoort: 'E', zoek: '', vertrekt: new Map(), weggehaald: new Map() };
function weggehaaldLegen() {
  for (const v of scherm.vertrekt.values()) clearTimeout(v.timer);
  scherm.vertrekt.clear();
  scherm.weggehaald.clear();
}

function tekenSoortknop() {
  const k = scherm.nieuwSoort;
  const b = $('invoerSoort');
  b.style.background = TINT[k];
  b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) +
    '<svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l4-4 4 4"></path></svg>';
  b.setAttribute('aria-label', 'Soort voor nieuw artikel: ' + SOORTNAAM[k].toLowerCase() + '. Wijzigen');
}

function soortMenu(open) {
  const m = $('soortMenu');
  $('invoerSoort').setAttribute('aria-expanded', String(open));
  let ag = $('achtergrond');
  if (!open) { m.hidden = true; if (ag) ag.remove(); return; }
  m.innerHTML = '';
  for (const k of ['E', 'W', 'R']) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', String(k === scherm.nieuwSoort));
    b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) + '<span>' + SOORTNAAM[k] + '</span>' +
      (k === scherm.nieuwSoort ? svgIcoon('<path d="M5 12l5 5 9-10"></path>', '#4B3CC0', 20) : '');
    b.addEventListener('click', () => { scherm.nieuwSoort = k; soortMenu(false); tekenSoortknop(); $('invoerTekst').focus(); });
    m.appendChild(b);
  }
  ag = document.createElement('button');
  ag.id = 'achtergrond'; ag.type = 'button'; ag.setAttribute('aria-label', 'Menu sluiten');
  ag.addEventListener('click', () => soortMenu(false));
  document.body.appendChild(ag);
  m.hidden = false;
}

function tekenFilters() {
  const vandaag = datumTekst(new Date());
  const tel = {
    L: artikelen.filter((a) => a.op).length,
    E: artikelen.filter((a) => a.letter === 'E').length,
    W: artikelen.filter((a) => a.letter === 'W').length,
    R: artikelen.filter((a) => a.letter === 'R').length,
    S: artikelen.filter((a) => !a.op && suggestie(a.gekocht, vandaag)).length
  };
  const namen = { L: 'Op de lijst', E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig', S: 'Suggesties' };
  const f = $('filters');
  f.innerHTML = '';
  for (const k of ['L', 'E', 'W', 'R', 'S']) {
    const aan = scherm.filter === k;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'filter';
    b.setAttribute('aria-pressed', String(aan));
    b.setAttribute('aria-label', namen[k] + ', ' + tel[k]);
    b.style.background = aan ? KLEUR[k] : TINT[k];
    b.style.color = aan ? '#FFFFFF' : KLEUR[k];
    b.innerHTML = svgIcoon(PADEN[k], aan ? '#FFFFFF' : KLEUR[k], 22) + '<span>' + tel[k] + '</span>';
    b.addEventListener('click', () => { scherm.filter = k; weggehaaldLegen(); tekenBoodschappen(); });
    f.appendChild(b);
  }
}

/* Wat de lijst nu toont: zoekresultaten, of het gekozen filter. */
function lijstVoorScherm(zoekend, vandaag) {
  if (zoekend) {
    const l = zoekArtikelen(artikelen, scherm.zoek);
    return { lijst: l, titel: 'Gevonden', onder: l.length + ' · ' + l.filter((a) => a.op).length + ' op de lijst' };
  }
  if (scherm.filter === 'L') {
    return { lijst: artikelen.filter((a) => a.op || scherm.vertrekt.has(a.id)), titel: 'Op de lijst', onder: artikelen.filter((a) => a.op).length + ' · a–z' };
  }
  if (scherm.filter === 'S') {
    const l = artikelen.filter((a) => !a.op && suggestie(a.gekocht, vandaag));
    return { lijst: l, titel: 'Suggesties', onder: l.length + ' · langer geleden' };
  }
  const l = artikelen.filter((a) => a.letter === scherm.filter);
  return { lijst: l, titel: SOORTNAAM[scherm.filter], onder: l.length + ' · ' + l.filter((a) => a.op).length + ' op de lijst' };
}

/* Eén regel: soorticoon, naam (met winkelsymbool, "nieuw", suggestie) en het rondje. */
function artikelRij(a, opties) {
  const rij = document.createElement('div');
  rij.className = 'item' + (opties.vertrekt ? ' vertrekt' : '');
  rij.dataset.id = a.id;
  const nieuw = a.op && a.opdoor && a.opdoor !== ik && Date.now() - Date.parse(a.op) < 15 * 60000;
  rij.innerHTML =
    '<span class="icoon" role="img">' + svgIcoon(PADEN[a.letter], KLEUR[a.letter], 24) + '</span>' +
    '<span class="tekst"><span class="naam"><span></span>' +
    (a.plekken.length ? '<svg class="alleen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img">' + WINKELSYMBOOL + '</svg>' : '') +
    (nieuw ? '<span class="nieuw">nieuw</span>' : '') + '</span>' +
    (opties.sug ? '<span class="hint"></span>' : '') + '</span>' +
    '<button class="rondje" type="button" aria-pressed="' + (a.op ? 'true' : 'false') + '">' + (a.op ? RONDJE.aan : RONDJE.plus) + '</button>';
  rij.querySelector('.icoon').setAttribute('aria-label', SOORTNAAM[a.letter].toLowerCase());
  rij.querySelector('.naam > span').textContent = a.naam;
  if (a.plekken.length) rij.querySelector('.alleen').setAttribute('aria-label', 'alleen bij ' + a.plekken.map((p) => (winkelOpId.get(p.winkel) || { naam: '?' }).naam).join(', '));
  if (opties.sug) rij.querySelector('.hint').textContent = suggestieTekst(opties.sug);
  rij.querySelector('.rondje').setAttribute('aria-label', a.op ? a.naam + ' staat op de lijst; van de lijst halen'
    : opties.weg ? a.naam + ' weer op de lijst zetten' : a.naam + ' op de lijst zetten');
  return rij;
}

/* "Van de lijst gehaald": wat je net weghaalde, om het makkelijk terug te zetten. */
function tekenWeggehaald(zoekend) {
  const weg = (!zoekend && scherm.filter === 'L') ? artikelen.filter((a) => !a.op && scherm.weggehaald.has(a.id)) : [];
  let sec = $('weggehaald');
  if (sec) sec.remove();
  if (!weg.length) return;
  sec = document.createElement('div');
  sec.id = 'weggehaald';
  sec.className = 'weggehaald';
  sec.innerHTML = '<div class="kopregel" style="padding-top:10px"><h2 style="color:#5A6472">Van de lijst gehaald</h2><span>' + weg.length + '</span></div><div class="lijst"></div>';
  for (const a of weg) sec.querySelector('.lijst').appendChild(artikelRij(a, { weg: true }));
  $('lijst').after(sec);
}

function tekenBoodschappen() {
  if (!model) return;
  if (!gekoppeld) {
    $('filters').hidden = true;
    $('lijstTitel').textContent = 'Op de lijst';
    $('lijstAantal').textContent = '';
    $('lijst').innerHTML = '<div class="leeg">Nog niet gekoppeld</div>';
    return;
  }
  const zoekend = normNaam(scherm.zoek) !== '';
  $('filters').hidden = zoekend;
  if (!zoekend) tekenFilters();
  const vandaag = datumTekst(new Date());
  const { lijst: lijstNu, titel, onder } = lijstVoorScherm(zoekend, vandaag);
  $('lijstTitel').textContent = titel;
  $('lijstAantal').textContent = onder;
  const l = $('lijst');
  l.innerHTML = '';
  if (!lijstNu.length) {
    const p = document.createElement('div');
    p.className = 'leeg';
    p.textContent = zoekend ? 'Niets gevonden' : scherm.filter === 'S' ? 'Geen suggesties' : 'Geen artikelen';
    l.appendChild(p);
  } else {
    const frag = document.createDocumentFragment();
    for (const a of lijstNu) {
      frag.appendChild(artikelRij(a, {
        vertrekt: scherm.vertrekt.has(a.id) && !a.op,
        sug: scherm.filter === 'S' && !zoekend ? suggestie(a.gekocht, vandaag) : null
      }));
    }
    l.appendChild(frag);
  }
  tekenWeggehaald(zoekend);
}

/* Eén luisteraar voor alle rondjes in de lijst. */
function lijstKlik(e) {
  const knop = e.target.closest('.rondje');
  if (!knop) return;
  const id = knop.closest('.item').dataset.id;
  const a = artikelen.find((x) => x.id === id);
  if (!a) return;
  const t = tijdstipTekst(new Date());
  if (a.op) {
    if (scherm.filter === 'L' && normNaam(scherm.zoek) === '') {
      /* Even grijs op zijn plek, dan naar "Van de lijst gehaald". */
      const timer = setTimeout(() => {
        scherm.vertrekt.delete(id);
        scherm.weggehaald.set(id, true);
        tekenBoodschappen();
      }, VERTRAGING);
      scherm.vertrekt.set(id, { timer });
    }
    handelen([{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: a.op, nieuw: '' },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: a.opdoor, nieuw: '' }]);
  } else {
    const v = scherm.vertrekt.get(id);
    if (v) clearTimeout(v.timer);
    scherm.vertrekt.delete(id);
    scherm.weggehaald.delete(id);
    handelen([{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: '', nieuw: t },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: a.opdoor, nieuw: ik }]);
  }
}
$('lijst').addEventListener('click', lijstKlik);
$('midden').addEventListener('click', (e) => { if (e.target.closest('#weggehaald')) lijstKlik(e); });

function toevoegen() {
  const naam = schoonTekst($('invoerTekst').value);
  if (!naam) { $('invoerTekst').focus(); return; }
  const bestaand = artikelen.find((a) => a.sleutel === normNaam(naam));
  const t = tijdstipTekst(new Date());
  if (bestaand) {
    if (!bestaand.op) {
      handelen([{ actie: 'zet', soort: 'artikel', id: bestaand.id, veld: 'op', oud: '', nieuw: t },
                { actie: 'zet', soort: 'artikel', id: bestaand.id, veld: 'opdoor', oud: bestaand.opdoor, nieuw: ik }]);
    }
  } else {
    handelen([{ actie: 'nieuw', soort: 'artikel', id: nieuweId(), velden: { naam, soort: LETTER_SOORT[scherm.nieuwSoort], op: t, opdoor: ik } }]);
  }
  vakLeeg($('invoerTekst'));
  scherm.zoek = '';
  scherm.nieuwSoort = 'E';
  tekenSoortknop();
  tekenBoodschappen();
}

/* De tabbalk gaat alleen weg zolang het toetsenbord echt open is. Op Android
   sluit je het toetsenbord vaak met terug; het vak houdt dan de focus, dus
   focus alleen is geen goed teken. Het zichtbare deel van het scherm wel. */
const volleHoogte = { h: window.innerHeight };
function typenBijwerken() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk'))) volleHoogte.h = Math.max(volleHoogte.h, h);
  const actief = document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk');
  const open = !!actief && h < volleHoogte.h * 0.8;
  document.body.classList.toggle('typen', open);
}
for (const id of ['invoerTekst', 'winkelsTekst']) {
  $(id).addEventListener('focus', () => setTimeout(typenBijwerken, 300));
  $(id).addEventListener('blur', () => setTimeout(typenBijwerken, 150));
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', typenBijwerken);
window.addEventListener('resize', typenBijwerken);

/* Verversen: elke paar minuten zolang de app in beeld is, en bij terugkomen of weer online. */
setInterval(() => { if (!document.hidden) planSync(0); }, VERVERS_GEWOON);
document.addEventListener('visibilitychange', () => { if (!document.hidden) planSync(300); });
window.addEventListener('online', () => planSync(300));
window.addEventListener('offline', () => { sync.offline = true; tekenWolk(); });

async function gegevensLaden() {
  kopie = await kvGet('kopie');
  wachtrij = (await kvGet('wachtrij')) || [];
  /* Een kopie en wachtrij van een ander bestandsformaat tellen niet (er is geen
     omzetting van oude formaten); ook het mandje en de keuzes niet. */
  if (kopie && kopie.formaat !== FORMAAT) {
    kopie = null; wachtrij = [];
    for (const k of ['kopie', 'wachtrij', 'mandje', 'favorieten', 'winkel']) await kvDel(k);
  }
  const auth = await kvGet('auth');
  ik = ((auth && auth.naam) || '').split(' ')[0];
  bouwModel();
  tekenSoortknop();
  tekenBoodschappen();
}

/* ---------- keuzelijst van onderen (winkel, afdeling) ---------- */
/* opt: { titel, secties: [{ titel?, ingeklapt?, opties: [{ id, naam, sub?, aantal?, actief? }] }],
   kies(id), zoek?: { placeholder, nieuw(naam) } }.
   Kruisje rechtsboven; "Zoeken of toevoegen" onderaan. Tijdens het typen één
   lijst met alles wat past, uit alle secties. */
const KRUIS = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
const PIJL_RECHTS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
const WIS_KNOP = '<button class="wis" type="button" aria-label="Leegmaken" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>';
function keuzeOptie(o, kies) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'optie' + (o.actief ? ' actief' : '');
  b.innerHTML = '<span class="nm"></span>' + (o.aantal ? '<span class="tal"></span>' : '');
  b.querySelector('.nm').textContent = o.naam;
  if (o.sub) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = o.sub; b.querySelector('.nm').appendChild(s); }
  if (o.aantal) b.querySelector('.tal').textContent = o.aantal;
  if (o.actief) b.setAttribute('aria-current', 'true');
  b.addEventListener('click', () => { sluitKeuze(); kies(o.id); });
  return b;
}
function keuzeUitklapper(titel, open, wissel) {
  const kb = document.createElement('button');
  kb.type = 'button'; kb.className = 'uitklapper';
  kb.setAttribute('aria-expanded', String(open));
  kb.innerHTML = '<span></span>' + PIJL_RECHTS;
  kb.querySelector('span').textContent = titel;
  kb.querySelector('svg').style.transform = 'rotate(' + (open ? 90 : 0) + 'deg)';
  kb.addEventListener('click', wissel);
  return kb;
}
function keuzeLeeg(tekst) { const p = document.createElement('div'); p.className = 'leeg'; p.textContent = tekst; return p; }

function keuzePaneel(titel, metZoek) {
  const k = document.createElement('div');
  k.id = 'keuze';
  k.setAttribute('role', 'dialog');
  k.setAttribute('aria-modal', 'true');
  /* titel: tekst, of stukken waarin { vet: '…' } vet wordt (zoals bij meldingen). */
  const delen = Array.isArray(titel) ? titel : [titel];
  k.setAttribute('aria-label', delen.map((s) => (s && typeof s === 'object' ? s.vet : s)).join(''));
  k.innerHTML = '<div class="paneel"><div class="kop"><h3></h3><button class="kruis" type="button" aria-label="Sluiten">' + KRUIS + '</button></div>' +
    '<div class="opties"></div>' +
    (metZoek ? '<div class="zoek"><label for="keuzeZoek">Zoeken of toevoegen</label>' +
    '<div class="zoekbalk"><input id="keuzeZoek" type="text" autocomplete="off" enterkeyhint="done">' + WIS_KNOP +
    '<button class="plusknop" type="button" aria-label="Toevoegen">' +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>' : '') + '</div>';
  const h3 = k.querySelector('h3');
  if (Array.isArray(titel)) h3.className = 'delen';
  for (const s of delen) {
    if (s && typeof s === 'object') { const b = document.createElement('b'); b.textContent = s.vet; h3.appendChild(b); }
    else h3.appendChild(document.createTextNode(s));
  }
  k.querySelector('.kruis').addEventListener('click', sluitKeuze);
  k.addEventListener('click', (e) => { if (e.target === k) sluitKeuze(); });
  return k;
}

function keuzeLijst(opt) {
  sluitKeuze();
  const k = keuzePaneel(opt.titel, !!opt.zoek);
  const inp = k.querySelector('input');
  if (inp) inp.placeholder = opt.zoek.placeholder;
  const opties = k.querySelector('.opties');
  const open = opt.secties.map((s) => !s.ingeklapt);
  /* Alle opties één keer (een winkel kan in twee secties staan). */
  const alle = [];
  const gezien = new Set();
  for (const s of opt.secties) for (const o of s.opties) if (!gezien.has(o.id)) { gezien.add(o.id); alle.push(o); }
  const teken = () => {
    const t = inp ? zoekVorm(inp.value) : '';
    opties.innerHTML = '';
    if (t) {
      const zicht = alle.filter((o) => zoekVorm(o.naam).indexOf(t) !== -1);
      for (const o of zicht) opties.appendChild(keuzeOptie(o, opt.kies));
      if (!zicht.length) opties.appendChild(keuzeLeeg('Niets gevonden'));
      return;
    }
    opt.secties.forEach((s, i) => {
      if (s.titel) opties.appendChild(keuzeUitklapper(s.titel, open[i], () => { open[i] = !open[i]; teken(); }));
      if (open[i]) for (const o of s.opties) opties.appendChild(keuzeOptie(o, opt.kies));
    });
    if (!opties.children.length) opties.appendChild(keuzeLeeg('Nog niets'));
  };
  const toevoegenNu = () => {
    const v = schoonTekst(inp.value);
    if (!v) { inp.focus(); return; }
    const bestaand = alle.find((o) => normNaam(o.naam) === normNaam(v));
    sluitKeuze();
    if (bestaand) opt.kies(bestaand.id); else opt.zoek.nieuw(v);
  };
  if (inp) {
    inp.addEventListener('input', teken);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); toevoegenNu(); } });
    k.querySelector('.plusknop').addEventListener('click', toevoegenNu);
  }
  teken();
  document.body.appendChild(k);
}
function sluitKeuze() { const k = $('keuze'); if (k) k.remove(); }

/* ---------- tabblad Winkel (stap 7) ---------- */
/* Na afvinken blijft een regel even staan, zodat een mis-tik meteen terug te
   tikken is; daarna schuift hij naar "In het mandje" (winkel) of "Van de lijst
   gehaald" (boodschappen). Het mandje hoort bij deze telefoon, blijft bewaard
   en wordt alleen leeggemaakt met de knop. */
const VERTRAGING = 1500;
const VERVERS_WINKEL = 30 * 1000;
/* winkel.id: de gekozen winkel (per telefoon). Het mandje: artikel-id → { id, naam, winkel, op, opdoor, datum, alGekocht };
   per winkel apart, zodat er niets doorloopt van de ene winkel naar de andere. */
const winkel = { id: '', mandje: new Map(), vertraagd: new Map(), eldersOpen: false };

function winkelOpen() { return !$('scherm-winkel').hidden; }

function huidigeWinkel() { return winkelOpId.get(winkel.id) || null; }

async function winkelLaden() {
  winkel.id = (await kvGet('winkel')) || '';
  ws.favorieten = (await kvGet('favorieten')) || [];
  const m = (await kvGet('mandje')) || [];
  winkel.mandje = new Map(m.filter((x) => x && x.id).map((x) => [x.id, x]));
}
function mandjeBewaren() { bewaar('mandje', Array.from(winkel.mandje.values())); }

function winkelKiezen() {
  const tel = winkelTellingen(artikelen, winkels);
  /* Bij een gelijk aantal staat de laatst gekozen winkel bovenaan. */
  tel.sort((x, y) => y.aantal - x.aantal || (y.id === winkel.id) - (x.id === winkel.id) || SORTEER.compare(x.naam, y.naam));
  keuzeLijst({
    titel: 'Waar ga je heen?',
    secties: [
      { opties: tel.map((x) => ({ id: x.id, naam: x.naam, aantal: x.aantal, actief: x.id === winkel.id,
          sub: x.id === winkel.id ? 'laatst gekozen' : x.aantal <= 2 ? x.artikelen.join(', ') : '' })) },
      { titel: 'Alle winkels · ' + winkels.length, ingeklapt: tel.length > 0,
        opties: winkels.map((w) => ({ id: w.id, naam: w.naam, actief: w.id === winkel.id })) }
    ],
    kies: (id) => kiesWinkel(id),
    zoek: { placeholder: 'Winkel', nieuw: (naam) => {
      const id = nieuweId();
      handelen([{ actie: 'nieuw', soort: 'winkel', id, velden: { naam } }]);
      kiesWinkel(id);
    } }
  });
}
function kiesWinkel(id) {
  winkel.id = id;
  bewaar('winkel', id);
  tekenWinkel();
}

/* Waar ligt dit, in déze winkel? Kiezen legt vast: te koop hier, en in die afdeling. */
function waarLigtDit(a) {
  const w = huidigeWinkel();
  if (!w) { winkelKiezen(); return; }
  keuzeLijst({
    titel: ['Waar ligt ', { vet: a.naam }, ' bij ', { vet: w.naam }, '?'],
    secties: [{ opties: w.afdelingen.map((x) => ({ id: x.id, naam: x.naam })) }],
    kies: (afd) => handelen([{ actie: 'plaats', soort: 'artikel', id: a.id, winkel: w.id, afd }]),
    zoek: { placeholder: 'Afdeling', nieuw: (naam) => {
      const afd = nieuweId();
      handelen([{ actie: 'afdErbij', soort: 'winkel', id: w.id, afd: { id: afd, naam } },
                { actie: 'plaats', soort: 'artikel', id: a.id, winkel: w.id, afd }]);
    } }
  });
}

function afvinken(a) {
  const datum = datumTekst(new Date());
  const al = a.gekocht.indexOf(datum) !== -1;
  winkel.mandje.set(a.id, { id: a.id, naam: a.naam, winkel: winkel.id, op: a.op, opdoor: a.opdoor, datum, alGekocht: al });
  mandjeBewaren();
  const hs = [{ actie: 'zet', soort: 'artikel', id: a.id, veld: 'op', oud: a.op, nieuw: '' },
              { actie: 'zet', soort: 'artikel', id: a.id, veld: 'opdoor', oud: a.opdoor, nieuw: '' }];
  if (!al) hs.push({ actie: 'gekocht', soort: 'artikel', id: a.id, datum });
  winkel.vertraagd.set(a.id, setTimeout(() => { winkel.vertraagd.delete(a.id); if (winkelOpen()) tekenWinkel(); }, VERTRAGING));
  handelen(hs);
}

function terugOpLijst(id) {
  const m = winkel.mandje.get(id);
  if (!m) return;
  clearTimeout(winkel.vertraagd.get(id));
  winkel.vertraagd.delete(id);
  winkel.mandje.delete(id);
  mandjeBewaren();
  const hs = [{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: '', nieuw: m.op || tijdstipTekst(new Date()) },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: '', nieuw: m.opdoor }];
  if (!m.alGekocht) hs.push({ actie: 'nietGekocht', soort: 'artikel', id, datum: m.datum });
  handelen(hs);
}

function mandjeHier() { return Array.from(winkel.mandje.values()).filter((m) => m.winkel === winkel.id); }
function mandjeLeegmaken() {
  for (const m of mandjeHier()) if (!winkel.vertraagd.has(m.id)) winkel.mandje.delete(m.id);
  mandjeBewaren();
  tekenWinkel();
}

  plus: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#4B3CC0" stroke-width="2.2"></circle><path d="M14 9v10M9 14h10" fill="none" stroke="#4B3CC0" stroke-width="2.2" stroke-linecap="round"></path></svg>',
  leeg: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#4B3CC0" stroke-width="2.2"></circle></svg>',
  elders: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#9A93C9" stroke-width="2.2"></circle></svg>',
  gedaan: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13.5" fill="#14B3BF"></circle><path d="M8.8 14.4l3.4 3.4 7-7.6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
};
const SPELD = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"></path><path d="M10.3 8.4a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.3"></path><path d="M12 13.6h.01"></path></svg>';
const MANDJE_WEG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A4A05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.6 9.2a1 1 0 0 1-1 .8H6.6a1 1 0 0 1-1-.8z"></path><path d="M8 10l4-6 4 6"></path><path d="M10 13.5l4 4M14 13.5l-4 4"></path></svg>';

function winkelRij(a, soort) {
  const rij = document.createElement('div');
  const gedaan = soort === 'gedaan';
  rij.className = 'wrij' + (gedaan ? ' gedaan' : '');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'vink';
  b.setAttribute('aria-pressed', String(gedaan));
  b.innerHTML = (gedaan ? RONDJE.gedaan : soort === 'elders' ? RONDJE.elders : RONDJE.leeg) + '<span class="nm"></span>';
  b.querySelector('.nm').textContent = a.naam;
  b.setAttribute('aria-label', gedaan ? a.naam + ', in het mandje; terugzetten' : a.naam + ' afvinken');
  if (!gedaan && a.opdoor && a.opdoor !== ik && Date.now() - Date.parse(a.op) < 15 * 60000) {
    const n = document.createElement('span'); n.className = 'nieuw'; n.textContent = 'nieuw';
    n.style.cssText = 'padding:1px 7px;background:#DDF1F2;color:#0A6570;font-size:17px;font-weight:600;flex-shrink:0';
    b.appendChild(n);
  }
  b.addEventListener('click', () => gedaan ? terugOpLijst(a.id) : afvinken(a));
  rij.appendChild(b);
  if (soort === 'boven') {
    const w = document.createElement('button');
    w.type = 'button'; w.className = 'icoonknop waar';
    w.setAttribute('aria-label', 'Waar ligt ' + a.naam + '? Afdeling kiezen');
    w.innerHTML = SPELD;
    w.addEventListener('click', () => waarLigtDit(a));
    rij.appendChild(w);
  }
  if (soort === 'elders') {
    const s = document.createElement('span'); s.className = 'elders';
    s.textContent = a.plekken.length ? 'alleen ' + a.plekken.map((p) => (winkelOpId.get(p.winkel) || { naam: '?' }).naam).join(', ') : '';
    rij.appendChild(s);
  }
  return rij;
}

/* Een blok in de winkel: optioneel een kop (tekst of knop) met rechts een knop. */
function winkelSectie(doel, titel, grijs, rechts) {
  const sec = document.createElement('section'); sec.className = 'afd' + (grijs ? ' grijs' : '');
  if (titel !== null) {
    const kop = document.createElement('div'); kop.className = 'afdkop';
    if (typeof titel === 'string') { const s = document.createElement('span'); s.textContent = titel; kop.appendChild(s); }
    else kop.appendChild(titel);
    if (rechts) kop.appendChild(rechts);
    sec.appendChild(kop);
  }
  doel.appendChild(sec);
  return sec;
}

/* "Niet bij <winkel>": ingeklapt, wat hier niet te koop is. */
function eldersSectie(doel, w, elders, soortVan) {
  const kop = document.createElement('button');
  kop.type = 'button'; kop.className = 'uitklap';
  kop.setAttribute('aria-expanded', String(winkel.eldersOpen));
  kop.innerHTML = '<span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(' + (winkel.eldersOpen ? 90 : 0) + 'deg)"><path d="M9 5l7 7-7 7"></path></svg>';
  kop.querySelector('span').textContent = 'Niet bij ' + w.naam + ' · ' + elders.length;
  kop.addEventListener('click', () => { winkel.eldersOpen = !winkel.eldersOpen; tekenWinkel(); });
  const sec = winkelSectie(doel, kop, true);
  if (winkel.eldersOpen) for (const a of elders) sec.appendChild(winkelRij(a, soortVan(a) || 'elders'));
}

/* "In het mandje", met rechts de knop om het leeg te maken. */
function mandjeSectie(doel, inMandje) {
  const leeg = document.createElement('button');
  leeg.type = 'button'; leeg.className = 'icoonknop amber';
  leeg.setAttribute('aria-label', 'Mandje leegmaken');
  leeg.innerHTML = MANDJE_WEG;
  leeg.addEventListener('click', mandjeLeegmaken);
  const sec = winkelSectie(doel, 'In het mandje · ' + inMandje.length, true, leeg);
  for (const m of inMandje) sec.appendChild(winkelRij({ id: m.id, naam: m.naam, plekken: [] }, 'gedaan'));
}

function tekenWinkel() {
  if (!model || !winkelOpen()) return;
  const w = huidigeWinkel();
  $('winkelNaam').textContent = w ? w.naam : 'Winkel kiezen';
  /* Net afgevinkt (1,5 s): nog op zijn plek, als gedaan. */
  const weergave = artikelen.map((a) => {
    const m = winkel.vertraagd.has(a.id) && winkel.mandje.get(a.id);
    return m ? Object.assign({}, a, { op: m.op || 'x', opdoor: m.opdoor }) : a;
  });
  const ind = winkelIndeling(weergave, w);
  const soortVan = (a) => winkel.vertraagd.has(a.id) ? 'gedaan' : null;
  const doel = $('winkelLijst');
  doel.innerHTML = '';
  if (ind.boven.length) {
    const sec = winkelSectie(doel, null);
    for (const a of ind.boven) sec.appendChild(winkelRij(a, soortVan(a) || 'boven'));
  }
  for (const g of ind.groepen) {
    const sec = winkelSectie(doel, g.afd.naam);
    for (const a of g.items) sec.appendChild(winkelRij(a, soortVan(a) || 'gewoon'));
  }
  if (ind.elders.length) eldersSectie(doel, w, ind.elders, soortVan);
  const hier = mandjeHier();
  const inMandje = hier.filter((m) => !winkel.vertraagd.has(m.id));
  if (inMandje.length) mandjeSectie(doel, inMandje);
  const open = ind.boven.length + ind.groepen.reduce((s, g) => s + g.items.length, 0) + ind.elders.length;
  const klaarAantal = hier.length;
  const totaal = open - winkel.vertraagd.size + klaarAantal;
  $('winkelTeller').textContent = klaarAantal + ' van ' + totaal;
  $('winkelVoortgang').style.width = (totaal ? Math.round(100 * klaarAantal / totaal) : 0) + '%';
  if (!gekoppeld || (!open && !inMandje.length)) {
    doel.innerHTML = '';
    const p = document.createElement('div');
    p.className = 'kaart leeg';
    p.textContent = gekoppeld ? 'Geen artikelen' : 'Nog niet gekoppeld';
    doel.appendChild(p);
  }
}

/* Verslepen aan de greep: de regel volgt de vinger, de andere schuiven opzij;
   bij loslaten één handeling met de nieuwe volgorde. */
function slepenAan(lijstEl, w) {
  lijstEl.addEventListener('pointerdown', (e) => {
    const greep = e.target.closest('.greep');
    if (!greep) return;
    e.preventDefault();
    const rij = greep.closest('.arij');
    const rijen = Array.from(lijstEl.querySelectorAll('.arij'));
    const van = rijen.indexOf(rij);
    const hoogte = rij.getBoundingClientRect().height || 56;
    const y0 = e.clientY;
    let naar = van;
    if (greep.setPointerCapture && e.pointerId !== undefined) try { greep.setPointerCapture(e.pointerId); } catch (x) { /* niet nodig */ }
    rij.classList.add('sleept');
    const beweeg = (ev) => {
      const dy = ev.clientY - y0;
      naar = Math.max(0, Math.min(rijen.length - 1, van + Math.round(dy / hoogte)));
      rij.style.transform = 'translateY(' + dy + 'px)';
      rijen.forEach((r, i) => {
        if (r === rij) return;
        const schuif = van < naar && i > van && i <= naar ? -hoogte : van > naar && i >= naar && i < van ? hoogte : 0;
        r.style.transform = schuif ? 'translateY(' + schuif + 'px)' : '';
      });
    };
    const los = () => {
      greep.removeEventListener('pointermove', beweeg);
      greep.removeEventListener('pointerup', los);
      greep.removeEventListener('pointercancel', los);
      rijen.forEach((r) => { r.style.transform = ''; });
      rij.classList.remove('sleept');
      if (naar !== van) {
        const volgorde = rijen.map((r) => r.dataset.id);
        volgorde.splice(naar, 0, volgorde.splice(van, 1)[0]);
        handelen([{ actie: 'volgorde', soort: 'winkel', id: w.id, volgorde }]);
      }
    };
    greep.addEventListener('pointermove', beweeg);
    greep.addEventListener('pointerup', los);
    greep.addEventListener('pointercancel', los);
  });
}

function winkelBewerken(w) {
  bewerkPaneel({
    titel: 'Winkel bewerken', naam: w.naam, wegLabel: 'Winkel verwijderen',
    opslaan: (nieuw) => {
      if (winkels.some((x) => x.id !== w.id && normNaam(x.naam) === normNaam(nieuw))) {
        melding('m-naam', ['Er is al een winkel ', { vet: nieuw }, '.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-naam') }]);
        return;
      }
      handelen([{ actie: 'zet', soort: 'winkel', id: w.id, veld: 'naam', oud: w.naam, nieuw }]);
    },
    verwijder: () => {
      /* Wat terug moet bij Ongedaan maken: de winkel zelf en de plekken. */
      const record = recordNaarJson('winkel', model.winkels.get(w.id));
      const ligt = {};
      for (const a of model.artikelen.values()) if (a.ligt.has(w.id)) ligt[a.id] = a.ligt.get(w.id);
      winkelSluiten();
      handelen([{ actie: 'weg', soort: 'winkel', id: w.id }]);
      verwijderdMelding([{ vet: w.naam }, ' verwijderd.'], [{ actie: 'terug', soort: 'winkel', id: w.id, record, ligt }]);
    }
  });
}

function afdelingBewerken(w, afd) {
  bewerkPaneel({
    titel: 'Afdeling bewerken', naam: afd.naam, wegLabel: 'Afdeling verwijderen',
    opslaan: (nieuw) => {
      if (w.afdelingen.some((x) => x.id !== afd.id && normNaam(x.naam) === normNaam(nieuw))) {
        melding('m-naam', [{ vet: w.naam }, ' heeft al een afdeling ', { vet: nieuw }, '.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-naam') }]);
        return;
      }
      handelen([{ actie: 'afdHernoem', soort: 'winkel', id: w.id, afd: afd.id, naam: nieuw }]);
    },
    verwijder: () => {
      const plaats = w.afdelingen.findIndex((x) => x.id === afd.id);
      const daar = [];
      for (const a of model.artikelen.values()) if (a.ligt.get(w.id) === afd.id) daar.push(a.id);
      handelen([{ actie: 'afdWeg', soort: 'winkel', id: w.id, afd: afd.id }]);
      verwijderdMelding([{ vet: afd.naam }, ' verwijderd bij ', { vet: w.naam }, '.'],
        [{ actie: 'terug', soort: 'afdeling', winkel: w.id, afd: { id: afd.id, naam: afd.naam }, plaats, artikelen: daar }]);
    }
  });
}

  inp.blur();

/* Backups in de gedeelde map: alleen de naam en grootte; de inhoud pas als je
   er een aantikt. */
const BACKUP_NAAM = /^thuis_backup_(\d{4})(\d{2})(\d{2})\.json$/;
const VOOR_TERUGZETTEN = 'thuis_voor_terugzetten.json';
async function backupLijst() {
  const map = await kvGet('map');
  if (!map) return [];
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + '/children?$select=id,name,size&$top=999');
  if (!res.ok) throw new Error('code ' + res.status);
  return ((await res.json()).value || []).filter((i) => BACKUP_NAAM.test(i.name))
    .map((i) => { const m = BACKUP_NAAM.exec(i.name); return { id: i.id, naam: i.name, grootte: i.size || 0, datum: m[1] + '-' + m[2] + '-' + m[3] }; })
    .sort((a, b) => (a.datum < b.datum ? 1 : -1));
}
async function backupsTellen() {
  if (!gekoppeld || !navigator.onLine) { $('backupAantal').textContent = ''; return; }
  try { $('backupAantal').textContent = (await backupLijst()).length; } catch (e) { $('backupAantal').textContent = ''; }
}
function datumLabel(datum) {
  const d = new Date(+datum.slice(0, 4), +datum.slice(5, 7) - 1, +datum.slice(8, 10));
  const t = ['Zo', 'Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za'][d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()];
  return datum === datumTekst(new Date()) ? 'Vandaag · ' + t.toLowerCase() : t;
}

async function backupsOpenen() {
  $('scherm-instellingen').classList.add('sub');
  const doel = $('backupScherm');
  doel.hidden = false;
  doel.innerHTML = '<div class="wdkop"><button class="terug" type="button" aria-label="Terug naar Instellingen">' + PIJL_TERUG + '</button><h2>Backups</h2></div><div class="leegregel">Laden…</div>';
  doel.querySelector('.terug').addEventListener('click', () => backupSluiten(false));
  try { history.pushState({ thuisBackups: true }, ''); } catch (e) { /* alleen de terugknop */ }
  $('midden').scrollTop = 0;
  let lijstB;
  try { lijstB = await backupLijst(); } catch (e) { doel.querySelector('.leegregel').textContent = 'Niet gelukt (' + e.message + ')'; return; }
  doel.querySelector('.leegregel').remove();
  const grens = datumTekst(new Date(Date.now() - 13 * 86400000));
  for (const [titel, deel] of [['Laatste 14 dagen', lijstB.filter((b) => b.datum >= grens)], ['Eerste van de maand', lijstB.filter((b) => b.datum < grens)]]) {
    if (!deel.length) continue;
    const g = document.createElement('section'); g.className = 'backupgroep';
    const h = document.createElement('h3'); h.className = 'kopregel2'; h.textContent = titel; g.appendChild(h);
    const kaart = document.createElement('div'); kaart.className = 'wkaart';
    for (const b of deel) {
      const r = document.createElement('button');
      r.type = 'button'; r.className = 'winkelrij backuprij';
      r.innerHTML = '<span class="nm"></span>' + PIJL_IN;
      r.querySelector('.nm').textContent = datumLabel(b.datum);
      const s = document.createElement('span'); s.className = 'sub'; s.textContent = Math.max(1, Math.round(b.grootte / 1024)) + ' kB';
      r.querySelector('.nm').appendChild(s);
      r.addEventListener('click', () => backupBekijken(b));
      kaart.appendChild(r);
    }
    g.appendChild(kaart);
    doel.appendChild(g);
  }
  if (!lijstB.length) { const p = document.createElement('div'); p.className = 'leegregel'; p.textContent = 'Nog geen backups'; doel.appendChild(p); }
}
function backupSluiten(stil) {
  if (!stil && history.state && history.state.thuisBackups) { history.back(); return; }
  $('scherm-instellingen').classList.remove('sub');
  $('backupScherm').hidden = true;
  $('backupScherm').innerHTML = '';
}
window.addEventListener('popstate', () => { if (!$('backupScherm').hidden) { sluitKeuze(); backupSluiten(true); } });

async function bestandInhoud(map, itemId) {
  const res = await graph('/drives/' + map.driveId + '/items/' + itemId);
  if (!res.ok) throw new Error('code ' + res.status);
  const inhoud = await metGrens((await res.json())['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
  if (!inhoud.ok) throw new Error('downloaden: code ' + inhoud.status);
  return new Uint8Array(await inhoud.arrayBuffer());
}

/* Eén backup: downloaden, laten zien wat erin zit, en terugzetten. */
async function backupBekijken(b) {
  sluitKeuze();
  const k = document.createElement('div');
  k.id = 'keuze';
  k.setAttribute('role', 'dialog'); k.setAttribute('aria-modal', 'true');
  k.setAttribute('aria-label', 'Backup van ' + datumLabel(b.datum));
  k.innerHTML = '<div class="paneel"><div class="kop"><h3></h3><button class="kruis" type="button" aria-label="Sluiten">' + KRUIS + '</button></div>' +
    '<div class="naamveld"><div class="kaart" id="backupInhoud"><div class="rij"><span class="label">Laden…</span></div></div></div>' +
    '<div class="bewerkknoppen"><button class="knop" type="button" disabled>Terugzetten</button></div></div>';
  k.querySelector('h3').textContent = 'Backup van ' + datumLabel(b.datum).replace('Vandaag · ', 'vandaag, ');
  k.querySelector('.kruis').addEventListener('click', sluitKeuze);
  k.addEventListener('click', (e) => { if (e.target === k) sluitKeuze(); });
  document.body.appendChild(k);
  const inhoudEl = k.querySelector('#backupInhoud');
  const regel = (label, waarde) => { const r = document.createElement('div'); r.className = 'rij'; r.innerHTML = '<span class="label"></span><span class="waarde"></span>'; r.children[0].textContent = label; r.children[1].textContent = waarde; return r; };
  let bytes, gelezen;
  try {
    bytes = await bestandInhoud(await kvGet('map'), b.id);
    gelezen = leesBestand(bytes);
  } catch (e) { inhoudEl.innerHTML = ''; inhoudEl.appendChild(regel('Niet gelukt', e.message)); return; }
  inhoudEl.innerHTML = '';
  if (!gelezen.ok) { inhoudEl.appendChild(regel('Niet terug te zetten', gelezen.reden === 'onbekend-formaat' ? 'ouder formaat' : 'niet te lezen')); return; }
  const m = gelezen.model;
  inhoudEl.appendChild(regel('Winkels', m.winkels.size));
  inhoudEl.appendChild(regel('Artikelen', m.artikelen.size));
  inhoudEl.appendChild(regel('Op de lijst', Array.from(m.artikelen.values()).filter((a) => a.op).length));
  inhoudEl.appendChild(regel('Acties', m.acties.size));
  const knop = k.querySelector('.knop');
  knop.disabled = false;
  knop.addEventListener('click', async () => {
    sluitKeuze();
    if (await terugzetten(new TextDecoder().decode(bytes), true)) {
      backupSluiten(false);
      const id = 'm-terug';
      melding(id, ['Backup van ', { vet: datumLabel(b.datum).replace('Vandaag · ', '') }, ' teruggezet.'], [{ tekst: 'Ongedaan maken', actie: async () => {
        meldingWeg(id);
        try { if (await terugzetten(new TextDecoder().decode(await bestandInhoudOpNaam(VOOR_TERUGZETTEN)), false)) melding(id, 'Terugzetten ongedaan gemaakt.', [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg(id) }], 'info'); }
        catch (e) { melding(id, 'Ongedaan maken niet gelukt (' + e.message + ').', [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg(id) }]); }
      } }], 'info');
    }
  });
}
async function bestandInhoudOpNaam(naam) {
  const map = await kvGet('map');
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/' + naam);
  if (!res.ok) throw new Error('code ' + res.status);
  return bestandInhoud(map, (await res.json()).id);
}

/* De inhoud van een backup in thuis.json zetten. Eerst de huidige stand
   bewaren (zodat ook terugzetten terug te draaien is), alleen als er geen
   wijzigingen meer klaarstaan, en met If-Match: is het bestand intussen
   veranderd, dan gebeurt er niets. */
async function terugzetten(tekst, voorBewaren) {
  const fout = (t) => { melding('m-terug', t, [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-terug') }]); return false; };
  if (!leesBestand(tekst).ok) return fout('Deze backup is niet te lezen.');
  if (wachtrij.length) { planSync(0); return fout('Er staan nog wijzigingen klaar. Probeer het zo opnieuw.'); }
  if (sync.bezig) return fout('Even geduld: de app is aan het synchroniseren.');
  sync.bezig = true; tekenWolk();
  try {
    const map = await kvGet('map');
    const opgehaald = await bestandOphalen(map);
    if (opgehaald.weg) return fout(BESTAND + ' staat niet in de map.');
    const huidig = opgehaald.tekst || new TextDecoder().decode(opgehaald.bytes);
    if (voorBewaren) {
      const r = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/' + VOOR_TERUGZETTEN + ':/content', {
        method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: huidig
      });
      if (!r.ok) return fout('De huidige stand kon niet worden bewaard; er is niets teruggezet.');
    }
    const res = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
      method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag }, body: tekst
    });
    if (res.status === 412) return fout('Het bestand is net gewijzigd. Probeer het opnieuw.');
    if (!res.ok) return fout('Terugzetten niet gelukt (code ' + res.status + ').');
    const item = await res.json();
    kopie = { formaat: FORMAAT, tekst, eTag: item.eTag, fileId: item.id, tijd: Date.now() };
    await bewaar('kopie', kopie);
    bouwModel();
    tekenAlles();
    tekenInstellingen();
    return true;
  } catch (e) {
    return fout('Terugzetten niet gelukt (' + e.message + ').');
  } finally {
    sync.bezig = false; tekenWolk();
  }
}

function vakLeeg(inp) { inp.value = ''; const w = inp.parentNode.querySelector('.wis'); if (w) w.hidden = true; }
/* Het kruisje in elk zoekvak: zichtbaar zolang er tekst staat; een tik maakt het
   vak leeg (met een input-event, zodat de lijst meteen bijwerkt) en houdt de focus. */
document.addEventListener('input', (e) => {
  const wis = e.target.parentNode && e.target.parentNode.querySelector && e.target.parentNode.querySelector('.wis');
  if (wis && e.target.tagName === 'INPUT') wis.hidden = e.target.value === '';
});
document.addEventListener('click', (e) => {
  const wis = e.target.closest && e.target.closest('.wis');
  if (!wis) return;
  const inp = wis.parentNode.querySelector('input');
  inp.value = '';
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.focus();
});

/* ---------- vegen tussen de tabbladen (rondom) ---------- */
/* Niet vanaf de rand (daar zit het terug-gebaar van Android), niet tijdens typen,
   niet als er een menu of keuzelijst open is, en alleen bij een duidelijk
   horizontale beweging. */
const TABS = ['winkels', 'boodschappen', 'winkel', 'doen', 'instellingen'];
const veeg = { x: 0, y: 0, actief: false };
$('midden').addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  veeg.actief = e.touches.length === 1 && !(e.target.closest && e.target.closest('.greep')) && t.clientX > 24 && t.clientX < window.innerWidth - 24 &&
    !$('keuze') && $('soortMenu').hidden && !document.body.classList.contains('typen');
  veeg.x = t.clientX; veeg.y = t.clientY;
}, { passive: true });
$('midden').addEventListener('touchend', (e) => {
  if (!veeg.actief) return;
  veeg.actief = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - veeg.x, dy = t.clientY - veeg.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const nu = TABS.findIndex((n) => !$('scherm-' + n).hidden);
  toonScherm(TABS[(nu + (dx < 0 ? 1 : -1) + TABS.length) % TABS.length]);
}, { passive: true });

/* De browser mag opslag bij ruimtegebrek wissen; vastzetten voorkomt dat, zodat
   een wachtrij die nog niet in OneDrive staat niet verloren gaat. Lukt het niet,
   dan is dat geen fout: alleen het woord "nee", in oranje (gedeelde conventie). */
async function opslagVastzetten() {
  let vast = false;
  try {
    if (navigator.storage && navigator.storage.persist) {
      vast = await navigator.storage.persisted() || await navigator.storage.persist();
    }
  } catch (e) { vast = false; }
  $('appOpslag').textContent = vast ? 'ja' : 'nee';
  $('appOpslag').style.color = vast ? '' : '#A84A0A';
}

/* ---------- start ---------- */
(async () => {
  try {
    await gegevensLaden();
    await winkelLaden();
    opslagVastzetten();
    await terugVanMicrosoft();
    await aanmeldingOpTijd();
    await toonStatus();
    planSync(0);
    const auth = await kvGet('auth');
    if (auth && auth.refresh) wieBenIk();
  } catch (e) {
    melding('m-start', 'De app kon zijn gegevens in de browser niet openen (' + (e.message || e) + ').', []);
  }
})();

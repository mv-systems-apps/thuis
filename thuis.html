/* Na een geslaagde ronde: wat verstuurd is uit de wachtrij, vervangen id's
   doorvoeren, en wat stil is rechtgezet in het logboek. */
function rondeKlaar(ronde, aantal) {
  wachtrij = wachtrij.slice(aantal);
  if (ronde.alias.size) vervangLokaal(ronde.alias);
  logboek(ronde.opgelost.concat(ronde.resultaten.filter((r) => r.status === 'samengevoegd')
    .map((r) => (r.h.velden && r.h.velden.naam || (r.h.afd && r.h.afd.naam) || '') + ': dubbel, samengevoegd')));
}

/* Wat een ronde zonder wachtrij nog kan veranderen: het bestand, de dag (opruimen)
   en het wekelijkse moment. */
function rondeSleutel(eTag) {
  const nu = new Date();
  const w = model && model.instellingen.wekelijks;
  const m = w ? laatsteMoment(nu, w.dag, w.tijd) : null;
  return eTag + '|' + datumTekst(nu) + '|' + (m ? tijdstipTekst(m) : '');
}
async function syncRonde() {
  if (sync.bezig) { sync.opnieuw = true; return; }
  const auth = await kvGet('auth');
  const map = await kvGet('map');
  if (!auth || !auth.refresh || !map) { tekenWolk(); return; }
  if (!navigator.onLine) {
    sync.offline = true; tekenWolk();
    /* Offline met iets in de wachtrij: nog één keer stil om vaste opslag vragen, zodat de
       browser die wijzigingen niet wist bij ruimtegebrek (L6, data). */
    if (wachtrij.length && !sync.persistGevraagd) { sync.persistGevraagd = true; opslagVastzetten(); }
    return;
  }
  const vorigeFout = sync.fout;
  sync.bezig = true; sync.fout = ''; sync.offline = false; tekenWolk();
  let gelukt = false, veranderd = true;
  const verstuurd = new Set();
  try {
    for (let poging = 0; poging < 4; poging++) {
      const opgehaald = await bestandOphalen(map);
      if (opgehaald.geenToegang) {
        sync.geenToegang = true;
        melding('m-toegang', ['Geen toegang meer tot de gedeelde map ', { vet: map.naam }, '. De lijst op deze telefoon blijft staan.'], [
          { tekst: 'Andere map koppelen', actie: () => { meldingWeg('m-toegang'); toonScherm('instellingen'); $('mapVeld').hidden = false; $('deellink').focus(); } }]);
        sync.fout = 'geen toegang meer tot de gedeelde map';
        return;
      }
      sync.geenToegang = false;
      meldingWeg('m-toegang');
      if (opgehaald.weg) {
        /* Verdwenen: niet blijven proberen tot er iets verandert (melding staat er). */
        if (!(await bestandMaken(map))) { sync.fout = BESTAND + ' staat niet meer in de map'; return; }
        continue;
      }
      meldingWeg('m-weg');
      /* Het bestand is opnieuw aangemaakt (andere id): niet stil overnemen (M2, data). */
      if (opgehaald.opnieuw) melding('m-opnieuw', [{ vet: BESTAND }, ' is opnieuw aangemaakt op de andere telefoon. Klopt de lijst niet, zet dan een backup terug.'], [
        { tekst: 'Backups', actie: () => { meldingWeg('m-opnieuw'); toonScherm('instellingen'); backupsOpenen(); } },
        { tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-opnieuw') }]);
      /* Niets veranderd sinds de vorige ronde (zelfde bestand, lege wachtrij, zelfde
         dag, wekelijks moment niet voorbij): niets uit te rekenen (L8). */
      if (!opgehaald.bytes && !wachtrij.length && sync.overslaan === rondeSleutel(opgehaald.item.eTag)) { veranderd = false; gelukt = true; break; }
      const remote = opgehaald.bytes || opgehaald.tekst;
      const inBehandeling = wachtrij.slice();
      verstuurd.clear(); for (const h of inBehandeling) if (h.hid) verstuurd.add(h.hid);
      const remoteTekst = typeof remote === 'string' ? remote : new TextDecoder().decode(remote);
      const ronde = synchroniseer(remote, inBehandeling, new Date(), klokInfo(opgehaald.item));
      if (!ronde.ok) {
        /* Liever niets schrijven dan stil iets kwijtraken: de app werkt verder op
           de laatste goede kopie op deze telefoon. Niet opnieuw proberen tot er
           iets verandert (app openen, Nu synchroniseren, de gewone ronde). */
        melding('m-bestand', [{ vet: BESTAND }, ' ' + (LEESREDEN[ronde.reden] || 'is niet te lezen.') + ' De app schrijft er niets in.'],
          ronde.reden === 'nieuwer-formaat' ? [{ tekst: 'App bijwerken', actie: () => herlaadVoorUpdate() }]
            : [{ tekst: 'Backups', actie: () => { toonScherm('instellingen'); backupsOpenen(); } }]);
        sync.fout = BESTAND + ' ' + (LEESREDEN[ronde.reden] || 'is niet te lezen.').replace(/\.$/, '');
        return;
      }
      meldingWeg('m-bestand');
      if (ronde.klokVerdacht) melding('m-klok', 'De datum van deze telefoon lijkt niet te kloppen. Opruimen en wekelijks terug op de lijst wachten tot hij klopt.', [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-klok') }]);
      else meldingWeg('m-klok');
      /* Verdacht zonder iets te schrijven (bv. na lang niet gebruiken): één keer
         hetzelfde bestand terugschrijven om de servertijd te meten; daarna opnieuw (M3, ronde 4). */
      if (ronde.klokVerdacht && !ronde.gewijzigd && !sync.gepeild) {
        sync.gepeild = true;
        const pr = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
          method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag }, body: remoteTekst });
        if (pr.ok) {
          const it = await pr.json();
          kopie = { formaat: FORMAAT, tekst: remoteTekst, eTag: it.eTag, fileId: it.id, tijd: Date.now(), serverDag: serverDag(it), scheef: scheefVan(it) };
          await bewaar('kopie', kopie);
        }
        continue;
      }
      if (!ronde.gewijzigd) {
        veranderd = !kopie || kopie.eTag !== opgehaald.item.eTag || inBehandeling.length > 0;
        kopie = { formaat: FORMAAT, tekst: remoteTekst, eTag: opgehaald.item.eTag, fileId: opgehaald.item.id, tijd: Date.now(), serverDag: serverDag(opgehaald.item), scheef: kopie && typeof kopie.scheef === 'number' ? kopie.scheef : null };
        rondeKlaar(ronde, inBehandeling.length);
        meldResultaten(ronde.resultaten);
        gelukt = true;
        break;
      }
      /* Bij een verdachte klok geen dagbackup: die ruimt op met de datum van de telefoon (M1). */
      if (!ronde.klokVerdacht) await dagbackup(map, remoteTekst);
      const res = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag },
        body: ronde.tekst
      });
      if (res.status === 412) continue; // intussen gewijzigd: opnieuw lezen en toepassen
      if (!res.ok) throw new Error('schrijven: code ' + res.status);
      const item = await res.json();
      kopie = { formaat: FORMAAT, tekst: ronde.tekst, eTag: item.eTag, fileId: item.id, tijd: Date.now(), serverDag: serverDag(item), scheef: scheefVan(item) };
      rondeKlaar(ronde, inBehandeling.length);
      meldResultaten(ronde.resultaten);
      gelukt = true;
      break;
    }
    /* Vier keer "intussen gewijzigd": geen valse "Bijgewerkt". */
    if (!gelukt) throw new Error('het bestand werd steeds tegelijk gewijzigd');
    /* Alleen opslaan op de telefoon als er iets veranderde (in de winkel elke 30 s een ronde). */
    if (veranderd) {
      /* Sloeg een ander venster intussen de wachtrij op, dan die nemen zonder wat hier
         verstuurd is, in plaats van hem te overschrijven (L3, ronde 4). */
      try {
        if ((await kvLees('stand')) !== mijnStand) {
          const opgeslagen = (await kvLees('wachtrij')) || [];
          wachtrij = opgeslagen.filter((h) => !(h.hid && verstuurd.has(h.hid)));
        }
      } catch (e) { /* dan de eigen wachtrij */ }
      await bewaar('kopie', kopie); await bewaar('wachtrij', wachtrij);
    }
    sync.laatst = Date.now();
    sync.aanmelden = false;
    /* Niets veranderd (zelfde bestand, niets verstuurd): niet opnieuw tekenen. */
    /* Is het resultaat precies wat dit scherm al toonde (niets van de ander, geen wekelijks
       terug of opruimen), dan niet opnieuw inlezen en tekenen (H3, performance). */
    if (veranderd && !(model && !wachtrij.length && kopie && kopie.tekst === schrijfBestand(model))) { bouwModel(); tekenAlles(); }
    sync.overslaan = kopie && !wachtrij.length ? rondeSleutel(kopie.eTag) : '';
  } catch (e) {
    sync.fout = e.message;
    if (e.opnieuwAanmelden) sync.aanmelden = true;
    if (!navigator.onLine || /verbinding|10 s/.test(e.message)) sync.offline = true;
    /* In het logboek: alleen als de fout nieuw is, niet bij elke poging. */
    if (e.message !== vorigeFout) logboek(['Synchroniseren niet gelukt: ' + e.message + '.']);
  } finally {
    sync.bezig = false;
    tekenWolk();
    if (sync.opnieuw) { sync.opnieuw = false; planSync(SYNC_PAUZE); }
    else if (wachtrij.length && !sync.offline && !sync.fout) planSync(SYNC_PAUZE);
  }
}

/* De naam bij een handeling, voor een melding. */
function naamVan(h) {
  if (h.velden && h.velden.naam) return h.velden.naam;
  if (h.record && h.record.naam) return h.record.naam;
  const verz = model && verzameling(model, h.soort);
  const r = verz && verz.get(h.id);
  return r ? r.naam : (h.wat || h.naam || 'iets');
}

function meldResultaten(resultaten) {
  const vervallen = resultaten.filter((r) => r.status === 'vervallen').map((r) => naamVan(r.h));
  if (vervallen.length) {
    melding('m-vervallen', ['Niet doorgevoerd, want intussen verwijderd of de naam bestond al: ', { vet: Array.from(new Set(vervallen)).join(', ') }, '.'],
      [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-vervallen') }]);
  }
  const botsing = resultaten.filter((r) => r.status === 'botsing');
  if (botsing.length) {
    const r = botsing[botsing.length - 1];
    melding('m-botsing', [{ vet: naamVan(r.h) }, ' was intussen ook gewijzigd. Jouw versie staat erin; de andere was: "' + r.vorige + '".'], [
      { tekst: 'Andere terugzetten', actie: () => { meldingWeg('m-botsing'); handelen([{ actie: 'zet', soort: r.h.soort, id: r.h.id, veld: r.h.veld, oud: r.h.nieuw, nieuw: r.vorige }]); } },
      { tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-botsing') }
    ]);
  }
}

/* De toestand bovenaan Instellingen: icoon, één woord, wat het betekent, en de knop. */
const WOLK = (kleur, extra) => '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="' + kleur + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"></path>' + extra + '</svg>';
function tekenToestand(auth, map) {
  const tijd = (t) => new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  const wacht = wachtrij.length ? telTekst(wachtrij.length, 'wijziging wacht', 'wijzigingen wachten') : '';
  let woord, sub = '', warn = false, ic = WOLK('#0A7581', '<path d="M9.5 13.5l2 2 3.5-3.5"></path>'), knop = 'Nu synchroniseren';
  if (!auth || !auth.refresh) { woord = 'Niet aangemeld'; ic = WOLK('#5A6472', ''); knop = ''; }
  else if (sync.aanmelden) { woord = 'Opnieuw aanmelden'; sub = wacht; warn = true; ic = WOLK('#A84A0A', '<path d="M12 11v3M12 16.5h.01"></path>'); knop = 'Opnieuw aanmelden'; }
  else if (!map) { woord = 'Geen gedeelde map'; ic = WOLK('#5A6472', ''); knop = ''; }
  else if (sync.bezig) { woord = 'Bezig…'; ic = WOLK('#4B3CC0', ''); }
  else if (sync.offline) { woord = 'Offline'; sub = [wacht, sync.laatst ? 'laatst bijgewerkt ' + tijd(sync.laatst) : ''].filter(Boolean).join(' · '); warn = true; ic = WOLK('#A84A0A', '<path d="M4 4l16 16"></path>'); }
  else if (sync.fout) { woord = 'Niet gelukt'; sub = sync.fout; warn = true; ic = WOLK('#A84A0A', '<path d="M12 11v3M12 16.5h.01"></path>'); }
  else if (sync.laatst) { woord = 'Bijgewerkt'; sub = 'om ' + tijd(sync.laatst) + (wacht ? ' · ' + wacht : ''); }
  else { woord = 'Gekoppeld'; sub = wacht; }
  $('syncToestand').className = 'synctoestand' + (warn ? ' warn' : '');
  $('syncIcoon').innerHTML = ic;
  $('syncWoord').textContent = woord;
  $('syncSub').textContent = sub;
  $('btnSyncNu').hidden = !knop;
  $('btnSyncNu').textContent = knop;
  $('btnSyncNu').disabled = sync.bezig;
}
$('btnSyncNu').addEventListener('click', () => { if (sync.aanmelden) aanmelden(); else planSync(0); });

function tekenWolk() {
  kvGet('map').then((map) => kvGet('auth').then((auth) => {
    tekenToestand(auth, map);
    let tekst;
    if (!auth || !auth.refresh) tekst = 'niet aangemeld';
    else if (sync.aanmelden) tekst = 'aanmelden';
    else if (!map) tekst = 'geen map';
    else if (sync.bezig) tekst = 'bezig…';
    else if (sync.offline) tekst = 'offline' + (wachtrij.length ? ' · ' + wachtrij.length : '');
    else if (sync.fout) tekst = 'niet gelukt';
    else if (sync.laatst) tekst = new Date(sync.laatst).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    else tekst = 'gekoppeld';
    $('wolkTekst').textContent = tekst;
    $('wolk').setAttribute('aria-label', 'Synchroniseren: ' + tekst + (sync.fout ? ' (' + sync.fout + ')' : ''));
  }));
}

/* ---------- boodschappenscherm (stap 6) ---------- */
const KLEUR = { E: '#6A3BC4', W: '#1D3FAF', R: '#0A7581', L: '#4B3CC0', S: '#9A5B06' };
const TINT = { E: '#EDE6FA', W: '#E3E8FA', R: '#DDF1F2', L: '#E9E6F8', S: '#FBF0DA' };
const SOORTNAAM = { E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig' };
const PADEN = {
  E: '<rect x="4" y="4" width="16" height="16"></rect><path d="M10.2 9.2l2.3-1.7V17"></path>',
  W: '<circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 8.5h4.8l-3 7"></path>',
  R: '<path d="M3.5 4h17v4h-17z"></path><path d="M5 8h14v12H5z"></path><path d="M10 12h4"></path>',
  L: '<path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"></path>',
  S: '<path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path>'
};
function svgIcoon(pad, kleur, maat) {
  return '<svg width="' + maat + '" height="' + maat + '" viewBox="0 0 24 24" fill="none" stroke="' + kleur +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">' + pad + '</svg>';
}

const scherm = { filter: 'L', nieuwSoort: 'E', zoek: '', vertrekt: new Map(), weggehaald: new Map(), archiefOpen: false, teller: '', dicht: { lijst: false, weg: false }, zoekIn: '' };
/* Inklappijl: rechts in een kopbalk; open wijst omlaag. */
const KLAPPIJL = (open) => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(' + (open ? 90 : 0) + 'deg)"><path d="M9 5l7 7-7 7"></path></svg>';
function weggehaaldLegen() {
  for (const v of scherm.vertrekt.values()) clearTimeout(v.timer);
  scherm.vertrekt.clear();
  scherm.weggehaald.clear();
}

/* De soort voor een nieuw artikel volgt het filter (Op de lijst en Suggesties:
   eenmalig); met de soortknop kies je voor één artikel een andere. */
function soortVanFilter() { return 'EWR'.indexOf(scherm.filter) !== -1 ? scherm.filter : 'E'; }
/* Tijdens het typen (vak actief of met tekst): links annuleren in plaats van de
   soortknop, en het + in de kleur van de soort. */
function invoerBijwerken() {
  const vak = $('invoerTekst');
  const typen = document.activeElement === vak || vak.value !== '';
  $('invoerSoort').hidden = typen;
  $('invoerTerug').hidden = !typen;
  $('invoerPlus').style.background = typen ? KLEUR[scherm.nieuwSoort] : '';
}
function tekenSoortknop() {
  const k = scherm.nieuwSoort;
  const b = $('invoerSoort');
  b.style.background = TINT[k];
  b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) +
    '<svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l4-4 4 4"></path></svg>';
  b.setAttribute('aria-label', 'Soort voor nieuw artikel: ' + SOORTNAAM[k].toLowerCase() + '. Wijzigen');
}

let soortLaag = null;
function soortMenu(open) {
  const m = $('soortMenu');
  $('invoerSoort').setAttribute('aria-expanded', String(open));
  let ag = $('achtergrond');
  if (!open) { laagDicht(soortLaag); soortLaag = null; m.hidden = true; if (ag) ag.remove(); return; }
  if (!soortLaag) soortLaag = laagOpen(() => { soortLaag = null; soortMenu(false); return true; });
  m.innerHTML = '';
  for (const k of ['E', 'W', 'R']) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', String(k === scherm.nieuwSoort));
    b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) + '<span>' + SOORTNAAM[k] + '</span>' +
      (k === scherm.nieuwSoort ? svgIcoon('<path d="M5 12l5 5 9-10"></path>', '#4B3CC0', 20) : '');
    b.addEventListener('click', () => { scherm.nieuwSoort = k; soortMenu(false); tekenSoortknop(); $('invoerTekst').focus(); });
    m.appendChild(b);
  }
  ag = document.createElement('button');
  ag.id = 'achtergrond'; ag.type = 'button'; ag.setAttribute('aria-label', 'Menu sluiten');
  ag.addEventListener('click', () => soortMenu(false));
  document.body.appendChild(ag);
  m.hidden = false;
}

/* Hoort een artikel bij een filter? Bij zoeken telt Eenmalig ook het archief mee. */
function inFilter(a, k, vandaag, zoekend) {
  if (k === 'L') return !!a.op;
  if (k === 'S') return !a.op && !!sugVan(a, vandaag);
  if (k === 'E') return a.letter === 'E' && (zoekend || !!a.op);
  return a.letter === k;
}
/* Zoeken: de knoppen blijven staan, geen is gekleurd (zoeken gaat in alles) en
   ze tellen de treffers. Een tik zoekt alleen in dat filter; nog een tik = weer alles. */
function tekenFilters(zoekend, gevonden) {
  const vandaag = datumTekst(new Date());
  const bron = zoekend ? gevonden : artikelen;
  const tel = {};
  for (const k of ['L', 'E', 'W', 'R', 'S']) tel[k] = bron.filter((a) => inFilter(a, k, vandaag, zoekend)).length;
  const namen = { L: 'Op de lijst', E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig', S: 'Suggesties' };
  const f = $('filters');
  f.innerHTML = '';
  for (const k of ['L', 'E', 'W', 'R', 'S']) {
    const aan = zoekend ? scherm.zoekIn === k : scherm.filter === k;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'filter';
    b.setAttribute('aria-pressed', String(aan));
    b.setAttribute('aria-label', namen[k] + ', ' + tel[k]);
    b.style.background = aan ? KLEUR[k] : TINT[k];
    b.style.color = aan ? '#FFFFFF' : KLEUR[k];
    b.innerHTML = svgIcoon(PADEN[k], aan ? '#FFFFFF' : KLEUR[k], 22) + '<span class="n">' + tel[k] + '</span>';
    /* Tijdens het zoeken blijft het toetsenbord open. */
    b.addEventListener('pointerdown', (e) => { if (zoekend) e.preventDefault(); });
    b.addEventListener('mousedown', (e) => { if (zoekend) e.preventDefault(); });
    b.addEventListener('click', () => {
      if (zoekend) scherm.zoekIn = scherm.zoekIn === k ? '' : k;
      else scherm.filter = k;
      scherm.nieuwSoort = soortVanFilter(); tekenSoortknop(); weggehaaldLegen(); tekenBoodschappen();
    });
    f.appendChild(b);
  }
}

/* Wat de lijst nu toont: zoekresultaten, of het gekozen filter. */
/* Suggestie per artikel één keer per dag en per aankoopgeschiedenis uitrekenen. */
const sugGeheugen = new Map();
function sugVan(a, vandaag) {
  const sleutel = vandaag + '|' + a.gekocht.join(',');
  const g = sugGeheugen.get(a.id);
  if (g && g.sleutel === sleutel) return g.s;
  const s = suggestie(a.gekocht, vandaag);
  sugGeheugen.set(a.id, { sleutel, s });
  return s;
}
function lijstVoorScherm(zoekend, vandaag, gevonden) {
  let l, titel;
  if (zoekend) { l = gevonden || zoekArtikelen(artikelen, scherm.zoek); if (scherm.zoekIn) l = l.filter((a) => inFilter(a, scherm.zoekIn, vandaag, true)); titel = 'Gevonden'; }
  else if (scherm.filter === 'L') { l = artikelen.filter((a) => a.op || scherm.vertrekt.has(a.id)); titel = 'Op de lijst'; }
  else if (scherm.filter === 'S') { l = artikelen.filter((a) => !a.op && sugVan(a, vandaag)); titel = 'Suggesties'; }
  /* Eenmalig: alleen wat op de lijst staat; de rest staat in het archief. */
  else if (scherm.filter === 'E') { l = artikelen.filter((a) => a.letter === 'E' && (a.op || scherm.vertrekt.has(a.id))); titel = SOORTNAAM.E; }
  else { l = artikelen.filter((a) => a.letter === scherm.filter); titel = SOORTNAAM[scherm.filter]; }
  /* Rechts alleen het aantal; of iets op de lijst staat, zie je aan het rondje. */
  const aantal = scherm.filter === 'L' && !zoekend ? artikelen.filter((a) => a.op).length : l.length;
  return { lijst: l, titel, onder: telTekst(aantal, 'artikel', 'artikelen') };
}

/* Regels hergebruiken: alleen een regel waarvan iets veranderde, wordt opnieuw
   gemaakt (een tik bouwt dus niet de hele lijst opnieuw op). */
const rijGeheugen = new Map();
function rijUitGeheugen(a, opties) {
  if (scherm.teller === a.id) { rijGeheugen.delete(a.id); return artikelRij(a, opties); }
  const sleutel = [a.letter, a.naam, a.aantal, winkelsRegel(a), a.notitie, a.link, a.op, a.opdoor, isNieuw(a), !!opties.vertrekt,
    opties.sug ? suggestieTekst(opties.sug) : '', !!opties.archief, !!opties.weg, opties.hint || ''].join('\u0001');
  const g = rijGeheugen.get(a.id);
  if (g && g.sleutel === sleutel) return g.rij;
  const rij = artikelRij(a, opties);
  rijGeheugen.set(a.id, { sleutel, rij });
  return rij;
}

/* Eén regel: soorticoon, naam (met winkelsymbool, "nieuw", suggestie) en het rondje. */
function artikelRij(a, opties) {
  const rij = document.createElement('div');
  rij.className = 'item' + (opties.vertrekt ? ' vertrekt' : '') + (opties.archief ? ' archief' : '');
  rij.dataset.id = a.id;
  const nieuw = isNieuw(a);
  const metNotitie = !!(a.notitie || a.link);
  rij.innerHTML =
    '<button class="icoon" type="button" aria-expanded="' + (scherm.teller === a.id) + '">' + svgIcoon(PADEN[a.letter], KLEUR[a.letter], 28) + '</button>' +
    '<button class="tekst" type="button"><span class="naam"><span></span>' +
    (a.aantal > 1 ? '<span class="aantal"></span>' : '') +
    (nieuw ? '<span class="nieuw">nieuw</span>' : '') + '</span>' +
    (a.plekken.length ? '<span class="winkels"></span>' : '') +
    (metNotitie ? '<span class="notitie"></span>' : '') +
    (opties.sug || opties.hint ? '<span class="hint"></span>' : '') + '</button>' +
    '<button class="rondje" type="button" aria-pressed="' + (a.op ? 'true' : 'false') + '">' + (a.op ? RONDJE.aan : RONDJE.plus) + '</button>';
  rij.querySelector('.icoon').setAttribute('aria-label', SOORTNAAM[a.letter] + ', aantal ' + a.aantal + '; aantal wijzigen');
  rij.querySelector('.naam > span').textContent = a.naam;
  if (a.aantal > 1) rij.querySelector('.aantal').textContent = a.aantal + '×';
  if (a.plekken.length) rij.querySelector('.winkels').textContent = winkelsRegel(a);
  if (metNotitie) rij.querySelector('.notitie').replaceWith(notitieRegel(a));
  if (opties.sug) rij.querySelector('.hint').textContent = suggestieTekst(opties.sug);
  else if (opties.hint) rij.querySelector('.hint').textContent = opties.hint;
  rij.querySelector('.rondje').setAttribute('aria-label', a.op ? a.naam + ' staat op de lijst; van de lijst halen'
    : opties.weg ? a.naam + ' weer op de lijst zetten' : a.naam + ' op de lijst zetten');
  if (scherm.teller !== a.id) return rij;
  /* De teller onder de regel (tik op het icoon of op "2×"). */
  const frag = document.createDocumentFragment();
  frag.appendChild(rij);
  const t = document.createElement('div');
  t.className = 'teller';
  t.dataset.id = a.id;
  t.innerHTML = '<span>Aantal</span><button class="min" type="button" aria-label="Minder">−</button><span class="n"></span><button class="meer" type="button" aria-label="Meer">+</button>';
  t.querySelector('.n').textContent = a.aantal;
  t.querySelector('.min').disabled = a.aantal <= 1;
  t.querySelector('.meer').disabled = a.aantal >= 99;
  frag.appendChild(t);
  return frag;
}

/* Notitie en link onder de naam: paars, de link als "ah.nl ↗" die in een nieuw
   tabblad opent (zonder verwijzer, zonder band met de app). */
function notitieRegel(a) {
  const s = document.createElement('span');
  s.className = 'notitie';
  if (a.notitie) {
    /* tags vet, de rest gewone tekst */
    const n = a.notitie;
    let i = 0, m;
    TAG.lastIndex = 0;
    while ((m = TAG.exec(n))) {
      const start = m.index + m[1].length;
      if (start > i) s.appendChild(document.createTextNode(n.slice(i, start)));
      const b = document.createElement('b'); b.className = 'tag'; b.textContent = '#' + m[2].replace(/_/g, ' ');
      s.appendChild(b);
      i = start + 1 + m[2].length;
    }
    s.appendChild(document.createTextNode(n.slice(i) + (a.link ? ' ' : '')));
  }
  if (a.link) {
    const l = document.createElement('span');
    l.className = 'link';
    l.setAttribute('role', 'link');
    l.tabIndex = 0;
    l.textContent = linkNaam(a.link) + ' ↗';
    const open = (e) => { e.stopPropagation(); e.preventDefault(); window.open(a.link, '_blank', 'noopener,noreferrer'); };
    l.addEventListener('click', open);
    /* Ook met het toetsenbord (Enter of spatie). */
    l.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
    s.appendChild(l);
  }
  return s;
}

function aantalZetten(id, stap) {
  const a = artikelen.find((x) => x.id === id);
  if (!a) return;
  const nieuw = Math.max(1, Math.min(99, a.aantal + stap));
  if (nieuw === a.aantal) return;
  handelen([{ actie: 'zet', soort: 'artikel', id, veld: 'aantal', oud: a.aantal > 1 ? String(a.aantal) : '', nieuw: nieuw > 1 ? String(nieuw) : '' }]);
}

/* "Van de lijst gehaald": wat je net weghaalde, om het makkelijk terug te zetten. */
function tekenWeggehaald(zoekend) {
  const weg = (!zoekend && scherm.filter === 'L') ? artikelen.filter((a) => !a.op && scherm.weggehaald.has(a.id)) : [];
  let sec = $('weggehaald');
  if (sec) sec.remove();
  if (!weg.length) return;
  sec = document.createElement('div');
  sec.id = 'weggehaald';
  sec.className = 'weggehaald blok';
  const open = !scherm.dicht.weg;
  sec.innerHTML = '<button class="kopbalk" type="button"><span class="kopnaam">Van de lijst gehaald</span><span class="tal"></span>' + KLAPPIJL(open) + '</button>' + (open ? '<div class="lijst"></div>' : '');
  const kop = sec.querySelector('.kopbalk');
  kop.setAttribute('aria-expanded', String(open));
  if (!open) kop.style.borderBottom = '1px solid var(--lijn)';
  kop.addEventListener('click', () => { scherm.dicht.weg = open; tekenWeggehaald(false); });
  sec.querySelector('.tal').textContent = telTekst(weg.length, 'artikel', 'artikelen');
  if (open) for (const a of weg) sec.querySelector('.lijst').appendChild(rijUitGeheugen(a, { weg: true }));
  $('lijstBlok').after(sec);
}

/* Archief (onder Eenmalig): eenmalige artikelen die niet op de lijst staan,
   nieuwste eerst, ingeklapt. De + zet een artikel terug op de lijst. */
function datumKort(d) {
  const t = dagLabel(dagNummer(d));
  return d.slice(0, 4) === String(new Date().getFullYear()) ? t : t + ' ' + d.slice(0, 4);
}
function tekenArchief(zoekend) {
  let sec = $('archief');
  if (sec) sec.remove();
  if (zoekend || scherm.filter !== 'E') return;
  const arch = artikelen.filter((a) => a.letter === 'E' && !a.op && !scherm.vertrekt.has(a.id))
    .sort((x, y) => (x.laatst < y.laatst ? 1 : x.laatst > y.laatst ? -1 : SORTEER.compare(x.naam, y.naam)));
  if (!arch.length) return;
  sec = document.createElement('div');
  sec.id = 'archief';
  sec.className = 'blok';
  sec.innerHTML = '<button class="kopbalk" type="button"><span class="kopnaam">Archief</span><span class="tal"></span>' +
    KLAPPIJL(scherm.archiefOpen) + '</button>' +
    (scherm.archiefOpen ? '<div class="lijst"></div>' : '');
  const kop = sec.querySelector('.kopbalk');
  kop.setAttribute('aria-expanded', String(scherm.archiefOpen));
  if (!scherm.archiefOpen) kop.style.borderBottom = '1px solid var(--lijn)';
  sec.querySelector('.tal').textContent = telTekst(arch.length, 'artikel', 'artikelen');
  kop.addEventListener('click', () => { scherm.archiefOpen = !scherm.archiefOpen; tekenArchief(false); });
  if (scherm.archiefOpen) {
    const frag = document.createDocumentFragment();
    for (const a of arch) {
      const g = a.gekocht.length && a.laatst === a.gekocht.reduce((x, y) => (y > x ? y : x));
      /* Hergebruikt, net als in de hoofdlijst (H2, performance). */
      frag.appendChild(rijUitGeheugen(a, { archief: true, hint: a.laatst ? (g ? 'gekocht ' : 'van de lijst ') + datumKort(a.laatst) : '' }));
    }
    sec.querySelector('.lijst').appendChild(frag);
  }
  $('lijstBlok').after(sec);
}

function tekenBoodschappen() {
  /* Alleen als Artikelen in beeld is: tekenen telt een nieuw artikel als gezien (M7),
     en scheelt werk. Bij het openen van het tabblad wordt er toch getekend. */
  if (!model || $('scherm-boodschappen').hidden) return;
  if (!gekoppeld) {
    $('filters').hidden = true;
    $('lijstTitel').textContent = 'Op de lijst';
    $('lijstAantal').textContent = '';
    $('lijst').innerHTML = '<div class="leeg">Nog niet gekoppeld</div>';
    return;
  }
  const zoekend = normNaam(scherm.zoek) !== '';
  $('filters').hidden = false;
  /* Zoeken één keer per toets; filters en lijst gebruiken hetzelfde resultaat. */
  const gevonden = zoekend ? zoekArtikelen(artikelen, scherm.zoek) : null;
  tekenFilters(zoekend, gevonden);
  const vandaag = datumTekst(new Date());
  const { lijst: lijstNu, titel, onder } = lijstVoorScherm(zoekend, vandaag, gevonden);
  $('lijstTitel').textContent = titel;
  $('lijstAantal').textContent = onder;
  /* Inklappen per kop; zoekresultaten staan altijd open. */
  const open = zoekend || !scherm.dicht.lijst;
  $('lijstKop').setAttribute('aria-expanded', String(open));
  $('lijstKop').style.borderBottom = open ? '' : '1px solid var(--lijn)';
  $('lijstPijl').innerHTML = zoekend ? '' : KLAPPIJL(open);
  const l = $('lijst');
  l.hidden = !open;
  l.innerHTML = '';
  if (!lijstNu.length) {
    const p = document.createElement('div');
    p.className = 'leeg';
    p.textContent = zoekend ? 'Niets gevonden' : scherm.filter === 'S' ? 'Geen suggesties' : 'Geen artikelen';
    l.appendChild(p);
  } else {
    if (rijGeheugen.size > artikelen.length + 50) rijGeheugen.clear();
    const frag = document.createDocumentFragment();
    for (const a of lijstNu) {
      frag.appendChild(rijUitGeheugen(a, {
        vertrekt: scherm.vertrekt.has(a.id) && !a.op,
        sug: scherm.filter === 'S' && !zoekend ? sugVan(a, vandaag) : null
      }));
    }
    l.appendChild(frag);
  }
  tekenWeggehaald(zoekend);
  tekenArchief(zoekend);
}

/* Eén luisteraar voor alle rondjes in de lijst. */
function lijstKlik(e) {
  const tel = e.target.closest('.teller');
  if (tel) {
    const b = e.target.closest('button');
    if (b) aantalZetten(tel.dataset.id, b.classList.contains('meer') ? 1 : -1);
    return;
  }
  if (e.target.closest('.icoon') || e.target.closest('.aantal')) {
    const id = e.target.closest('.item').dataset.id;
    scherm.teller = scherm.teller === id ? '' : id;
    tekenBoodschappen();
    /* Valt de teller onder de rand van het scherm, dan schuift hij in beeld. */
    const t = scherm.teller && document.querySelector('.teller');
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest' });
    return;
  }
  const naam = e.target.closest('.tekst');
  if (naam) { artikelOpenen(naam.closest('.item').dataset.id); return; }
  const knop = e.target.closest('.rondje');
  if (!knop) return;
  const id = knop.closest('.item').dataset.id;
  const a = artikelen.find((x) => x.id === id);
  if (!a) return;
  const t = tijdstipTekst(new Date());
  if (a.op) {
    if ((scherm.filter === 'L' || scherm.filter === 'E') && normNaam(scherm.zoek) === '') {
      /* Even grijs op zijn plek, dan naar "Van de lijst gehaald". */
      const timer = setTimeout(() => {
        scherm.vertrekt.delete(id);
        scherm.weggehaald.set(id, true);
        tekenBoodschappen();
      }, VERTRAGING);
      scherm.vertrekt.set(id, { timer });
    }
    handelen([{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: a.op, nieuw: '' },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: a.opdoor, nieuw: '' }]
      .concat(a.letter === 'E' ? [{ actie: 'zet', soort: 'artikel', id, veld: 'weg', oud: a.weg, nieuw: datumTekst(new Date()) }] : []));
  } else {
    const v = scherm.vertrekt.get(id);
    if (v) clearTimeout(v.timer);
    scherm.vertrekt.delete(id);
    scherm.weggehaald.delete(id);
    /* Uit het archief: het hele artikel mee, zodat het terugkomt als het intussen is opgeruimd. */
    const terugRecord = a.letter === 'E' && model.artikelen.get(id)
      ? [{ actie: 'terug', soort: 'artikel', id, record: Object.assign(recordNaarJson('artikel', model.artikelen.get(id)), { op: t, opdoor: ik }) }] : [];
    handelen(terugRecord.concat([{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: '', nieuw: t },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: a.opdoor, nieuw: ik }]));
  }
}
$('lijst').addEventListener('click', lijstKlik);
$('lijstKop').addEventListener('click', () => { if (normNaam(scherm.zoek)) return; scherm.dicht.lijst = !scherm.dicht.lijst; tekenBoodschappen(); });
$('midden').addEventListener('click', (e) => { if (e.target.closest('#weggehaald') || e.target.closest('#archief .lijst')) lijstKlik(e); });

function toevoegen() {
  const naam = schoonTekst($('invoerTekst').value);
  if (!naam) { $('invoerTekst').focus(); return; }
  /* Met # vooraan is het zoeken op een tag, geen nieuw artikel. */
  if (naam[0] === '#') { $('invoerTekst').blur(); return; }
  const nn = normNaam(naam); // één keer, niet per element (L1, performance)
  const bestaand = artikelen.find((a) => a.sleutel === nn);
  const t = tijdstipTekst(new Date());
  const id = bestaand ? bestaand.id : nieuweId();
  if (bestaand) {
    if (!bestaand.op) {
      /* Uit het archief: het hele artikel mee, net als met de + in het archief (K10). */
      const terug = bestaand.letter === 'E' && model.artikelen.get(id)
        ? [{ actie: 'terug', soort: 'artikel', id, record: Object.assign(recordNaarJson('artikel', model.artikelen.get(id)), { op: t, opdoor: ik }) }] : [];
      handelen(terug.concat([{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: '', nieuw: t },
                { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: bestaand.opdoor, nieuw: ik }]));
    }
  } else {
    handelen([{ actie: 'nieuw', soort: 'artikel', id, velden: { naam, soort: LETTER_SOORT[scherm.nieuwSoort], op: t, opdoor: ik } }]);
  }
  scherm.oplichten = id;
  /* Valt het buiten het filter, dan naar Op de lijst (daar staat het nu zeker) (B5). */
  const nu = artikelen.find((a) => a.id === id);
  if (nu && !inFilter(nu, scherm.filter, datumTekst(new Date()), false)) { scherm.filter = 'L'; weggehaaldLegen(); }
  vakLeeg($('invoerTekst'));
  scherm.zoek = '';
  scherm.zoekIn = '';
  scherm.nieuwSoort = soortVanFilter();
  tekenSoortknop();
  invoerBijwerken();
  tekenBoodschappen();
  if (scherm.oplichten) { oplichten($('lijst').querySelector('.item[data-id="' + scherm.oplichten + '"]')); scherm.oplichten = ''; }
}
/* Stond het er al: de regel licht even op en komt in beeld (K15). */
function oplichten(rij) {
  if (!rij) return;
  rij.classList.remove('oplicht');
  void rij.offsetWidth;
  rij.classList.add('oplicht');
  if (rij.scrollIntoView) rij.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => rij.classList.remove('oplicht'), 1100);
}

/* Annuleren: vak leeg, toetsenbord dicht, soort terug naar die van het filter. */
function invoerAnnuleren() {
  vakLeeg($('invoerTekst'));
  scherm.zoek = '';
  scherm.zoekIn = '';
  scherm.nieuwSoort = soortVanFilter();
  $('invoerTekst').blur();
  tekenSoortknop();
  invoerBijwerken();
  tekenBoodschappen();
}
$('invoerTerug').addEventListener('click', invoerAnnuleren);
/* Niet eerst het vak laten loslaten (dan verdwijnt de knop onder je vinger). */
$('invoerTerug').addEventListener('mousedown', (e) => e.preventDefault());
$('invoerTerug').addEventListener('pointerdown', (e) => e.preventDefault());
$('invoerTekst').addEventListener('focus', invoerBijwerken);
$('invoerTekst').addEventListener('blur', () => setTimeout(invoerBijwerken, 0));

$('invoerSoort').addEventListener('click', () => soortMenu($('soortMenu').hidden));
$('invoerPlus').addEventListener('click', toevoegen);
$('invoerTekst').addEventListener('input', () => {
  /* Nieuw zoeken begint in alles; wordt het vak leeg, dan blijf je op het filter dat je tijdens het zoeken koos. */
  const was = normNaam(scherm.zoek) !== '';
  scherm.zoek = $('invoerTekst').value;
  const is = normNaam(scherm.zoek) !== '';
  if (!was && is) scherm.zoekIn = '';
  if (was && !is && scherm.zoekIn) { scherm.filter = scherm.zoekIn; scherm.nieuwSoort = soortVanFilter(); tekenSoortknop(); scherm.zoekIn = ''; } weggehaaldLegen(); invoerBijwerken(); tekenBoodschappen(); });
$('invoerTekst').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); toevoegen(); } });
/* De tabbalk gaat alleen weg zolang het toetsenbord echt open is. Op Android
   sluit je het toetsenbord vaak met terug; het vak houdt dan de focus, dus
   focus alleen is geen goed teken. Het zichtbare deel van het scherm wel. */
const volleHoogte = { h: window.innerHeight };
function typenBijwerken() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk'))) volleHoogte.h = Math.max(volleHoogte.h, h);
  const actief = document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk');
  const open = !!actief && h < volleHoogte.h * 0.8;
  document.body.classList.toggle('typen', open);
}
for (const id of ['invoerTekst', 'winkelsTekst', 'doenTekst', 'logZoek']) {
  $(id).addEventListener('focus', () => setTimeout(typenBijwerken, 300));
  $(id).addEventListener('blur', () => setTimeout(typenBijwerken, 150));
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', typenBijwerken);
window.addEventListener('resize', typenBijwerken);

/* Verversen: elke paar minuten zolang de app in beeld is, en bij terugkomen of weer online. */
setInterval(() => { if (!document.hidden) planSync(0); }, VERVERS_GEWOON);
document.addEventListener('visibilitychange', () => {
  /* Naar de achtergrond met iets in de wachtrij: meteen versturen, niet pas bij de volgende keer openen (L3, data). */
  if (document.hidden) { if (wachtrij.length && navigator.onLine) planSync(0); return; }
  /* Een ander venster kan aanmelding of map veranderd hebben: opnieuw lezen (K5). */
  KV_GEHEUGEN.clear();
  standNagaan().then((opnieuw) => {
    /* Offline weer geopend: wekelijks terug alvast zelf uitrekenen (K10). */
    if (!opnieuw && !navigator.onLine && model && kopie) { bouwModel(); tekenAlles(); }
    planSync(300);
  });
});
window.addEventListener('online', () => planSync(300));
window.addEventListener('offline', () => { sync.offline = true; tekenWolk(); });

/* Heeft een ander venster intussen kopie of wachtrij opgeslagen? Dan die lezen,
   zodat dit venster niet met een oude wachtrij verder schrijft (M3). Normaal is
   dit één kleine leesactie. */
async function standNagaan() {
  try {
    const s = (await kvLees('stand')) || '';
    if (s === mijnStand || sync.bezig || !model) return false;
    const k = await kvLees('kopie');
    kopie = k && k.formaat === FORMAAT ? k : null;
    wachtrij = (await kvLees('wachtrij')) || [];
    mijnStand = s;
    bouwModel();
    tekenAlles();
    return true;
  } catch (e) { return false; }
}
async function gegevensLaden() {
  mijnStand = (await kvLees('stand')) || '';
  kopie = await kvGet('kopie');
  wachtrij = (await kvGet('wachtrij')) || [];
  /* Een kopie van een ander bestandsformaat telt niet (er is geen omzetting van
     oude formaten); ook het mandje en de keuzes niet. De wachtrij blijft: wat nog
     niet verstuurd is, gaat niet stil verloren. Bij de sync wordt elke handeling
     gecontroleerd; wat niet meer past, vervalt met de gewone melding (H1). */
  if (kopie && kopie.formaat !== FORMAAT) {
    kopie = null;
    for (const k of ['kopie', 'mandje', 'favorieten', 'winkel', 'gezien']) await kvDel(k);
    if (wachtrij.length) logboek(['Nieuwe app-versie: ' + telTekst(wachtrij.length, 'wijziging', 'wijzigingen') + ' van vóór de update worden alsnog verstuurd.']);
  }
  const auth = await kvGet('auth');
  ik = ((auth && auth.naam) || '').split(' ')[0];
  bouwModel();
  tekenSoortknop();
  tekenBoodschappen();
}

/* ---------- keuzelijst van onderen (winkel, afdeling) ---------- */
/* opt: { titel, secties: [{ titel?, ingeklapt?, opties: [{ id, naam, sub?, aantal?, actief? }] }],
   kies(id), zoek?: { placeholder, nieuw(naam) } }.
   Kruisje rechtsboven; "Zoeken of toevoegen" onderaan. Tijdens het typen één
   lijst met alles wat past, uit alle secties. */
const KRUIS = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
const PIJL_RECHTS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
const WIS_KNOP = '<button class="wis" type="button" aria-label="Leegmaken" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D96A6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>';
function keuzeOptie(o, kies) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'optie' + (o.actief ? ' actief' : '');
  b.innerHTML = (o.icoon || '') + '<span class="nm"></span>' + (o.aantal ? '<span class="tal"></span>' : '');
  if (o.sterk) b.classList.add('sterk');
  if (Array.isArray(o.sub)) b.classList.add('metsub');
  b.querySelector('.nm').textContent = o.naam;
  /* sub: tekst, of stukken waarvan { grijs: '…' } grijs wordt. */
  if (o.sub) {
    const s = document.createElement('span'); s.className = 'sub';
    for (const d of Array.isArray(o.sub) ? o.sub : [o.sub]) {
      const g = document.createElement('span');
      if (d && typeof d === 'object') { g.className = 'grijs'; g.textContent = d.grijs; } else { g.className = 'namen'; g.textContent = d; }
      s.appendChild(g);
    }
    b.querySelector('.nm').appendChild(s);
  }
  if (o.aantal) b.querySelector('.tal').textContent = telTekst(o.aantal, 'artikel', 'artikelen');
  if (o.actief) b.setAttribute('aria-current', 'true');
  b.addEventListener('click', () => { sluitKeuze(); kies(o.id); });
  return b;
}
/* Zonder wissel: een vaste kop (zelfde uiterlijk, geen pijl, niet in te klappen). */
function keuzeUitklapper(titel, open, wissel, tal) {
  const kb = document.createElement(wissel ? 'button' : 'div');
  kb.className = 'uitklapper' + (wissel ? '' : ' vast');
  kb.innerHTML = '<span></span><span class="tal"></span>' + (wissel ? PIJL_RECHTS : '');
  kb.querySelector('span').textContent = titel;
  kb.querySelector('.tal').textContent = tal || '';
  if (wissel) {
    kb.type = 'button';
    kb.setAttribute('aria-expanded', String(open));
    kb.querySelector('svg').style.transform = 'rotate(' + (open ? 90 : 0) + 'deg)';
    kb.addEventListener('click', wissel);
  }
  return kb;
}
function keuzeLeeg(tekst) { const p = document.createElement('div'); p.className = 'leeg'; p.textContent = tekst; return p; }

function keuzePaneel(titel, metZoek) {
  const k = document.createElement('div');
  k.id = 'keuze';
  k.setAttribute('role', 'dialog');
  k.setAttribute('aria-modal', 'true');
  /* titel: tekst, of stukken waarin { vet: '…' } vet wordt (zoals bij meldingen). */
  const delen = Array.isArray(titel) ? titel : [titel];
  k.setAttribute('aria-label', delen.map((s) => (s && typeof s === 'object' ? s.vet : s)).join(''));
  k.innerHTML = '<div class="paneel"><div class="kop"><h3></h3><button class="kruis" type="button" aria-label="Sluiten">' + KRUIS + '</button></div>' +
    '<div class="opties"></div>' +
    /* Geen kopje boven het zoekvak, net als bij de invoer onderaan de tabbladen. */
    (metZoek ? '<div class="zoek">' +
    '<div class="zoekbalk"><button class="zoeklinks" type="button" aria-label="Zoeken"></button><input id="keuzeZoek" type="text" aria-label="Zoeken of toevoegen" autocomplete="off" enterkeyhint="done">' + WIS_KNOP +
    '<button class="plusknop" type="button" aria-label="Toevoegen">' +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>' : '') + '</div>';
  const h3 = k.querySelector('h3');
  if (Array.isArray(titel)) h3.className = 'delen';
  for (const s of delen) {
    if (s && typeof s === 'object') { const b = document.createElement('b'); b.textContent = s.vet; h3.appendChild(b); }
    else h3.appendChild(document.createTextNode(s));
  }
  k.querySelector('.kruis').addEventListener('click', sluitKeuze);
  k.addEventListener('click', (e) => { if (e.target === k) sluitKeuze(); });
  return k;
}

function keuzeLijst(opt) {
  sluitKeuze();
  const k = keuzePaneel(opt.titel, !!opt.zoek);
  const inp = k.querySelector('input');
  if (inp) inp.placeholder = opt.zoek.placeholder;
  const opties = k.querySelector('.opties');
  const open = opt.secties.map((s) => !s.ingeklapt);
  /* Alle opties één keer (een winkel kan in twee secties staan). */
  const alle = [];
  const gezien = new Set();
  for (const s of opt.secties) for (const o of s.opties) if (!gezien.has(o.id)) { gezien.add(o.id); alle.push(o); }
  const teken = () => {
    const t = inp ? zoekVorm(inp.value) : '';
    opties.innerHTML = '';
    if (t) {
      const zicht = alle.filter((o) => zoekVorm(o.naam).indexOf(t) !== -1);
      for (const o of zicht) opties.appendChild(keuzeOptie(o, opt.kies));
      if (!zicht.length) opties.appendChild(keuzeLeeg('Niets gevonden'));
      return;
    }
    opt.secties.forEach((s, i) => {
      if (s.titel) opties.appendChild(keuzeUitklapper(s.titel, open[i], s.vast ? null : () => { open[i] = !open[i]; teken(); }, s.tal));
      if (open[i]) for (const o of s.opties) opties.appendChild(keuzeOptie(o, opt.kies));
    });
    if (!opties.children.length) opties.appendChild(keuzeLeeg('Nog niets'));
  };
  const toevoegenNu = () => {
    const v = schoonTekst(inp.value);
    if (!v) { inp.focus(); return; }
    const nn = normNaam(v); // één keer, niet per element (L1, performance)
    const bestaand = alle.find((o) => normNaam(o.naam) === nn);
    sluitKeuze();
    if (bestaand) opt.kies(bestaand.id); else opt.zoek.nieuw(v);
  };
  if (inp) {
    /* Links in het zoekvak: een loep; met tekst een terugpijl die het vak leegmaakt (zoals op de tabbladen). */
    const links = k.querySelector('.zoeklinks');
    const linksBij = () => { const typen = inp.value !== ''; links.innerHTML = typen ? TERUG_PIJL : LOEP; links.setAttribute('aria-label', typen ? 'Leegmaken' : 'Zoeken'); };
    links.addEventListener('click', () => { if (inp.value) { inp.value = ''; const w = k.querySelector('.wis'); if (w) w.hidden = true; teken(); linksBij(); } inp.focus(); });
    inp.addEventListener('input', linksBij);
    linksBij();
    inp.addEventListener('input', teken);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); toevoegenNu(); } });
    k.querySelector('.plusknop').addEventListener('click', toevoegenNu);
  }
  teken();
  keuzeTonen(k);
}
function sluitKeuze() { const k = $('keuze'); if (k) { laagDicht(k.laag); k.remove(); } }
/* Een paneel tonen, als laag: terug sluit het (of vraagt eerst, via k.vraag). */
function keuzeTonen(k) {
  document.body.appendChild(k);
  /* Focus in het paneel en erin houden (Tab gaat rond), zodat een schermlezer of
     toetsenbord niet achter het paneel belandt. */
  if (!k.contains(document.activeElement)) { const kr = k.querySelector('.kruis'); if (kr) kr.focus({ preventScroll: true }); }
  k.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = Array.from(k.querySelectorAll('button:not([disabled]),input,textarea,[tabindex="0"]')).filter((x) => !x.closest('[hidden]'));
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  });
  k.laag = laagOpen(() => {
    if (k.vraag) { const v = k.vraag(); if (v) return v; }
    k.remove();
    return true;
  });
}

/* ---------- tabblad Winkel (stap 7) ---------- */
/* Na afvinken blijft een regel even staan, zodat een mis-tik meteen terug te
   tikken is; daarna schuift hij naar "In het mandje" (winkel) of "Van de lijst
   gehaald" (boodschappen). Het mandje hoort bij deze telefoon, blijft bewaard
   en wordt alleen leeggemaakt met de knop. */
const VERTRAGING = 1500;
const VERVERS_WINKEL = 30 * 1000;
/* winkel.id: de gekozen winkel (per telefoon). Het mandje: artikel-id → { id, naam, winkel, op, opdoor, datum, alGekocht };
   per winkel apart, zodat er niets doorloopt van de ene winkel naar de andere. */
const winkel = { id: '', mandje: new Map(), vertraagd: new Map(), eldersOpen: false };

function winkelOpen() { return !$('scherm-winkel').hidden; }

function huidigeWinkel() { return winkelOpId.get(winkel.id) || null; }

async function winkelLaden() {
  winkel.id = (await kvGet('winkel')) || '';
  ws.favorieten = (await kvGet('favorieten')) || [];
  gezien.klaar = new Set((await kvGet('gezien')) || []);
  const st = await kvGet('doenStandaard');
  doen.standaard = DOEN_FILTERS.indexOf(st) !== -1 ? st : 'week';
  doen.filter = doen.standaard;
  const m = (await kvGet('mandje')) || [];
  winkel.mandje = new Map(m.filter((x) => x && x.id).map((x) => [x.id, x]));
}
/* "nieuw": door de ander op de lijst gezet en hier nog niet gezien. Gezien =
   in beeld geweest op Artikelen of Boodschappen en dat scherm weer verlaten
   (ander tabblad, app naar de achtergrond). Per telefoon, niet in het bestand;
   de sleutel bevat het moment van op de lijst zetten, dus opnieuw = weer nieuw. */
const gezien = { klaar: new Set(), inBeeld: new Set() };
function isNieuw(a) {
  if (!a.op || !a.opdoor || a.opdoor === ik || gezien.klaar.has(a.id + '|' + a.op)) return false;
  gezien.inBeeld.add(a.id + '|' + a.op);
  return true;
}
function nieuwGezien() {
  if (!gezien.inBeeld.size) return;
  for (const k of gezien.inBeeld) gezien.klaar.add(k);
  gezien.inBeeld.clear();
  /* Alleen bewaren wat nog op de lijst staat. */
  const nu = new Set(artikelen.filter((a) => a.op).map((a) => a.id + '|' + a.op));
  for (const k of gezien.klaar) if (!nu.has(k)) gezien.klaar.delete(k);
  bewaar('gezien', Array.from(gezien.klaar));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) nieuwGezien(); });
function mandjeBewaren() { bewaar('mandje', Array.from(winkel.mandje.values())); }

const ICOON_WINKEL = (kleur) => '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="' + kleur + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M10 20v-5h4v5"></path></svg>';
/* "Waar ga je heen?": eerst de winkels die nodig zijn (iets dat nergens
   anders te koop is), dan wat ook kan, dan ingeklapt de overige winkels. */
function winkelKiezen() {
  const tel = winkelTellingen(artikelen, winkels);
  /* Alfabetisch: welke winkel je eerst doet, hangt van de route af (parkeren
     en zo), niet van de lijst. */
  const optie = (x) => ({
    id: x.id, naam: x.naam, aantal: x.aantal, actief: x.id === winkel.id, sterk: true,
    icoon: ICOON_WINKEL('#4B3CC0'),
    /* Bij Nodig: wat alleen hier te koop is (afgekapt op één regel), grijs "+n"
       voor wat ook elders kan. Bij Kan ook geen namen: het aantal staat rechts. */
    sub: x.moet ? [x.alleen.join(', ')].concat(x.ook.length ? [{ grijs: '+' + x.ook.length }] : []) : null
  });
  /* De gekozen winkel bovenaan onder een vaste kop "Huidig" (met de streep); de groepen daaronder zonder hem. */
  const anders = (x) => x.id !== winkel.id;
  const moet = tel.filter((x) => x.moet && anders(x)), kan = tel.filter((x) => !x.moet && anders(x));
  const rest = winkels.filter((w) => anders(w) && !tel.some((x) => x.id === w.id));
  const secties = [];
  const gekozen = huidigeWinkel();
  if (gekozen) {
    const x = tel.find((y) => y.id === gekozen.id);
    secties.push({ titel: 'Huidig', vast: true, opties: [x ? optie(x) : { id: gekozen.id, naam: gekozen.naam, actief: true }] });
  }
  if (moet.length) secties.push({ titel: 'Nodig', tal: telTekst(moet.length, 'winkel', 'winkels'), opties: moet.map(optie) });
  /* "Kan ook" pak je pas als het alsnog moet: ingeklapt. Is er niets nodig,
     dan heet die groep "Te koop bij" en staat hij open. */
  if (kan.length) secties.push({ titel: moet.length ? 'Kan ook' : 'Te koop bij', ingeklapt: moet.length > 0, tal: telTekst(kan.length, 'winkel', 'winkels'), opties: kan.map(optie) });
  /* Altijd een kop, zoals in de andere keuzelijsten: zonder iets nodig of te koop is
     de groep open; met een gekozen winkel heet hij "Overige winkels", anders "Alle winkels". */
  if (rest.length) secties.push({ titel: tel.length || gekozen ? 'Overige winkels' : 'Alle winkels', ingeklapt: tel.length > 0, tal: telTekst(rest.length, 'winkel', 'winkels'),
    opties: rest.map((w) => ({ id: w.id, naam: w.naam, actief: w.id === winkel.id })) });
  keuzeLijst({
    titel: 'Waar ga je heen?',
    secties,
    kies: (id) => kiesWinkel(id),
    zoek: { placeholder: 'Winkel', nieuw: (naam) => {
      const id = nieuweId();
      handelen([{ actie: 'nieuw', soort: 'winkel', id, velden: { naam } }]);
      kiesWinkel(id);
    } }
  });
}
function kiesWinkel(id) {
  winkel.id = id;
  bewaar('winkel', id);
  tekenWinkel();
}

/* De winkels voor een keuzelijst: favorieten, dan ingeklapt "Overige winkels". */
function winkelSecties(lijst, actief) {
  /* Huidig (vast) met de gekozen winkel; Favorieten (inklapbaar, open); de rest
     als "Overige winkels" (ingeklapt) of, zonder favorieten, "Alle winkels" (open). */
  const optie = (w) => ({ id: w.id, naam: w.naam, actief: w.id === actief });
  const gekozen = lijst.find((w) => w.id === actief);
  const rest = lijst.filter((w) => w.id !== actief);
  const fav = rest.filter((w) => isFavoriet(w.id)), over = rest.filter((w) => !isFavoriet(w.id));
  const s = [];
  if (gekozen) s.push({ titel: 'Huidig', vast: true, opties: [optie(gekozen)] });
  if (fav.length) s.push({ titel: 'Favorieten', tal: telTekst(fav.length, 'winkel', 'winkels'), opties: fav.map(optie) });
  if (over.length) s.push({ titel: fav.length ? 'Overige winkels' : 'Alle winkels', ingeklapt: fav.length > 0, tal: telTekst(over.length, 'winkel', 'winkels'), opties: over.map(optie) });
  return s;
}

/* Winkelicoon bij "Zonder winkel": kies bij welke winkel het te koop is. Het
   komt daar onder "Afdeling onbekend" (met de speld) als die winkel afdelingen
   heeft; de afdeling kies je later. */
function bijWinkel(a) {
  const zet = (id) => handelen([{ actie: 'plaats', soort: 'artikel', id: a.id, winkel: id, afd: '' }]);
  keuzeLijst({
    titel: ['Waar is ', { vet: a.naam }, ' te koop?'],
    secties: winkelSecties(winkels, winkel.id),
    kies: zet,
    zoek: { placeholder: 'Winkel', nieuw: (naam) => {
      const id = nieuweId();
      handelen([{ actie: 'nieuw', soort: 'winkel', id, velden: { naam } }, { actie: 'plaats', soort: 'artikel', id: a.id, winkel: id, afd: '' }]);
    } }
  });
}

/* Waar ligt dit, in déze winkel? Kiezen legt vast: te koop hier, en in die afdeling. */
function waarLigtDit(a) {
  const w = huidigeWinkel();
  if (!w) { winkelKiezen(); return; }
  keuzeLijst({
    titel: ['Waar ligt ', { vet: a.naam }, ' bij ', { vet: w.naam }, '?'],
    secties: [{ opties: w.afdelingen.map((x) => ({ id: x.id, naam: x.naam })) }],
    kies: (afd) => handelen([{ actie: 'plaats', soort: 'artikel', id: a.id, winkel: w.id, afd }]),
    zoek: { placeholder: 'Afdeling', nieuw: (naam) => {
      const afd = nieuweId();
      handelen([{ actie: 'afdErbij', soort: 'winkel', id: w.id, afd: { id: afd, naam } },
                { actie: 'plaats', soort: 'artikel', id: a.id, winkel: w.id, afd }]);
    } }
  });
}

function afvinken(a) {
  const datum = datumTekst(new Date());
  const al = a.gekocht.indexOf(datum) !== -1;
  const nu = tijdstipTekst(new Date());
  /* Aankopen bewaren = 0: geen aankoop maken (K11). */
  const aankoop = aankopenBewaren(model) > 0 ? nieuweId() : '';
  winkel.mandje.set(a.id, { id: a.id, naam: a.naam, winkel: winkel.id, op: a.op, opdoor: a.opdoor, datum, alGekocht: al, aankoop });
  mandjeBewaren();
  const hs = (aankoop ? [{ actie: 'aankoop', soort: 'aankoop', id: aankoop, naam: a.naam, tijd: nu }] : []).concat([
    { actie: 'zet', soort: 'artikel', id: a.id, veld: 'op', oud: a.op, nieuw: '' },
    { actie: 'zet', soort: 'artikel', id: a.id, veld: 'opdoor', oud: a.opdoor, nieuw: '' }]);
  if (!al) hs.push({ actie: 'gekocht', soort: 'artikel', id: a.id, datum });
  winkel.vertraagd.set(a.id, setTimeout(() => { winkel.vertraagd.delete(a.id); if (winkelOpen()) tekenWinkel(); }, VERTRAGING));
  handelen(hs);
}

function terugOpLijst(id) {
  const m = winkel.mandje.get(id);
  if (!m) return;
  clearTimeout(winkel.vertraagd.get(id));
  winkel.vertraagd.delete(id);
  winkel.mandje.delete(id);
  mandjeBewaren();
  const hs = [{ actie: 'zet', soort: 'artikel', id, veld: 'op', oud: '', nieuw: m.op || tijdstipTekst(new Date()) },
              { actie: 'zet', soort: 'artikel', id, veld: 'opdoor', oud: '', nieuw: m.opdoor }];
  if (!m.alGekocht) hs.push({ actie: 'nietGekocht', soort: 'artikel', id, datum: m.datum });
  if (m.aankoop) hs.push({ actie: 'weg', soort: 'aankoop', id: m.aankoop });
  handelen(hs);
}

function mandjeHier() { return Array.from(winkel.mandje.values()).filter((m) => m.winkel === winkel.id); }
/* Leegmaken haalt het groepje uit beeld (de aankopen blijven); 6 s terug te zetten. */
function mandjeLeegmaken() {
  const weg = mandjeHier().filter((m) => !winkel.vertraagd.has(m.id));
  for (const m of weg) winkel.mandje.delete(m.id);
  mandjeBewaren();
  tekenWinkel();
  const id = 'm-mandje-' + willekeurig(6);
  melding(id, 'Winkelmand leeggemaakt.', [{ tekst: 'Ongedaan maken', aftel: ONGEDAAN, actie: () => {
    meldingWeg(id);
    for (const m of weg) if (!winkel.mandje.has(m.id)) winkel.mandje.set(m.id, m);
    mandjeBewaren();
    tekenWinkel();
  } }], 'info');
  setTimeout(() => meldingWeg(id), ONGEDAAN);
}

/* Eén definitie voor alle rondjes: 28 px; het gevulde rondje is even groot als
   de buitenkant van het open rondje (lijn meegerekend). Ze krimpen nooit. */
const RONDJE = {
  aan: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13.5" fill="#4B3CC0"></circle><path d="M8.8 14.4l3.4 3.4 7-7.6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
  plus: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#4B3CC0" stroke-width="2.2"></circle><path d="M14 9v10M9 14h10" fill="none" stroke="#4B3CC0" stroke-width="2.2" stroke-linecap="round"></path></svg>',

function winkelRij(a, soort) {
  const rij = document.createElement('div');
  const gedaan = soort === 'gedaan';
  rij.className = 'wrij' + (gedaan ? ' gedaan' : '');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'vink';
  b.setAttribute('aria-pressed', String(gedaan));
  b.innerHTML = (gedaan ? RONDJE.gedaan : soort === 'elders' ? RONDJE.elders : RONDJE.leeg) + '<span class="nm"></span>';
  b.querySelector('.nm').textContent = a.naam;
  if (a.aantal > 1) { const n = document.createElement('span'); n.className = 'aantal'; n.textContent = a.aantal + '×'; b.querySelector('.nm').appendChild(n); }
  b.setAttribute('aria-label', (a.aantal > 1 ? a.aantal + '× ' : '') + (gedaan ? a.naam + ', in de winkelmand; terugzetten' : a.naam + ' afvinken'));
  if (!gedaan && isNieuw(a)) {
    const n = document.createElement('span'); n.className = 'nieuw'; n.textContent = 'nieuw';
    n.style.cssText = 'padding:1px 7px;background:#DDF1F2;color:#0A6570;font-size:17px;font-weight:600;flex-shrink:0';
    b.appendChild(n);
  }
  b.addEventListener('click', () => gedaan ? terugOpLijst(a.id) : afvinken(a));
  rij.appendChild(b);
  if (soort === 'onbekend' || soort === 'zonder') {
    const w = document.createElement('button');
    w.type = 'button'; w.className = 'icoonknop ' + (soort === 'zonder' ? 'naarwinkel' : 'waar');
    w.setAttribute('aria-label', soort === 'zonder' ? 'Waar is ' + a.naam + ' te koop?' : 'Waar ligt ' + a.naam + '? Afdeling kiezen');
    w.innerHTML = soort === 'zonder' ? ICOON_PUI : SPELD;
    w.addEventListener('click', () => soort === 'zonder' ? bijWinkel(a) : waarLigtDit(a));
    rij.appendChild(w);
  }
  if (soort === 'elders' && a.plekken.length) {
    const s = document.createElement('span'); s.className = 'winkels';
    s.textContent = winkelsRegel(a);
    b.querySelector('.nm').appendChild(s);

  if ((a.notitie || a.link) && !gedaan) b.querySelector('.nm').appendChild(notitieRegel(a));

/* Een blok in de winkel: optioneel een kop (tekst of knop) met rechts een knop. */
function winkelSectie(doel, titel, grijs, rechts, tal) {
  const sec = document.createElement('section'); sec.className = 'afd' + (grijs ? ' grijs' : '');
  if (titel !== null) {
    const kop = document.createElement('div'); kop.className = 'afdkop';
    if (typeof titel === 'string') { const s = document.createElement('span'); s.textContent = titel; kop.appendChild(s); }
    else kop.appendChild(titel);
    if (tal) { const t = document.createElement('span'); t.className = 'tal'; t.textContent = tal; kop.appendChild(t); }
    if (rechts) kop.appendChild(rechts);
    sec.appendChild(kop);
  }
  doel.appendChild(sec);
  return sec;
}

/* "Niet bij <winkel>": ingeklapt, wat hier niet te koop is. */

/* "In het mandje", met rechts de knop om het leeg te maken. */

const WINKELKOP = $('winkelKop');
function tekenWinkel() {
  if (!model || !winkelOpen()) return;
  const w = huidigeWinkel();
  WINKELKOP.querySelector('#winkelNaam').textContent = w ? w.naam : 'Winkel kiezen';
  /* Net afgevinkt (1,5 s): nog op zijn plek, als gedaan. */
  const weergave = artikelen.map((a) => {
    const m = winkel.vertraagd.has(a.id) && winkel.mandje.get(a.id);
    return m ? Object.assign({}, a, { op: m.op || 'x', opdoor: m.opdoor }) : a;
  });
  const ind = winkelIndeling(weergave, w);
  const soortVan = (a) => winkel.vertraagd.has(a.id) ? 'gedaan' : null;
  const doel = $('winkelLijst');
  doel.innerHTML = '';
  /* De kop hoort alleen in de winkelkaart; zonder kaart (lege lijst, ook bij het
     openen) niet los onderaan laten staan. */
  WINKELKOP.remove();
  if (!gekoppeld) { const p = document.createElement('div'); p.className = 'kaart leegregel'; p.textContent = 'Nog niet gekoppeld'; doel.appendChild(p); return; }
  if (ind.zonder.length) {
    /* Zelfde vorm als de winkelkaart, met een lichte streep: een eigen groep, niet de winkel. */
    const kaart = document.createElement('section');
    kaart.className = 'winkelkaart zonder';
    kaart.innerHTML = '<div class="winkelkop"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M10 20v-5h4v5"></path><path d="M3 3l18 18"></path></svg><h3></h3><span class="tal"></span></div>';
    kaart.querySelector('h3').textContent = 'Winkel?';
    kaart.querySelector('.tal').textContent = telTekst(ind.zonder.length, 'artikel', 'artikelen');
    const sec = winkelSectie(kaart, null);
    for (const a of ind.zonder) sec.appendChild(winkelRij(a, soortVan(a) || 'zonder'));
    doel.appendChild(kaart);
  }
  const open = ind.zonder.length + ind.onbekend.length + ind.groepen.reduce((n, g) => n + g.items.length, 0) + ind.elders.length;
  const inMandje = mandjeHier().filter((m) => !winkel.vertraagd.has(m.id));
  /* Niets op de lijst: geen winkel tonen (de keuze blijft bewaard voor straks). */
  if (!open && !inMandje.length) { const p = document.createElement('div'); p.className = 'kaart leegregel'; p.textContent = 'Geen artikelen'; doel.appendChild(p); }
  else {
    /* De winkelkaart alleen als er hier of elders iets te halen is; met alleen
       "Winkel?" of alleen het mandje heeft hij geen inhoud. */
    const hierOfElders = ind.onbekend.length + ind.groepen.reduce((n, g) => n + g.items.length, 0) + ind.elders.length;
    if (hierOfElders) tekenWinkelkaart(doel, w, ind, soortVan);
    if (ind.elders.length) eldersSectie(doel, w, ind.elders, soortVan);
    if (inMandje.length) mandjeSectie(doel, inMandje);
  }
  aankopenRij(doel);
  /* De voortgang gaat over de hele lijst: wat in een van de mandjes ligt, telt als gehaald. */
  const klaar = winkel.mandje.size;
  const totaal = open - winkel.vertraagd.size + klaar;
  $('winkelTeller').textContent = klaar + ' van ' + telTekst(totaal, 'artikel', 'artikelen');
  $('winkelVoortgang').style.width = (totaal ? Math.round(100 * klaar / totaal) : 0) + '%';
}

/* Logboeken (Aankopen op Boodschappen, Historie op Doen): gedeeld, per dag,
   nieuwste eerst; zoeken in de balk onderaan; een tik op een regel = verwijderen
   (met een vraag, zonder Ongedaan maken: het is maar een logboekregel). */
const LOG = {
  aankoop: { titel: 'Aankopen', scherm: 'winkel', doel: 'aankopenScherm', terug: 'Terug naar Boodschappen', een: 'artikel', meer: 'artikelen', leeg: 'Nog geen aankopen' },
  historie: { titel: 'Historie', scherm: 'doen', doel: 'historieScherm', terug: 'Terug naar Doen', een: 'actie', meer: 'acties', leeg: 'Nog niets afgerond' }
};
const logStand = { open: '', laag: null };
function logRij(doel, soort) {
  const verz = verzameling(model, soort);
  /* Aankopen bewaren = 0 en niets bewaard: geen regel (K11). */
  if (soort === 'aankoop' && aankopenBewaren(model) === 0 && !verz.size) return;
  const k = document.createElement('div');
  k.className = 'kaart naaraankopen';
  k.innerHTML = '<button class="rij knoprij" type="button"><span class="label"></span><span class="waarde"></span>' + PIJL_IN + '</button>';
  k.querySelector('.label').textContent = LOG[soort].titel;

  k.querySelector('button').addEventListener('click', () => logOpenen(soort));
  doel.appendChild(k);
}
function aankopenRij(doel) { logRij(doel, 'aankoop'); }
function logOpenen(soort) {
  const c = LOG[soort];
  logStand.open = soort;
  $('scherm-' + c.scherm).classList.add('sub');
  if (soort === 'historie') $('balk-doen').hidden = true;
  const doel = $(c.doel);
  doel.hidden = false;
  doel.innerHTML = '<div class="wdkop"><button class="terug" type="button">' + PIJL_TERUG + '</button><h2></h2></div><div class="loglijst"></div>';
  doel.querySelector('.terug').setAttribute('aria-label', c.terug);
  doel.querySelector('h2').textContent = c.titel;
  /* Zoeken onderaan in een vaste balk, net als op de tabbladen. */
  vakLeeg($('logZoek'));
  $('logZoek').setAttribute('aria-label', c.titel + ' zoeken');
  $('balk-log').hidden = false;
  doel.querySelector('.terug').addEventListener('click', () => logSluiten());
  doel.querySelector('.loglijst').addEventListener('click', (e) => { const rij = e.target.closest('.aankooprij'); if (rij) logRegelWeg(soort, rij.dataset.id); });
  logStand.laag = laagOpen(() => { logStand.laag = null; logSluiten(); return true; });
  $('midden').scrollTop = 0;
  tekenLog();
}
function aankopenOpenen() { logOpenen('aankoop'); }
function tekenLog() {
  const soort = logStand.open;
  if (!soort) return;
  const c = LOG[soort];
  const lijstEl = $(c.doel).querySelector('.loglijst');
  if (!lijstEl) return;
  const z = zoekVorm($('logZoek').value);
  const verz = verzameling(model, soort);
  /* Niets veranderd (zelfde regels, zelfde zoekterm, zelfde dag): niet opnieuw opbouwen.
     Logboekregels veranderen nooit, er komen er alleen bij of af (M1, performance). */
  const sleutel = soort + '\u0001' + z + '\u0001' + datumTekst(new Date()) + '\u0001' + Array.from(verz.keys()).join();
  if (lijstEl.dataset.sleutel === sleutel) return;
  lijstEl.dataset.sleutel = sleutel;
  const alle = opTijd(verz).filter((x) => !z || logZoekVorm(x).indexOf(z) !== -1);
  lijstEl.innerHTML = '';
  if (!alle.length) { const p = document.createElement('div'); p.className = 'kaart leegregel'; p.textContent = z ? 'Niets gevonden' : c.leeg; lijstEl.appendChild(p); return; }
  const frag = document.createDocumentFragment();
  let dag = '', lijst = null, tal = null, n = 0;
  for (const x of alle) {
    const d = x.tijd.slice(0, 10);
    if (d !== dag) {
      if (tal) tal.textContent = telTekst(n, c.een, c.meer);
      dag = d; n = 0;
      const g = document.createElement('section'); g.className = 'blok aankoopgroep';
      g.innerHTML = '<div class="kopbalk"><h3></h3><span class="tal"></span></div><div class="lijst"></div>';
      g.querySelector('h3').textContent = datumLabel(d) + (d.slice(0, 4) !== String(new Date().getFullYear()) ? ' ' + d.slice(0, 4) : '');
      tal = g.querySelector('.tal'); lijst = g.querySelector('.lijst');
      frag.appendChild(g);
    }
    const r = document.createElement('button'); r.type = 'button'; r.className = 'aankooprij'; r.dataset.id = x.id;
    r.innerHTML = '<span class="nm"></span><span class="tijd"></span>';
    r.querySelector('.nm').textContent = x.naam;
    r.querySelector('.tijd').textContent = x.tijd.slice(11, 16);
    r.setAttribute('aria-label', x.naam + ', ' + x.tijd.slice(11, 16) + ', verwijderen');
    lijst.appendChild(r);
    n++;
  }
  if (tal) tal.textContent = telTekst(n, c.een, c.meer);
  lijstEl.appendChild(frag);
}
function tekenAankopen() { tekenLog(); }
/* Zoekvorm per logboekregel één keer uitrekenen (de naam verandert nooit). */
const logZoekGeheugen = new Map();
function logZoekVorm(x) {
  let v = logZoekGeheugen.get(x.id);
  if (v === undefined) { if (logZoekGeheugen.size > 3000) logZoekGeheugen.clear(); v = zoekVorm(x.naam); logZoekGeheugen.set(x.id, v); }
  return v;
}
/* Een regel weggooien: eerst vragen, bij allebei weg. */
function logRegelWeg(soort, id) {
  const x = verzameling(model, soort).get(id);
  if (!x) return;
  const k = keuzePaneel([{ vet: x.naam }], false);
  k.querySelector('.opties').outerHTML = '<p class="paneeltekst"></p><div class="bewerkknoppen" style="padding:10px 14px 14px"><button class="knop tweede grijs" type="button">Annuleren</button><button class="knop rood" type="button">Verwijderen</button></div>';
  const d = x.tijd.slice(0, 10);
  k.querySelector('.paneeltekst').textContent = datumLabel(d).replace(/^Vandaag · .*/, 'Vandaag') + (d.slice(0, 4) !== String(new Date().getFullYear()) ? ' ' + d.slice(0, 4) : '') + ' ' + x.tijd.slice(11, 16);

function logSluiten() {
  const soort = logStand.open;
  if (!soort) return;
  const c = LOG[soort];
  laagDicht(logStand.laag); logStand.laag = null;
  logStand.open = '';
  sluitKeuze();
  $('scherm-' + c.scherm).classList.remove('sub');
  $('balk-log').hidden = true;
  if (soort === 'historie') $('balk-doen').hidden = $('scherm-doen').hidden;
  vakLeeg($('logZoek'));
  $('logZoek').blur();

function aankopenSluiten() { logSluiten(); }

/* De gekozen winkel als één kaart: kop met de winkelkeuze, dan "Afdeling
   onbekend" (alleen als de winkel afdelingen heeft) en de afdelingen. */
function tekenWinkelkaart(doel, w, ind, soortVan) {
  const kaart = document.createElement('section');
  kaart.className = 'winkelkaart';
  kaart.appendChild(WINKELKOP);
  doel.appendChild(kaart);
  const metAfd = !!w && w.afdelingen.length > 0;
  if (ind.onbekend.length) {
    const sec = winkelSectie(kaart, metAfd ? 'Afdeling onbekend' : null);
    for (const a of ind.onbekend) sec.appendChild(winkelRij(a, soortVan(a) || (metAfd ? 'onbekend' : 'gewoon')));
  }
  for (const g of ind.groepen) {
    const sec = winkelSectie(kaart, g.afd.naam);
    for (const a of g.items) sec.appendChild(winkelRij(a, soortVan(a) || 'gewoon'));
  }
  const n = ind.onbekend.length + ind.groepen.reduce((t, g) => t + g.items.length, 0);
  WINKELKOP.querySelector('#winkelHier').textContent = w && n ? telTekst(n, 'artikel', 'artikelen') : '';
  return kaart;
}

    (opt.metNotitie ? '<div class="naamveld"><label for="bewerkNotitie">Notitie</label><textarea id="bewerkNotitie" rows="1" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></textarea></div>' +
      '<div class="naamveld"><label for="bewerkLink">Link</label><input id="bewerkLink" type="url" inputmode="url" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>' : '') +
    '<p class="paneelfout" role="alert" hidden></p>' +
    '<div class="bewerkknoppen"><button class="prul" type="button">' + PRULLENBAK + '</button><button class="knop" type="button">Opslaan</button></div></div>';
  k.querySelector('h3').textContent = opt.titel;
  k.querySelector('.prul').setAttribute('aria-label', opt.wegLabel);
  const inp = k.querySelector('#bewerkNaam');
  inp.value = opt.naam;
  if (opt.metNotitie) {
    const nt = k.querySelector('#bewerkNotitie');
    nt.value = opt.notitie || ''; k.querySelector('#bewerkLink').value = opt.link || ''; tagKeuze(nt, alleNotities, true);
    /* Groeit mee over meerdere regels, zoals bij een artikel; Enter = opslaan. */
    const hoog = () => { nt.style.height = 'auto'; nt.style.height = nt.scrollHeight + 4 + 'px'; };
    nt.addEventListener('input', () => { nt.value = nt.value.replace(/[\r\n]+/g, ' '); hoog(); });
    nt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); opslaan(); } });
    setTimeout(hoog, 0);
  }
  /* Een fout (dubbele naam, onveilige link) staat in het paneel; het paneel blijft open. */
  const fout = (tekst) => { const f = k.querySelector('.paneelfout'); f.textContent = tekst || ''; f.hidden = !tekst; };
  const stand = () => [inp.value, opt.metNotitie ? k.querySelector('#bewerkNotitie').value : '', opt.metNotitie ? k.querySelector('#bewerkLink').value : ''].join('\u0001');
  const begin = stand();
  const opslaan = () => {
    const v = schoonTekst(inp.value);
    if (!v) { inp.focus(); return; }
    if (v[0] === '#' && v !== opt.naam) { fout('Een naam kan niet met # beginnen.'); return; }
    let extra;
    if (opt.metNotitie) {
      const ruw = k.querySelector('#bewerkLink').value.trim();
      const link = ruw ? veiligeLink(ruw) : '';
      if (link === null) { fout('Alleen links met https:// zijn toegestaan.'); return; }
      extra = { notitie: schoonTekst(k.querySelector('#bewerkNotitie').value), link };
    } else if (v === opt.naam) { sluitKeuze(); return; }
    const probleem = opt.opslaan(v, extra);
    if (probleem) { fout(probleem); return; }
    sluitKeuze();
  };
  /* Sluiten met wijzigingen: eerst vragen, net als bij een artikel. */
  const dicht = () => { if (stand() !== begin) paneelVraag(k, opslaan); else sluitKeuze(); };
  k.vraag = () => (stand() !== begin ? () => paneelVraag(k, opslaan) : null);
  for (const veld of k.querySelectorAll('.naamveld input')) veld.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); opslaan(); } });
  k.querySelector('.knop').addEventListener('click', opslaan);
  k.querySelector('.prul').addEventListener('click', () => { sluitKeuze(); opt.verwijder(); });
  k.querySelector('.kruis').addEventListener('click', dicht);
  k.addEventListener('click', (e) => { if (e.target === k) dicht(); });
  keuzeTonen(k);
}
/* "Wijzigingen opslaan?" boven een bewerkpaneel: het paneel wacht verborgen.
   Weggooien = beide dicht; Opslaan = opslaan (bij een fout blijft het paneel);
   kruisje of terug = verder bewerken. */
function paneelVraag(paneel, opslaan) {
  paneel.id = 'keuzeWacht';

  v.addEventListener('click', (e) => { if (e.target === v) terug(); });

  keuzeTonen(v);

/* Verslepen aan de greep: de regel volgt de vinger, de andere schuiven opzij;
   bij loslaten één handeling met de nieuwe volgorde. */
function slepenAan(lijstEl, w) {
  lijstEl.addEventListener('pointerdown', (e) => {
    const greep = e.target.closest('.greep');
    if (!greep) return;
    e.preventDefault();
    const rij = greep.closest('.arij');
    const rijen = Array.from(lijstEl.querySelectorAll('.arij'));
    const van = rijen.indexOf(rij);
    const hoogte = rij.getBoundingClientRect().height || 56;
    const y0 = e.clientY;
    let naar = van;
    if (greep.setPointerCapture && e.pointerId !== undefined) try { greep.setPointerCapture(e.pointerId); } catch (x) { /* niet nodig */ }
    rij.classList.add('sleept');
    ws.sleept = true;
    const beweeg = (ev) => {
      const dy = ev.clientY - y0;
      naar = Math.max(0, Math.min(rijen.length - 1, van + Math.round(dy / hoogte)));
      rij.style.transform = 'translateY(' + dy + 'px)';
      rijen.forEach((r, i) => {
        if (r === rij) return;
        const schuif = van < naar && i > van && i <= naar ? -hoogte : van > naar && i >= naar && i < van ? hoogte : 0;
        r.style.transform = schuif ? 'translateY(' + schuif + 'px)' : '';
      });
    };
    const los = () => {
      greep.removeEventListener('pointermove', beweeg);
      greep.removeEventListener('pointerup', los);
      greep.removeEventListener('pointercancel', los);
      rijen.forEach((r) => { r.style.transform = ''; });
      rij.classList.remove('sleept');
      ws.sleept = false;
      if (naar !== van) {
        const volgorde = rijen.map((r) => r.dataset.id);
        volgorde.splice(naar, 0, volgorde.splice(van, 1)[0]);
        handelen([{ actie: 'volgorde', soort: 'winkel', id: w.id, volgorde }]);
      } else tekenWinkels();
    };
    greep.addEventListener('pointermove', beweeg);
    greep.addEventListener('pointerup', los);
    greep.addEventListener('pointercancel', los);
  });
}

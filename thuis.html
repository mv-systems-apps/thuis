const KLEUR = { E: '#6A3BC4', W: '#1D3FAF', R: '#0A7581', L: '#4B3CC0', S: '#9A5B06' };
const TINT = { E: '#EDE6FA', W: '#E3E8FA', R: '#DDF1F2', L: '#E9E6F8', S: '#FBF0DA' };
const SOORTNAAM = { E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig' };
const PADEN = {
  E: '<rect x="4" y="4" width="16" height="16"></rect><path d="M10.2 9.2l2.3-1.7V17"></path>',
  W: '<circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 8.5h4.8l-3 7"></path>',
  R: '<path d="M3.5 4h17v4h-17z"></path><path d="M5 8h14v12H5z"></path><path d="M10 12h4"></path>',
  L: '<path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"></path>',
  S: '<path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path>'
};
const WINKELSYMBOOL = '<path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M10 20v-5h4v5"></path>';
function svgIcoon(pad, kleur, maat) {
  return '<svg width="' + maat + '" height="' + maat + '" viewBox="0 0 24 24" fill="none" stroke="' + kleur +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">' + pad + '</svg>';
}

const scherm = { filter: 'L', nieuwSoort: 'E', zoek: '', vertrekt: new Map(), weggehaald: new Map() };
function weggehaaldLegen() {
  for (const v of scherm.vertrekt.values()) clearTimeout(v.timer);
  scherm.vertrekt.clear();
  scherm.weggehaald.clear();
}

function tekenSoortknop() {
  const k = scherm.nieuwSoort;
  const b = $('invoerSoort');
  b.style.background = TINT[k];
  b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) +
    '<svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l4-4 4 4"></path></svg>';
  b.setAttribute('aria-label', 'Soort voor nieuw artikel: ' + SOORTNAAM[k].toLowerCase() + '. Wijzigen');
}

function soortMenu(open) {
  const m = $('soortMenu');
  $('invoerSoort').setAttribute('aria-expanded', String(open));
  let ag = $('achtergrond');
  if (!open) { m.hidden = true; if (ag) ag.remove(); return; }
  m.innerHTML = '';
  for (const k of ['E', 'W', 'R']) {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', String(k === scherm.nieuwSoort));
    b.innerHTML = svgIcoon(PADEN[k], KLEUR[k], 24) + '<span>' + SOORTNAAM[k] + '</span>' +
      (k === scherm.nieuwSoort ? svgIcoon('<path d="M5 12l5 5 9-10"></path>', '#4B3CC0', 20) : '');
    b.addEventListener('click', () => { scherm.nieuwSoort = k; soortMenu(false); tekenSoortknop(); $('invoerTekst').focus(); });
    m.appendChild(b);
  }
  ag = document.createElement('button');
  ag.id = 'achtergrond'; ag.type = 'button'; ag.setAttribute('aria-label', 'Menu sluiten');
  ag.addEventListener('click', () => soortMenu(false));
  document.body.appendChild(ag);
  m.hidden = false;
}

function tekenFilters() {
  const vandaag = datumTekst(new Date());
  const tel = {
    L: artikelen.filter((a) => a.op).length,
    E: artikelen.filter((a) => a.letter === 'E').length,
    W: artikelen.filter((a) => a.letter === 'W').length,
    R: artikelen.filter((a) => a.letter === 'R').length,
    S: artikelen.filter((a) => !a.op && suggestie(a.gekocht, vandaag)).length
  };
  const namen = { L: 'Op de lijst', E: 'Eenmalig', W: 'Wekelijks', R: 'Regelmatig', S: 'Suggesties' };
  const f = $('filters');
  f.innerHTML = '';
  for (const k of ['L', 'E', 'W', 'R', 'S']) {
    const aan = scherm.filter === k;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'filter';
    b.setAttribute('aria-pressed', String(aan));
    b.setAttribute('aria-label', namen[k] + ', ' + tel[k]);
    b.style.background = aan ? KLEUR[k] : TINT[k];
    b.style.color = aan ? '#FFFFFF' : KLEUR[k];
    b.innerHTML = svgIcoon(PADEN[k], aan ? '#FFFFFF' : KLEUR[k], 22) + '<span>' + tel[k] + '</span>';
    b.addEventListener('click', () => { scherm.filter = k; weggehaaldLegen(); tekenBoodschappen(); });
    f.appendChild(b);
  }
}

function tekenBoodschappen() {
  if (!model) return;
  if (!gekoppeld) {
    $('filters').hidden = true;
    $('lijstTitel').textContent = 'Op de lijst';
    $('lijstAantal').textContent = '';
    $('lijst').innerHTML = '<div class="leeg">Meld je eerst aan en koppel de gedeelde map, bij Instellingen.</div>';
    return;
  }
  const zoekend = normNaam(scherm.zoek) !== '';
  $('filters').hidden = zoekend;
  if (!zoekend) tekenFilters();
  const vandaag = datumTekst(new Date());
  let lijstNu, titel, onder;
  if (zoekend) {
    lijstNu = zoekArtikelen(artikelen, scherm.zoek);
    titel = 'Gevonden';
    onder = lijstNu.length + ' · ' + lijstNu.filter((a) => a.op).length + ' op de lijst';
  } else if (scherm.filter === 'L') {
    lijstNu = artikelen.filter((a) => a.op || scherm.vertrekt.has(a.naam));
    titel = 'Op de lijst'; onder = artikelen.filter((a) => a.op).length + ' · a–z';
  } else if (scherm.filter === 'S') {
    lijstNu = artikelen.filter((a) => !a.op && suggestie(a.gekocht, vandaag));
    titel = 'Suggesties'; onder = lijstNu.length + ' · langer geleden';
  } else {
    lijstNu = artikelen.filter((a) => a.letter === scherm.filter);
    titel = SOORTNAAM[scherm.filter];
    onder = lijstNu.length + ' · ' + lijstNu.filter((a) => a.op).length + ' op de lijst';
  }
  $('lijstTitel').textContent = titel;
  $('lijstAantal').textContent = onder;
  const l = $('lijst');
  const frag = document.createDocumentFragment();
  for (const a of lijstNu) {
    const rij = document.createElement('div');
    const vertrekt = scherm.vertrekt.has(a.naam) && !a.op;
    rij.className = 'item' + (vertrekt ? ' vertrekt' : '');
    rij.dataset.naam = a.naam;
    const sug = scherm.filter === 'S' && !zoekend ? suggestie(a.gekocht, vandaag) : null;
    const nieuw = a.op && a.opdoor && a.opdoor !== ik && Date.now() - Date.parse(a.op) < 15 * 60000;
    rij.innerHTML =
      '<span class="icoon" role="img" aria-label="' + SOORTNAAM[a.letter].toLowerCase() + '">' + svgIcoon(PADEN[a.letter], KLEUR[a.letter], 24) + '</span>' +
      '<span class="tekst"><span class="naam"><span></span>' +
      (a.plekken.length ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="alleen bij ' + a.plekken.map((p) => p.winkel).join(', ').replace(/"/g, '') + '">' + WINKELSYMBOOL + '</svg>' : '') +
      (nieuw ? '<span class="nieuw">nieuw</span>' : '') + '</span>' +
      (sug ? '<span class="hint"></span>' : '') + '</span>' +
      '<button class="rondje" type="button" aria-pressed="' + (a.op ? 'true' : 'false') + '">' + (a.op ? RONDJE.aan : RONDJE.plus) + '</button>';
    rij.querySelector('.naam > span').textContent = a.naam;
    if (sug) rij.querySelector('.hint').textContent = suggestieTekst(sug);
    rij.querySelector('.rondje').setAttribute('aria-label', a.op ? a.naam + ' staat op de lijst; van de lijst halen' : a.naam + ' op de lijst zetten');
    frag.appendChild(rij);
  }
  l.innerHTML = '';
  if (!lijstNu.length) {
    const p = document.createElement('div');
    p.className = 'leeg';
    p.textContent = zoekend ? 'Niets gevonden' : scherm.filter === 'S' ? 'Geen suggesties' : 'Geen artikelen';
    l.appendChild(p);
  } else {
    l.appendChild(frag);
  }
  const weg = (!zoekend && scherm.filter === 'L') ? artikelen.filter((a) => !a.op && scherm.weggehaald.has(a.naam)) : [];
  let sec = $('weggehaald');
  if (sec) sec.remove();
  if (weg.length) {
    sec = document.createElement('div');
    sec.id = 'weggehaald';
    sec.className = 'weggehaald';
    sec.innerHTML = '<div class="kopregel" style="padding-top:10px"><h2 style="color:#5A6472">Van de lijst gehaald</h2><span>' + weg.length + '</span></div><div class="lijst"></div>';
    for (const a of weg) {
      const rij = document.createElement('div');
      rij.className = 'item';
      rij.dataset.naam = a.naam;
      rij.innerHTML = '<span class="icoon" role="img" aria-label="' + SOORTNAAM[a.letter].toLowerCase() + '">' + svgIcoon(PADEN[a.letter], KLEUR[a.letter], 24) + '</span>' +
        '<span class="tekst"><span class="naam"><span></span></span></span><button class="rondje" type="button" aria-pressed="false">' + RONDJE.plus + '</button>';
      rij.querySelector('.naam > span').textContent = a.naam;
      rij.querySelector('.rondje').setAttribute('aria-label', a.naam + ' weer op de lijst zetten');
      sec.querySelector('.lijst').appendChild(rij);
    }
    l.after(sec);
  }
}

/* Eén luisteraar voor alle rondjes in de lijst. */
function lijstKlik(e) {
  const knop = e.target.closest('.rondje');
  if (!knop) return;
  const naam = knop.closest('.item').dataset.naam;
  const a = artikelen.find((x) => x.naam === naam);
  if (!a) return;
  const t = tijdstipTekst(new Date());
  if (a.op) {
    if (scherm.filter === 'L' && normNaam(scherm.zoek) === '') {
      /* Even grijs op zijn plek, dan naar "Van de lijst gehaald". */
      const timer = setTimeout(() => {
        scherm.vertrekt.delete(naam);
        scherm.weggehaald.set(naam, true);
        tekenBoodschappen();
      }, VERTRAGING);
      scherm.vertrekt.set(naam, { timer });
    }
    handelen([{ actie: 'zet', soort: 'artikel', naam, veld: 'op', oud: a.op, nieuw: '' },
              { actie: 'zet', soort: 'artikel', naam, veld: 'opdoor', oud: a.opdoor, nieuw: '' }]);
  } else {
    const v = scherm.vertrekt.get(naam);
    if (v) clearTimeout(v.timer);
    scherm.vertrekt.delete(naam);
    scherm.weggehaald.delete(naam);
    handelen([{ actie: 'zet', soort: 'artikel', naam, veld: 'op', oud: '', nieuw: t },
              { actie: 'zet', soort: 'artikel', naam, veld: 'opdoor', oud: a.opdoor, nieuw: ik }]);
  }
}
$('lijst').addEventListener('click', lijstKlik);
$('midden').addEventListener('click', (e) => { if (e.target.closest('#weggehaald')) lijstKlik(e); });

function toevoegen() {
  const naam = schoonTekst($('invoerTekst').value);
  if (!naam) { $('invoerTekst').focus(); return; }
  const bestaand = artikelen.find((a) => a.sleutel === normNaam(naam));
  const t = tijdstipTekst(new Date());
  if (bestaand) {
    if (!bestaand.op) {
      handelen([{ actie: 'zet', soort: 'artikel', naam: bestaand.naam, veld: 'op', oud: '', nieuw: t },
                { actie: 'zet', soort: 'artikel', naam: bestaand.naam, veld: 'opdoor', oud: bestaand.opdoor, nieuw: ik }]);
    }
  } else {
    handelen([{ actie: 'nieuw', soort: 'artikel', naam, velden: { soort: LETTER_SOORT[scherm.nieuwSoort], op: t, opdoor: ik } }]);
  }
  $('invoerTekst').value = '';
  scherm.zoek = '';
  scherm.nieuwSoort = 'E';
  tekenSoortknop();
  tekenBoodschappen();
}

$('invoerSoort').addEventListener('click', () => soortMenu($('soortMenu').hidden));
$('invoerPlus').addEventListener('click', toevoegen);
$('invoerTekst').addEventListener('input', () => { scherm.zoek = $('invoerTekst').value; weggehaaldLegen(); tekenBoodschappen(); });
$('invoerTekst').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); toevoegen(); } });
/* De tabbalk gaat alleen weg zolang het toetsenbord echt open is. Op Android
   sluit je het toetsenbord vaak met terug; het vak houdt dan de focus, dus
   focus alleen is geen goed teken. Het zichtbare deel van het scherm wel. */
const volleHoogte = { h: window.innerHeight };
function typenBijwerken() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk'))) volleHoogte.h = Math.max(volleHoogte.h, h);
  const actief = document.activeElement && document.activeElement.closest && document.activeElement.closest('.onderbalk');
  const open = !!actief && h < volleHoogte.h * 0.8;
  document.body.classList.toggle('typen', open);
}
for (const id of ['invoerTekst', 'winkelsTekst']) {
  $(id).addEventListener('focus', () => setTimeout(typenBijwerken, 300));
  $(id).addEventListener('blur', () => setTimeout(typenBijwerken, 150));
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', typenBijwerken);
window.addEventListener('resize', typenBijwerken);

/* Verversen: elke paar minuten zolang de app in beeld is, en bij terugkomen of weer online. */
setInterval(() => { if (!document.hidden) planSync(0); }, VERVERS_GEWOON);
document.addEventListener('visibilitychange', () => { if (!document.hidden) planSync(300); });
window.addEventListener('online', () => planSync(300));
window.addEventListener('offline', () => { sync.offline = true; tekenWolk(); });

async function gegevensLaden() {
  kopie = await kvGet('kopie');
  /* Een kopie van een ander bestand (het oude thuis.txt) telt niet. */
  if (kopie && kopie.bestand !== BESTAND) { kopie = null; wachtrij = []; await kvDel('kopie'); await kvSet('wachtrij', []); }
  wachtrij = (await kvGet('wachtrij')) || [];
  const auth = await kvGet('auth');
  ik = ((auth && auth.naam) || '').split(' ')[0];
  bouwModel();
  tekenSoortknop();
  tekenBoodschappen();
}

/* ---------- keuzelijst van onderen (winkel, afdeling) ---------- */
/* opt: { titel, secties: [{ uitleg?, titel?, ingeklapt?, opties: [{ naam, sub?, aantal?, actief? }] }],
   kies(naam), zoek?: { placeholder, extra: [namen], nieuw(naam) } }.
   Kruisje rechtsboven; "Zoeken of toevoegen" onderaan. Tijdens het typen één
   lijst met alles wat past, uit alle secties. */
const KRUIS = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
const PIJL_RECHTS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>';
function keuzeLijst(opt) {
  sluitKeuze();
  const k = document.createElement('div');
  k.id = 'keuze';
  k.setAttribute('role', 'dialog');
  k.setAttribute('aria-modal', 'true');
  k.setAttribute('aria-label', opt.titel);
  k.innerHTML = '<div class="paneel"><div class="kop"><h3></h3><button class="kruis" type="button" aria-label="Sluiten">' + KRUIS + '</button></div>' +
    '<div class="opties"></div>' +
    (opt.zoek ? '<div class="zoek"><label for="keuzeZoek">Zoeken of toevoegen</label>' +
    '<div class="zoekbalk"><input id="keuzeZoek" type="text" autocomplete="off" enterkeyhint="done">' +
    '<button class="plusknop" type="button" aria-label="Toevoegen">' +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div></div>' : '') + '</div>';
  k.querySelector('h3').textContent = opt.titel;
  const inp = k.querySelector('input');
  if (inp) inp.placeholder = opt.zoek.placeholder;
  const opties = k.querySelector('.opties');
  const open = opt.secties.map((s) => !s.ingeklapt);
  const alleNamen = () => {
    const gezien = new Set(), uit = [];
    for (const s of opt.secties) for (const o of s.opties) if (!gezien.has(normNaam(o.naam))) { gezien.add(normNaam(o.naam)); uit.push(o); }
    for (const n of (opt.zoek && opt.zoek.extra) || []) if (!gezien.has(normNaam(n))) { gezien.add(normNaam(n)); uit.push({ naam: n }); }
    return uit;
  };
  const optieKnop = (o) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'optie' + (o.actief ? ' actief' : '');
    b.innerHTML = '<span class="nm"></span>' + (o.aantal ? '<span class="tal"></span>' : '');
    b.querySelector('.nm').textContent = o.naam;
    if (o.sub) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = o.sub; b.querySelector('.nm').appendChild(s); }
    if (o.aantal) b.querySelector('.tal').textContent = o.aantal;
    if (o.actief) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => { sluitKeuze(); opt.kies(o.naam); });
    return b;
  };
  const teken = () => {
    const t = inp ? zoekVorm(inp.value) : '';
    opties.innerHTML = '';
    if (t) {
      const zicht = alleNamen().filter((o) => zoekVorm(o.naam).indexOf(t) !== -1);
      for (const o of zicht) opties.appendChild(optieKnop(o));
      if (!zicht.length) {
        const p = document.createElement('div'); p.className = 'leeg';
        p.textContent = 'Niets gevonden';
        opties.appendChild(p);
      }
      return;
    }
    opt.secties.forEach((s, i) => {
      if (s.titel) {
        const kb = document.createElement('button');
        kb.type = 'button'; kb.className = 'uitklapper';
        kb.setAttribute('aria-expanded', String(open[i]));
        kb.innerHTML = '<span></span>' + PIJL_RECHTS;
        kb.querySelector('span').textContent = s.titel;
        kb.querySelector('svg').style.transform = 'rotate(' + (open[i] ? 90 : 0) + 'deg)';
        kb.addEventListener('click', () => { open[i] = !open[i]; teken(); });
        opties.appendChild(kb);
      }
      if (s.uitleg) { const u = document.createElement('div'); u.className = 'uitleg'; u.textContent = s.uitleg; opties.appendChild(u); }
      if (open[i]) for (const o of s.opties) opties.appendChild(optieKnop(o));
    });
    if (!opties.children.length) {
      const p = document.createElement('div'); p.className = 'leeg';
      p.textContent = 'Nog niets';
      opties.appendChild(p);
    }
  };
  const toevoegenNu = () => {
    const v = schoonTekst(inp.value);
    if (!v) { inp.focus(); return; }
    const bestaand = alleNamen().find((o) => normNaam(o.naam) === normNaam(v));
    sluitKeuze();
    if (bestaand) opt.kies(bestaand.naam); else opt.zoek.nieuw(v);
  };
  if (inp) {
    inp.addEventListener('input', teken);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); toevoegenNu(); } });
    k.querySelector('.plusknop').addEventListener('click', toevoegenNu);
  }
  k.querySelector('.kruis').addEventListener('click', sluitKeuze);
  k.addEventListener('click', (e) => { if (e.target === k) sluitKeuze(); });
  teken();
  document.body.appendChild(k);
}
function sluitKeuze() { const k = $('keuze'); if (k) k.remove(); }

/* ---------- tabblad Winkel (stap 7) ---------- */
/* Na afvinken blijft een regel even staan, zodat een mis-tik meteen terug te
   tikken is; daarna schuift hij naar "In het mandje" (winkel) of "Van de lijst
   gehaald" (boodschappen). Het mandje hoort bij deze telefoon, blijft bewaard
   en wordt alleen leeggemaakt met de knop. */
const VERTRAGING = 1500;
const VERVERS_WINKEL = 30 * 1000;
const winkel = { naam: '', mandje: new Map(), vertraagd: new Map(), eldersOpen: false };

function winkelOpen() { return !$('scherm-winkel').hidden; }

function huidigeWinkel() {
  return winkelLijst(model).find((w) => normNaam(w.naam) === normNaam(winkel.naam)) || null;
}

async function winkelLaden() {
  winkel.naam = (await kvGet('winkel')) || '';
  ws.favorieten = (await kvGet('favorieten')) || [];
  const m = (await kvGet('mandje')) || [];
  winkel.mandje = new Map(m.map((x) => [x.naam, x]));
}
function mandjeBewaren() {
  kvSet('mandje', Array.from(winkel.mandje.values()));
}

/* Een winkelnaam mag geen : bevatten (dat scheidt winkel en afdeling in ligt=). */
function winkelNaamSchoon(s) { return schoonTekst(String(s).replace(/:/g, ' ')); }

function winkelKiezen() {
  const wl = zichtbareWinkels();
  const tel = winkelTellingen(artikelen, wl);
  const laatst = normNaam(winkel.naam);
  /* Bij een gelijk aantal staat de laatst gekozen winkel bovenaan. */
  tel.sort((x, y) => y.aantal - x.aantal || (normNaam(y.naam) === laatst) - (normNaam(x.naam) === laatst) || SORTEER.compare(x.naam, y.naam));
  keuzeLijst({
    titel: 'Waar ga je heen?',
    secties: [
      { opties: tel.map((x) => ({ naam: x.naam, aantal: x.aantal, actief: normNaam(x.naam) === laatst,
          sub: normNaam(x.naam) === laatst ? 'laatst gekozen' : x.aantal <= 2 ? x.artikelen.join(', ') : '' })) },
      { titel: 'Alle winkels · ' + wl.length, ingeklapt: tel.length > 0,
        opties: wl.map((w) => ({ naam: w.naam, actief: normNaam(w.naam) === laatst })) }
    ],
    kies: (naam) => kiesWinkel(naam),
    zoek: { placeholder: 'Winkel', extra: [], nieuw: (v) => {
      const naam = winkelNaamSchoon(v);
      handelen([{ actie: 'nieuw', soort: 'winkel', naam, velden: {} }]);
      kiesWinkel(naam);
    } }
  });
}
function kiesWinkel(naam) {
  winkel.naam = naam;
  kvSet('winkel', naam);
  tekenWinkel();
}

/* Waar ligt dit, in déze winkel? Kiezen legt vast: te koop hier, en in die
   afdeling. Of: niet te koop hier. */
function waarLigtDit(a) {
  if (!winkel.naam) { winkelKiezen(); return; }
  const w = huidigeWinkel();
  const route = w ? w.route : [];
  const kies = (afd) => {
    const hs = [{ actie: 'plaats', soort: 'artikel', naam: a.naam, winkel: winkel.naam, afd }];
    if (!route.some((r) => normNaam(r) === normNaam(afd))) hs.push({ actie: 'lijstErbij', soort: 'winkel', naam: winkel.naam, veld: 'route', waarde: afd });
    handelen(hs);
  };
  keuzeLijst({
    titel: 'Waar ligt ' + a.naam + ' bij ' + winkel.naam + '?',
    secties: [{ opties: route.map((x) => ({ naam: x })) }],
    kies,
    zoek: { placeholder: 'Afdeling', extra: [], nieuw: kies }
  });
}

function afvinken(a) {
  const datum = datumTekst(new Date());
  const al = a.gekocht.indexOf(datum) !== -1;
  winkel.mandje.set(a.naam, { naam: a.naam, op: a.op, opdoor: a.opdoor, datum, alGekocht: al });
  mandjeBewaren();
  const hs = [{ actie: 'zet', soort: 'artikel', naam: a.naam, veld: 'op', oud: a.op, nieuw: '' },
              { actie: 'zet', soort: 'artikel', naam: a.naam, veld: 'opdoor', oud: a.opdoor, nieuw: '' }];
  if (!al) hs.push({ actie: 'gekocht', soort: 'artikel', naam: a.naam, datum });
  winkel.vertraagd.set(a.naam, setTimeout(() => { winkel.vertraagd.delete(a.naam); if (winkelOpen()) tekenWinkel(); }, VERTRAGING));
  handelen(hs);
}

function terugOpLijst(naam) {
  const m = winkel.mandje.get(naam);
  if (!m) return;
  clearTimeout(winkel.vertraagd.get(naam));
  winkel.vertraagd.delete(naam);
  winkel.mandje.delete(naam);
  mandjeBewaren();
  const hs = [{ actie: 'zet', soort: 'artikel', naam, veld: 'op', oud: '', nieuw: m.op || tijdstipTekst(new Date()) },
              { actie: 'zet', soort: 'artikel', naam, veld: 'opdoor', oud: '', nieuw: m.opdoor }];
  if (!m.alGekocht) hs.push({ actie: 'nietGekocht', soort: 'artikel', naam, datum: m.datum });
  handelen(hs);
}

function mandjeLeegmaken() {
  for (const n of Array.from(winkel.mandje.keys())) if (!winkel.vertraagd.has(n)) winkel.mandje.delete(n);
  mandjeBewaren();
  tekenWinkel();
}

/* Eén definitie voor alle rondjes: 28 px; het gevulde rondje is even groot als
   de buitenkant van het open rondje (lijn meegerekend). Ze krimpen nooit. */
const RONDJE = {
  aan: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13.5" fill="#4B3CC0"></circle><path d="M8.8 14.4l3.4 3.4 7-7.6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
  plus: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#4B3CC0" stroke-width="2.2"></circle><path d="M14 9v10M9 14h10" fill="none" stroke="#4B3CC0" stroke-width="2.2" stroke-linecap="round"></path></svg>',
  leeg: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#4B3CC0" stroke-width="2.2"></circle></svg>',
  elders: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.4" fill="none" stroke="#9A93C9" stroke-width="2.2"></circle></svg>',
  gedaan: '<svg class="rondsvg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13.5" fill="#14B3BF"></circle><path d="M8.8 14.4l3.4 3.4 7-7.6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
};
const SPELD = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4B3CC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"></path><path d="M10.3 8.4a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.3"></path><path d="M12 13.6h.01"></path></svg>';
const MANDJE_WEG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A4A05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.6 9.2a1 1 0 0 1-1 .8H6.6a1 1 0 0 1-1-.8z"></path><path d="M8 10l4-6 4 6"></path><path d="M10 13.5l4 4M14 13.5l-4 4"></path></svg>';

function winkelRij(a, soort) {
  const rij = document.createElement('div');
  const gedaan = soort === 'gedaan';
  rij.className = 'wrij' + (gedaan ? ' gedaan' : '');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'vink';
  b.setAttribute('aria-pressed', String(gedaan));
  b.innerHTML = (gedaan ? RONDJE.gedaan : soort === 'elders' ? RONDJE.elders : RONDJE.leeg) + '<span class="nm"></span>';
  b.querySelector('.nm').textContent = a.naam;
  b.setAttribute('aria-label', gedaan ? a.naam + ', in het mandje; terugzetten' : a.naam + ' afvinken');
  if (!gedaan && a.opdoor && a.opdoor !== ik && Date.now() - Date.parse(a.op) < 15 * 60000) {
    const n = document.createElement('span'); n.className = 'nieuw'; n.textContent = 'nieuw';
    n.style.cssText = 'padding:1px 7px;background:#DDF1F2;color:#0A6570;font-size:17px;font-weight:600;flex-shrink:0';
    b.appendChild(n);
  }
  b.addEventListener('click', () => gedaan ? terugOpLijst(a.naam) : afvinken(a));
  rij.appendChild(b);
  if (soort === 'boven') {
    const w = document.createElement('button');
    w.type = 'button'; w.className = 'icoonknop waar';
    w.setAttribute('aria-label', 'Waar ligt ' + a.naam + '? Afdeling kiezen');
    w.innerHTML = SPELD;
    w.addEventListener('click', () => waarLigtDit(a));
    rij.appendChild(w);
  }
  if (soort === 'elders') {

}

function tekenWinkel() {
  if (!model || !winkelOpen()) return;
  const w = huidigeWinkel();
  $('winkelNaam').textContent = winkel.naam || 'Winkel kiezen';
  const weergave = artikelen.map((a) => {
    const m = winkel.vertraagd.has(a.naam) && winkel.mandje.get(a.naam);
    return m ? Object.assign({}, a, { op: m.op || 'x', opdoor: m.opdoor }) : a;
  });
  const ind = winkelIndeling(weergave, w);
  const doel = $('winkelLijst');
  doel.innerHTML = '';
  const soortVan = (a) => winkel.vertraagd.has(a.naam) ? 'gedaan' : null;
  const sectie = (titel, grijs, rechts) => {
    const sec = document.createElement('section'); sec.className = 'afd' + (grijs ? ' grijs' : '');
    if (titel !== null) {
      const kop = document.createElement('div'); kop.className = 'afdkop';
      if (typeof titel === 'string') { const s = document.createElement('span'); s.textContent = titel; kop.appendChild(s); }
      else kop.appendChild(titel);
      if (rechts) kop.appendChild(rechts);
      sec.appendChild(kop);
    }
    doel.appendChild(sec);
    return sec;
  };
  if (ind.boven.length) {
    const sec = sectie(null);
    for (const a of ind.boven) sec.appendChild(winkelRij(a, soortVan(a) || 'boven'));
  }
  for (const g of ind.groepen) {
    const sec = sectie(g.afd);
    for (const a of g.items) sec.appendChild(winkelRij(a, soortVan(a) || 'gewoon'));
  }
  if (ind.elders.length) {
    const kop = document.createElement('button');
    kop.type = 'button'; kop.className = 'uitklap';
    kop.setAttribute('aria-expanded', String(winkel.eldersOpen));
    kop.innerHTML = '<span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(' + (winkel.eldersOpen ? 90 : 0) + 'deg)"><path d="M9 5l7 7-7 7"></path></svg>';
    kop.querySelector('span').textContent = 'Niet bij ' + winkel.naam + ' · ' + ind.elders.length;
    kop.addEventListener('click', () => { winkel.eldersOpen = !winkel.eldersOpen; tekenWinkel(); });
    const sec = sectie(kop, true);
    if (winkel.eldersOpen) for (const a of ind.elders) sec.appendChild(winkelRij(a, soortVan(a) || 'elders'));
  }
  const inMandje = Array.from(winkel.mandje.keys()).filter((n) => !winkel.vertraagd.has(n));
  if (inMandje.length) {
    const leeg = document.createElement('button');
    leeg.type = 'button'; leeg.className = 'icoonknop amber';
    leeg.setAttribute('aria-label', 'Mandje leegmaken');
    leeg.innerHTML = MANDJE_WEG;
    leeg.addEventListener('click', mandjeLeegmaken);
    const sec = sectie('In het mandje · ' + inMandje.length, true, leeg);
    for (const n of inMandje) sec.appendChild(winkelRij({ naam: n, plekken: [] }, 'gedaan'));
  }
  const open = ind.boven.length + ind.groepen.reduce((s, g) => s + g.items.length, 0) + ind.elders.length;
  const klaarAantal = winkel.mandje.size;
  const totaal = open - winkel.vertraagd.size + klaarAantal;
  $('winkelTeller').textContent = klaarAantal + ' van ' + totaal;
  $('winkelVoortgang').style.width = (totaal ? Math.round(100 * klaarAantal / totaal) : 0) + '%';
  if (!gekoppeld) {
    doel.innerHTML = '<div class="kaart leeg"><b>Nog niet gekoppeld</b><span>Meld je eerst aan en koppel de gedeelde map, bij Instellingen.</span></div>';
  } else if (!open && !inMandje.length) {
    const p = document.createElement('div');
    p.className = 'kaart leeg';
    p.textContent = 'Geen artikelen';
    doel.appendChild(p);
  }
}

/* Verslepen aan de greep: de regel volgt de vinger, de andere schuiven opzij;
   bij loslaten één handeling met de nieuwe volgorde. */
function slepenAan(lijstEl, w) {
  lijstEl.addEventListener('pointerdown', (e) => {
    const greep = e.target.closest('.greep');
    if (!greep) return;
    e.preventDefault();
    const rij = greep.closest('.arij');
    const rijen = Array.from(lijstEl.querySelectorAll('.arij'));
    const van = rijen.indexOf(rij);
    const hoogte = rij.getBoundingClientRect().height || 56;
    const y0 = e.clientY;
    let naar = van;
    greep.setPointerCapture && greep.setPointerCapture(e.pointerId);
    rij.classList.add('sleept');
    const beweeg = (ev) => {
      const dy = ev.clientY - y0;
      naar = Math.max(0, Math.min(rijen.length - 1, van + Math.round(dy / hoogte)));
      rij.style.transform = 'translateY(' + dy + 'px)';
      rijen.forEach((r, i) => {
        if (r === rij) return;
        const schuif = van < naar && i > van && i <= naar ? -hoogte : van > naar && i >= naar && i < van ? hoogte : 0;
        r.style.transform = schuif ? 'translateY(' + schuif + 'px)' : '';
      });
    };
    const los = () => {
      greep.removeEventListener('pointermove', beweeg);
      greep.removeEventListener('pointerup', los);
      greep.removeEventListener('pointercancel', los);
      rijen.forEach((r) => { r.style.transform = ''; });
      rij.classList.remove('sleept');
      if (naar !== van) {
        const volgorde = rijen.map((r) => r.dataset.afd);
        volgorde.splice(naar, 0, volgorde.splice(van, 1)[0]);
        handelen([{ actie: 'volgorde', soort: 'winkel', naam: w.naam, volgorde }]);
      }
    };
    greep.addEventListener('pointermove', beweeg);
    greep.addEventListener('pointerup', los);
    greep.addEventListener('pointercancel', los);
  });
}

function winkelOpenen(naam) {
  ws.open = naam;

function winkelSluiten() {
  if (history.state && history.state.thuisWinkel) { history.back(); return; }

  $('winkelsTekst').value = '';

}
window.addEventListener('popstate', () => {

function winkelBewerken(w) {
  bewerkPaneel({
    titel: 'Winkel bewerken', naam: w.naam, wegLabel: 'Winkel verwijderen', schoon: winkelNaamSchoon,
    opslaan: async (nieuw) => {
      if (zichtbareWinkels().some((x) => x !== w && normNaam(x.naam) === normNaam(nieuw))) {
        melding('m-naam', ['Er is al een winkel ', { vet: nieuw }, '.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-naam') }]);
        return;
      }
      if (isFavoriet(w.naam)) {
        ws.favorieten = ws.favorieten.map((f) => normNaam(f) === normNaam(w.naam) ? nieuw : f);
        kvSet('favorieten', ws.favorieten);
      }
      if (normNaam(winkel.naam) === normNaam(w.naam)) { winkel.naam = nieuw; kvSet('winkel', nieuw); }
      ws.open = nieuw;
      if (history.state && history.state.thuisWinkel) try { history.replaceState({ thuisWinkel: nieuw }, ''); } catch (e) { /* niet erg */ }
      handelen([{ actie: 'hernoem', soort: 'winkel', naam: w.naam, nieuw }]);
    },
    verwijder: () => {
      winkelSluiten();
      uitgesteld('winkel:' + normNaam(w.naam), [{ vet: w.naam }, ' verwijderd.'], () => handelen([{ actie: 'weg', soort: 'winkel', naam: w.naam }]));

function afdelingBewerken(w, afd) {

    titel: 'Afdeling bewerken', naam: afd, wegLabel: 'Afdeling verwijderen', schoon: schoonTekst,

        melding('m-naam', [{ vet: w.naam }, ' heeft al een afdeling ', { vet: nieuw }, '.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-naam') }]);
        return;
      }

function winkelsToevoegen() {
  const inp = $('winkelsTekst');
  const w = openWinkel();
  if (w) {
    const v = schoonTekst(inp.value);
    if (!v) { inp.focus(); return; }
    inp.value = '';
    if (!w.route.some((x) => normNaam(x) === normNaam(v))) handelen([{ actie: 'lijstErbij', soort: 'winkel', naam: w.naam, veld: 'route', waarde: v }]);
    else tekenWinkels();
    return;
  }
  const v = winkelNaamSchoon(inp.value);
  if (!v) { inp.focus(); return; }
  inp.value = '';
  inp.blur();
  const bestaand = zichtbareWinkels().find((x) => normNaam(x.naam) === normNaam(v));
  if (!bestaand) handelen([{ actie: 'nieuw', soort: 'winkel', naam: v, velden: {} }]);
  winkelOpenen(bestaand ? bestaand.naam : v);
}

/* ---------- vegen tussen de tabbladen (rondom) ---------- */
/* Niet vanaf de rand (daar zit het terug-gebaar van Android), niet tijdens typen,
   niet als er een menu of keuzelijst open is, en alleen bij een duidelijk
   horizontale beweging. */
const TABS = ['winkels', 'boodschappen', 'winkel', 'doen', 'instellingen'];
const veeg = { x: 0, y: 0, actief: false };
$('midden').addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  veeg.actief = e.touches.length === 1 && !(e.target.closest && e.target.closest('.greep')) && t.clientX > 24 && t.clientX < window.innerWidth - 24 &&
    !$('keuze') && $('soortMenu').hidden && !document.body.classList.contains('typen');
  veeg.x = t.clientX; veeg.y = t.clientY;
}, { passive: true });
$('midden').addEventListener('touchend', (e) => {
  if (!veeg.actief) return;
  veeg.actief = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - veeg.x, dy = t.clientY - veeg.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const nu = TABS.findIndex((n) => !$('scherm-' + n).hidden);
  toonScherm(TABS[(nu + (dx < 0 ? 1 : -1) + TABS.length) % TABS.length]);
}, { passive: true });

/* De browser mag opslag bij ruimtegebrek wissen; vastzetten voorkomt dat, zodat
   een wachtrij die nog niet in OneDrive staat niet verloren gaat. Lukt het niet,
   dan is dat geen fout: alleen het woord "nee", in oranje (gedeelde conventie). */
async function opslagVastzetten() {
  let vast = false;
  try {
    if (navigator.storage && navigator.storage.persist) {
      vast = await navigator.storage.persisted() || await navigator.storage.persist();
    }
  } catch (e) { vast = false; }
  $('appOpslag').textContent = vast ? 'ja' : 'nee';
  $('appOpslag').style.color = vast ? '' : '#A84A0A';
}

/* ---------- start ---------- */
(async () => {
  try {
    await gegevensLaden();
    await winkelLaden();
    opslagVastzetten();
    await terugVanMicrosoft();
    await aanmeldingOpTijd();
    await toonStatus();
    planSync(0);
    const auth = await kvGet('auth');
    if (auth && auth.refresh) wieBenIk();
  } catch (e) {
    melding('m-start', 'De app kon zijn gegevens in de browser niet openen (' + (e.message || e) + ').', []);
  }
})();
</script>

function winkelBewerken(w) {
  bewerkPaneel({
    titel: 'Winkel bewerken', naam: w.naam, wegLabel: 'Winkel verwijderen',
    metNotitie: true, notitie: w.notitie, link: w.link,
    opslaan: (nieuw, extra) => {
      const nn = normNaam(nieuw); // één keer, niet per element (L1, performance)
      if (nieuw !== w.naam && winkels.some((x) => x.id !== w.id && normNaam(x.naam) === nn)) {
        return 'Er is al een winkel ' + nieuw + '.';
      }
      const r = model.winkels.get(w.id);
      if (!r) {
        /* Intussen verwijderd door de ander: niet stil, net als bij artikel en actie (M8). */
        sluitKeuze(); winkelSluiten();
        const record = { naam: nieuw, afdelingen: w.afdelingen.map((x) => ({ id: x.id, naam: x.naam })) };
        if (extra.notitie) record.notitie = extra.notitie;
        if (extra.link) record.link = extra.link;
        weerTerugMelding(w.id, 'winkel', record);
        return;
      }
      const h = [];
      if (nieuw !== w.naam) h.push({ actie: 'zet', soort: 'winkel', id: w.id, veld: 'naam', oud: w.naam, nieuw });
      /* Tegen de stand bij het openen (w), niet tegen nu (M1, ronde 4). */
      for (const veld of ['notitie', 'link']) if (extra[veld] !== (w[veld] || '')) h.push({ actie: 'zet', soort: 'winkel', id: w.id, veld, oud: w[veld] || '', nieuw: extra[veld] });
      if (h.length) handelen(h);
    },
    verwijder: () => {
      if (!model.winkels.get(w.id)) { winkelSluiten(); return; } // intussen al verwijderd
      /* Wat terug moet bij Ongedaan maken: de winkel zelf en de plekken. */
      const record = recordNaarJson('winkel', model.winkels.get(w.id));
      const ligt = {};
      for (const a of model.artikelen.values()) if (a.ligt.has(w.id)) ligt[a.id] = a.ligt.get(w.id);
      const weg = () => {
        winkelSluiten();
        handelen([{ actie: 'weg', soort: 'winkel', id: w.id }]);
        verwijderdMelding([{ vet: w.naam }, ' verwijderd.'], [{ actie: 'terug', soort: 'winkel', id: w.id, record, ligt }]);
      };
      const n = Object.keys(ligt).length;
      if (!n) { weg(); return; }
      /* Liggen er artikelen: eerst bevestigen, met het aantal (K14). */
      const k = keuzePaneel([{ vet: w.naam }, ' verwijderen?'], false);
      k.querySelector('.opties').outerHTML = '<p class="paneeltekst"></p><div class="bewerkknoppen" style="padding:10px 14px 14px"><button class="knop tweede grijs" type="button">Annuleren</button><button class="knop rood" type="button">Verwijderen</button></div>';
      k.querySelector('.paneeltekst').textContent = telTekst(n, 'artikel ligt', 'artikelen liggen') + ' hier.';
      const [nee, ja] = k.querySelectorAll('.bewerkknoppen .knop');
      nee.addEventListener('click', sluitKeuze);
      ja.addEventListener('click', () => { sluitKeuze(); weg(); });
      keuzeTonen(k);
    }
  });
}

function afdelingBewerken(w, afd) {
  bewerkPaneel({
    titel: 'Afdeling bewerken', naam: afd.naam, wegLabel: 'Afdeling verwijderen',
    opslaan: (nieuw) => {
      const nn = normNaam(nieuw); // één keer, niet per element (L1, performance)
      if (w.afdelingen.some((x) => x.id !== afd.id && normNaam(x.naam) === nn)) {
        return w.naam + ' heeft al een afdeling ' + nieuw + '.';
      }
      handelen([{ actie: 'afdHernoem', soort: 'winkel', id: w.id, afd: afd.id, naam: nieuw }]);
    },
    verwijder: () => {
      const plaats = w.afdelingen.findIndex((x) => x.id === afd.id);
      const daar = [];
      for (const a of model.artikelen.values()) if (a.ligt.get(w.id) === afd.id) daar.push(a.id);
      handelen([{ actie: 'afdWeg', soort: 'winkel', id: w.id, afd: afd.id }]);
      verwijderdMelding([{ vet: afd.naam }, ' verwijderd bij ', { vet: w.naam }, '.'],
        [{ actie: 'terug', soort: 'afdeling', winkel: w.id, afd: { id: afd.id, naam: afd.naam }, plaats, artikelen: daar }]);
    }
  });
}

function winkelsToevoegen() {
  const inp = $('winkelsTekst');
  const w = winkelOpId.get(ws.open);
  const v = schoonTekst(inp.value);

  if (v[0] === '#') { inp.blur(); return; }
  vakLeeg(inp);
  if (w) {
    const nn = normNaam(v); // één keer, niet per element (L1, performance)
    if (!w.afdelingen.some((x) => normNaam(x.naam) === nn)) handelen([{ actie: 'afdErbij', soort: 'winkel', id: w.id, afd: { id: nieuweId(), naam: v } }]);
    else tekenWinkels();
    return;
  }
  inp.blur();
  const nn = normNaam(v); // één keer, niet per element (L1, performance)
  const bestaand = winkels.find((x) => normNaam(x.naam) === nn);
  const id = bestaand ? bestaand.id : nieuweId();
  if (!bestaand) handelen([{ actie: 'nieuw', soort: 'winkel', id, velden: { naam: v } }]);
  winkelOpenen(id);
}

/* Een kladversie: pas bij Opslaan worden het handelingen. Nieuwe winkels en
   afdelingen die je hier maakt, bestaan meteen (ook als je daarna weggooit). */
const bw = { id: '', oud: null, naam: '', notitie: '', link: '', soort: 'E', plekken: new Map(), sluiten: false };
function bwGewijzigd() {
  const o = bw.oud;
  if (!o) return false;
  /* Alleen winkels die nog bestaan (verwijdert de ander er een, dan is dat geen wijziging van jou) (K4). */
  const oudPlek = o.plekken.filter((p) => winkelOpId.has(p.winkel));
  if (schoonTekst(bw.naam) !== o.naam || schoonTekst(bw.notitie) !== o.notitie || bw.link.trim() !== o.link || bw.soort !== o.letter || bw.plekken.size !== oudPlek.length) return true;
  return oudPlek.some((p) => bw.plekken.get(p.winkel) !== p.afd);
}

  /* Naam en notitie: één regel tekst die doorloopt; Enter sluit het toetsenbord. */
  tagKeuze('artikelNotitie', alleNotities, true);
  const vakken = [[$('artikelNaam'), 'naam'], [$('artikelNotitie'), 'notitie']];
  const hoogte = () => { for (const [v] of vakken) { v.style.height = 'auto'; v.style.height = v.scrollHeight + 4 + 'px'; } };
  for (const [v, veld] of vakken) {

/* Te koop bij en Gekocht; ook na een synchronisatie (namen kunnen veranderd zijn). */
/* De editor stond open op een artikel of actie dat bij de sync samenviel met een
   bestaand (allebei "Melk" toegevoegd): verder op het bestaande. Wat je niet
   veranderde, neemt de waarde van het bestaande over; wat je wel veranderde,
   blijft staan (M8). */
function herbasis(klad, oud, nieuw, velden) {
  for (const [k, o] of velden) if (klad[k] === oud[o]) klad[k] = nieuw[o];
  klad.oud = nieuw;
}
function artikelBijwerken() {
  const a = artikelen.find((x) => x.id === bw.id);
  if (a && bw.oud && bw.oud.id !== a.id) {
    const oudePlekken = new Map(bw.oud.plekken.map((p) => [p.winkel, p.afd]));
    const plekkenGelijk = bw.plekken.size === oudePlekken.size && Array.from(bw.plekken).every(([w, d]) => oudePlekken.get(w) === d);
    herbasis(bw, bw.oud, a, [['naam', 'naam'], ['notitie', 'notitie'], ['link', 'link'], ['soort', 'letter']]);
    if (plekkenGelijk) bw.plekken = new Map(a.plekken.map((p) => [p.winkel, p.afd]));
    if ($('artikelNaam')) { $('artikelNaam').value = bw.naam; }
    if ($('artikelNotitie')) { $('artikelNotitie').value = bw.notitie; }
    if ($('artikelLink')) { $('artikelLink').value = bw.link; }
  }
  if (!a) {
    /* Intussen verwijderd (door de ander of het archief): niet stil sluiten (K12). */
    const o = bw.oud;
    const ligt = {};
    for (const [w, afd] of bw.plekken) if (winkelOpId.has(w)) ligt[w] = afd;
    const link = bw.link.trim() ? veiligeLink(bw.link) : '';
    const record = { naam: schoonTekst(bw.naam) || o.naam, soort: LETTER_SOORT[bw.soort], notitie: schoonTekst(bw.notitie), link: link || '', ligt, gekocht: o.gekocht.slice() };
    if (o.aantal > 1) record.aantal = String(o.aantal);
    if (o.op) { record.op = o.op; record.opdoor = o.opdoor || ''; }
    artikelDicht(false);
    weerTerugMelding(o.id, 'artikel', record);
    return;
  }
  for (const w of Array.from(bw.plekken.keys())) if (!winkelOpId.has(w)) bw.plekken.delete(w);
  const doel = $('plekken');
  doel.innerHTML = '';
  const rijen = winkels.filter((w) => bw.plekken.has(w.id));
  $('plekTal').textContent = rijen.length ? telTekst(rijen.length, 'winkel', 'winkels') : '';
  for (const w of rijen) {
    const afd = w.afdelingen.find((x) => x.id === bw.plekken.get(w.id));
    const metAfd = w.afdelingen.length > 0;
    const r = document.createElement('div'); r.className = 'plekrij';
    r.innerHTML = (metAfd ? '<button class="winkelrij" type="button"><span class="nm"></span>' + PIJL_IN + '</button>' : '<div class="winkelrij"><span class="nm"></span></div>') +
      '<button class="icoonknop" type="button">' + KRUIS + '</button>';
    r.querySelector('.nm').textContent = w.naam;
    if (metAfd) {
      const s = document.createElement('span'); s.className = 'sub' + (afd ? '' : ' leeg2'); s.textContent = afd ? afd.naam : '—';
      r.querySelector('.nm').appendChild(s);
    }
    r.querySelector('.icoonknop').setAttribute('aria-label', w.naam + ' weghalen');
    if (metAfd) r.querySelector('.winkelrij').addEventListener('click', () => artikelAfdeling(w.id));
    r.querySelector('.icoonknop').addEventListener('click', () => { bw.plekken.delete(w.id); artikelBijwerken(); });
    doel.appendChild(r);
  }
  const plus = document.createElement('button');
  plus.type = 'button'; plus.className = 'toevoegrij';
  plus.innerHTML = RONDJE.plus + '<span>Winkel toevoegen</span>';
  plus.addEventListener('click', artikelWinkelKiezen);
  doel.appendChild(plus);
  $('gekochtRegel').textContent = gekochtTekst(a.gekocht);
}

/* Winkel kiezen of toevoegen, net als in de Winkels-tab; daarna meteen de afdeling. */
function artikelWinkelKiezen() {
  const vrij = winkels.filter((w) => !bw.plekken.has(w.id));
  /* Alleen naar de afdeling vragen als de winkel afdelingen heeft. */
  const kies = (id) => { bw.plekken.set(id, ''); artikelBijwerken(); const w = winkelOpId.get(id); if (w && w.afdelingen.length) artikelAfdeling(id); };
  keuzeLijst({
    titel: ['Te koop bij welke winkel?'],
    secties: winkelSecties(vrij, ''),
    kies,
    zoek: { placeholder: 'Winkel', nieuw: (naam) => {
      const nn = normNaam(naam); // één keer, niet per element (L1, performance)
      const bestaand = winkels.find((w) => normNaam(w.naam) === nn);
      if (bestaand) { kies(bestaand.id); return; }
      const id = nieuweId();
      handelen([{ actie: 'nieuw', soort: 'winkel', id, velden: { naam } }]);
      kies(id);
    } }
  });
}

function artikelAfdeling(winkelId) {
  const w = winkelOpId.get(winkelId);
  if (!w) return;
  const nu = bw.plekken.get(winkelId);
  keuzeLijst({
    titel: ['Waar ligt ', { vet: schoonTekst(bw.naam) || bw.oud.naam }, ' bij ', { vet: w.naam }, '?'],
    secties: [{ opties: w.afdelingen.map((x) => ({ id: x.id, naam: x.naam, actief: x.id === nu })) }],
    kies: (afd) => { bw.plekken.set(winkelId, afd); artikelBijwerken(); },
    zoek: { placeholder: 'Afdeling', nieuw: (naam) => {
      const afd = nieuweId();
      bw.plekken.set(winkelId, afd);
      handelen([{ actie: 'afdErbij', soort: 'winkel', id: winkelId, afd: { id: afd, naam } }]);
    } }
  });
}

/* Opslaan: alleen wat anders is, met de oude waarde erbij (voor botsingen). */
function artikelOpslaan() {
  const o = bw.oud;
  const naam = schoonTekst(bw.naam);
  if (!naam) { $('artikelNaam').focus(); return; }
  if (naam[0] === '#' && naam !== bw.oud.naam) { naamMetHekje(); return; }
  const nn = normNaam(naam); // één keer, niet per element (L1, performance)
  if (naam !== o.naam && artikelen.some((x) => x.id !== o.id && x.sleutel === nn)) {
    melding('m-naam', ['Er is al een artikel ', { vet: naam }, '.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-naam') }]);
    $('midden').scrollTop = 0;
    return;
  }
  const h = [];
  if (naam !== o.naam) h.push({ actie: 'zet', soort: 'artikel', id: o.id, veld: 'naam', oud: o.naam, nieuw: naam });
  const link = bw.link.trim() ? veiligeLink(bw.link) : '';
  if (link === null) {
    melding('m-link', ['Alleen links met ', { vet: 'https://' }, ' zijn toegestaan.'], [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-link') }]);
    $('midden').scrollTop = 0;
    return;
  }
  meldingWeg('m-link');
  if (link !== o.link) h.push({ actie: 'zet', soort: 'artikel', id: o.id, veld: 'link', oud: o.link, nieuw: link });
  const notitie = schoonTekst(bw.notitie);
  if (notitie !== o.notitie) h.push({ actie: 'zet', soort: 'artikel', id: o.id, veld: 'notitie', oud: o.notitie, nieuw: notitie });
  if (bw.soort !== o.letter) h.push({ actie: 'zet', soort: 'artikel', id: o.id, veld: 'soort', oud: LETTER_SOORT[o.letter], nieuw: LETTER_SOORT[bw.soort] });
  for (const p of o.plekken) if (!bw.plekken.has(p.winkel) && winkelOpId.has(p.winkel)) h.push({ actie: 'plaats', soort: 'artikel', id: o.id, winkel: p.winkel, afd: null });
  for (const [winkelId, afd] of bw.plekken) {
    const was = o.plekken.find((p) => p.winkel === winkelId);
    if (!was || was.afd !== afd) h.push({ actie: 'plaats', soort: 'artikel', id: o.id, winkel: winkelId, afd });
  }
  artikelDicht(false);
  if (h.length) handelen(h);
}

/* ---------- tabblad Doen ---------- */
/* Groepen: te laat, deze week, later, zonder periode; vroegste eerst. Afvinken:
   een herhalende actie schuift door naar de volgende keer (met Ongedaan maken),
   een gewone blijft even grijs staan en gaat dan naar "Afgerond". */
const doen = { afgerondOpen: false, vertrekt: new Map(), historie: new Map(), filter: 'week', zoekIn: '' };
const DOEN_NAAM = { week: 'Week', maand: 'Maand', kwartaal: 'Kw.', jaar: 'Jaar', alles: 'Alles' };
const DOEN_LANG = { week: 'Week', maand: 'Maand', kwartaal: 'Kwartaal', jaar: 'Jaar', alles: 'Alles' };
const DOEN_KOP = { week: 'Deze week', maand: 'Deze maand', kwartaal: 'Dit kwartaal', jaar: 'Dit jaar' };
const HERHAAL_TEKST = { week: 'week', maand: 'maand', kwartaal: 'kwartaal', jaar: 'jaar' };
const HERHAAL_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"></path><path d="M20 4v5h-5"></path><path d="M20 12a8 8 0 0 1-14 5.3L4 15"></path><path d="M4 20v-5h5"></path></svg>';
function actieRij(a, vandaag, groep) {
  const rij = document.createElement('div');
  const klaar = !a.open || doen.vertrekt.has(a.id);
  rij.className = 'actierij' + (klaar ? ' afgerond' : '') + (doen.vertrekt.has(a.id) ? ' vertrekt' : '');
  rij.dataset.id = a.id;
  rij.innerHTML = '<button class="rondje" type="button"></button><button class="tekst" type="button"><span class="nm"></span></button>';
  const r = rij.querySelector('.rondje');
  r.innerHTML = klaar ? RONDJE.gedaan : RONDJE.leeg;
  r.setAttribute('aria-label', klaar ? a.naam + ' heropenen' : a.naam + ' afronden');
  rij.querySelector('.nm').textContent = a.naam;
  const tekst = rij.querySelector('.tekst');
  if (!a.open) {
    const w = document.createElement('span'); w.className = 'wanneer';
    w.textContent = 'afgerond ' + periodeTekst(a.klaar.slice(0, 10), vandaag);
    tekst.appendChild(w);
  } else if (a.datum) {
    const w = document.createElement('span'); w.className = 'wanneer' + (groep === 'laat' ? ' laat' : '');
    w.textContent = periodeTekst(a.datum, vandaag);
    if (a.herhaal) { w.appendChild(document.createTextNode(' · ')); const h = document.createElement('span'); h.innerHTML = HERHAAL_IC; w.appendChild(h); w.appendChild(document.createTextNode(HERHAAL_TEKST[a.herhaal])); }
    tekst.appendChild(w);
  }
  if (a.notitie || a.link) tekst.appendChild(notitieRegel(a));
  return rij;
}
/* Actieregels hergebruiken: alleen een regel waarvan iets veranderde, wordt opnieuw gemaakt (H2, performance). */
const actieGeheugen = new Map();
function actieRijUitGeheugen(a, vandaag, groep) {
  const sleutel = [a.naam, a.datum, a.herhaal, a.open, a.klaar, a.notitie, a.link, groep, vandaag, doen.vertrekt.has(a.id)].join('\u0001');
  const g = actieGeheugen.get(a.id);
  if (g && g.sleutel === sleutel) return g.rij;
  const rij = actieRij(a, vandaag, groep);
  actieGeheugen.set(a.id, { sleutel, rij });
  return rij;
}
function doenGroep(doel, titel, lijst, vandaag, groep, extra) {
  const sec = document.createElement('section'); sec.className = 'blok';
  sec.innerHTML = '<div class="kopbalk' + (groep === 'laat' ? ' laat' : '') + '"><h2></h2><span class="tal"></span></div><div class="lijst"></div>';
  sec.querySelector('h2').textContent = titel;
  sec.querySelector('.tal').textContent = telTekst(lijst.length, 'actie', 'acties');
  const lijstEl = sec.querySelector('.lijst');
  for (const a of lijst) lijstEl.appendChild(actieRijUitGeheugen(a, vandaag, groep));
  if (extra) extra(sec);
  doel.appendChild(sec);
}
function tekenDoen() {
  if (!model || $('scherm-doen').hidden || bd.id) return;
  const doel = $('doenLijst');
  doel.innerHTML = '';
  if (actieGeheugen.size > acties.length + 50) actieGeheugen.clear();
  if (!gekoppeld) { $('doenFilters').hidden = true; const p = document.createElement('div'); p.className = 'kaart leegregel'; p.textContent = 'Nog niet gekoppeld'; doel.appendChild(p); return; }
  $('doenFilters').hidden = false;
  const vandaag = datumTekst(new Date());
  const z = zoekVorm($('doenTekst').value);
  if (!z) doen.zoekIn = '';
  const alle = acties.filter((a) => !z || zoekPast(a.naam, a.notitie, $('doenTekst').value));
  const open = alle.filter((a) => a.open || doen.vertrekt.has(a.id))
    .sort((x, y) => (x.begin || '9') < (y.begin || '9') ? -1 : (x.begin || '9') > (y.begin || '9') ? 1 : SORTEER.compare(x.naam, y.naam));
  /* Filters: tijdens zoeken is er geen actief (zoeken gaat in alles); een tik zoekt alleen daarin. */
  const actief = z ? doen.zoekIn : doen.filter;
  tekenDoenFilters(open, vandaag, !!z, actief);
  const zicht = actief ? open.filter((a) => inDoenFilter(a.datum, actief, vandaag)) : open;
  if (actief && actief !== 'alles') {
    const laat = zicht.filter((a) => actieGroep(a.datum, vandaag) === 'laat');
    const rest = zicht.filter((a) => actieGroep(a.datum, vandaag) !== 'laat');
    if (laat.length) doenGroep(doel, 'Te laat', laat, vandaag, 'laat');
    if (rest.length) doenGroep(doel, DOEN_KOP[actief], rest, vandaag, 'week');
  } else {
    for (const [g, titel] of [['laat', 'Te laat'], ['week', 'Deze week'], ['later', 'Later'], ['geen', 'Zonder periode']]) {
      const deel = zicht.filter((a) => actieGroep(a.datum, vandaag) === g);
      if (deel.length) doenGroep(doel, titel, deel, vandaag, g);
    }
  }
  const af = !actief || actief === 'alles' ? alle.filter((a) => !a.open && !doen.vertrekt.has(a.id)).sort((x, y) => (x.klaar < y.klaar ? 1 : -1)) : [];
  if (af.length) {
    const sec = document.createElement('section'); sec.className = 'blok'; sec.id = 'afgerond';
    sec.innerHTML = '<button class="kopbalk" type="button"><span class="kopnaam">Afgerond</span><span class="tal"></span>' + KLAPPIJL(doen.afgerondOpen || !!z) + '</button>';
    const kop = sec.querySelector('.kopbalk');
    kop.setAttribute('aria-expanded', String(doen.afgerondOpen || !!z));
    sec.querySelector('.tal').textContent = telTekst(af.length, 'actie', 'acties');
    kop.addEventListener('click', () => { doen.afgerondOpen = !doen.afgerondOpen; tekenDoen(); });
    if (doen.afgerondOpen || z) {
      const l = document.createElement('div'); l.className = 'lijst';
      for (const a of af) l.appendChild(actieRijUitGeheugen(a, vandaag, 'af'));
      sec.appendChild(l);
    } else kop.style.borderBottom = '1px solid var(--lijn)';
    doel.appendChild(sec);
  }
  if (!doel.children.length) { const p = document.createElement('div'); p.className = 'kaart leegregel'; p.textContent = z ? 'Niets gevonden' : 'Geen acties'; doel.appendChild(p); }
  if (!z) logRij(doel, 'historie');
}
/* De filterknoppen: naam, en op de tweede regel het aantal (te laat telt mee). */
function tekenDoenFilters(open, vandaag, zoekend, actief) {
  const f = $('doenFilters');
  f.innerHTML = '';
  for (const k of DOEN_FILTERS) {
    const n = open.filter((a) => inDoenFilter(a.datum, k, vandaag)).length;
    const aan = actief === k;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'filter';
    b.setAttribute('aria-pressed', String(aan));
    b.setAttribute('aria-label', DOEN_LANG[k] + ', ' + n);
    b.style.background = aan ? 'var(--paars)' : '#E9E6F8';
    b.style.color = aan ? '#FFFFFF' : 'var(--paars)';
    b.innerHTML = '<span></span><span class="n"></span>';
    b.firstChild.textContent = DOEN_NAAM[k];
    b.lastChild.textContent = n;
    b.addEventListener('pointerdown', (e) => { if (zoekend) e.preventDefault(); });
    b.addEventListener('mousedown', (e) => { if (zoekend) e.preventDefault(); });
    b.addEventListener('click', () => {
      if (zoekend) doen.zoekIn = doen.zoekIn === k ? '' : k; else doen.filter = k;
      tekenDoen();
    });
    f.appendChild(b);
  }
}

function actieAfronden(a) {
  const t = tijdstipTekst(new Date()), vandaag = datumTekst(new Date());
  const oud = model.acties.get(a.id).velden;
  /* Geen eigenaar: alleen wanneer, niet wie. */
  const hs = [{ actie: 'zet', soort: 'actie', id: a.id, veld: 'klaar', oud: oud.klaar || '', nieuw: t }];
  /* In de gedeelde historie: naam en moment. */
  const hid = nieuweId();
  const log = [{ actie: 'historie', soort: 'historie', id: hid, naam: a.naam, tijd: t }];
  if (a.herhaal) {
    /* Per maand/kwartaal/jaar op een dag: de oorspronkelijke dag van de maand onthouden (K5). */
    const opDag = periodeSoort(a.datum) === 'dag' && a.herhaal !== 'week';
    const wens = opDag ? (a.maanddag || +a.datum.slice(8, 10)) : 0;
    const volgende = volgendeKeer(a.datum, a.herhaal, vandaag, wens);
    hs.push({ actie: 'zet', soort: 'actie', id: a.id, veld: 'datum', oud: a.datum, nieuw: volgende });
    const md = wens && +volgende.slice(8, 10) !== wens ? String(wens) : '';
    if (md !== (oud.maanddag || '')) hs.push({ actie: 'zet', soort: 'actie', id: a.id, veld: 'maanddag', oud: oud.maanddag || '', nieuw: md });
    handelen(hs.concat(log));

/* Backups in de gedeelde map: alleen de naam en grootte; de inhoud pas als je
   er een aantikt. */
const BACKUP_NAAM = /^thuis_backup_(\d{4})(\d{2})(\d{2})\.json$/;
const VOOR_TERUGZETTEN = 'thuis_voor_terugzetten.json';
async function backupLijst() {
  const map = await kvGet('map');
  if (!map) return [];
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + '/children?$select=id,name,size&$top=999');
  if (!res.ok) throw new Error('code ' + res.status);
  return ((await res.json()).value || []).filter((i) => BACKUP_NAAM.test(i.name))
    .map((i) => { const m = BACKUP_NAAM.exec(i.name); return { id: i.id, naam: i.name, grootte: i.size || 0, datum: m[1] + '-' + m[2] + '-' + m[3] }; })
    .sort((a, b) => (a.datum < b.datum ? 1 : -1));
}
async function backupsTellen() {
  if (!gekoppeld || !navigator.onLine) { $('backupAantal').textContent = ''; return; }
  try { $('backupAantal').textContent = (await backupLijst()).length; } catch (e) { $('backupAantal').textContent = ''; }
}
function datumLabel(datum) {
  const d = new Date(+datum.slice(0, 4), +datum.slice(5, 7) - 1, +datum.slice(8, 10));
  const wd = WEEKDAGEN[d.getDay()];
  const t = wd[0].toUpperCase() + wd.slice(1) + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()];
  return datum === datumTekst(new Date()) ? 'Vandaag · ' + t.toLowerCase() : t;
}

/* "2026-11-22 20:02" → "vandaag 20:02", "za 06:00" (deze week) of "14 nov 20:02". */
function logTijd(t) {
  const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})/.exec(t);
  if (!m) return t;
  const nu = new Date(), dag = new Date(+m[1].slice(0, 4), +m[1].slice(5, 7) - 1, +m[1].slice(8, 10));
  const verschil = Math.round((new Date(nu.getFullYear(), nu.getMonth(), nu.getDate()) - dag) / 86400000);
  if (verschil === 0) return 'vandaag ' + m[2];
  if (verschil > 0 && verschil < 7) return WEEKDAGEN[dag.getDay()] + ' ' + m[2];
  return dag.getDate() + ' ' + MAANDEN[dag.getMonth()] + ' ' + m[2];
}

async function bestandInhoud(map, itemId) {
  const res = await graph('/drives/' + map.driveId + '/items/' + itemId);

  const inhoud = await metGrens((await res.json())['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
  if (!inhoud.ok) throw new Error('downloaden: code ' + inhoud.status);
  return new Uint8Array(await inhoud.arrayBuffer());
}

/* Eén backup: downloaden, laten zien wat erin zit, en terugzetten. */
async function backupBekijken(b) {

    '<div class="naamveld"><div class="kaart" id="backupInhoud"><div class="rij"><span class="label">Laden…</span></div></div></div>' +
    '<div class="bewerkknoppen"><button class="knop" type="button" disabled>Terugzetten</button></div></div>';
  k.querySelector('h3').textContent = 'Backup van ' + datumLabel(b.datum).replace('Vandaag · ', 'vandaag, ');
  k.querySelector('.kruis').addEventListener('click', sluitKeuze);
  k.addEventListener('click', (e) => { if (e.target === k) sluitKeuze(); });
  keuzeTonen(k);

  const regel = (label, waarde) => { const r = document.createElement('div'); r.className = 'rij'; r.innerHTML = '<span class="label"></span><span class="waarde"></span>'; r.children[0].textContent = label; r.children[1].textContent = waarde; return r; };
  let bytes, gelezen;
  try {
    bytes = await bestandInhoud(await kvGet('map'), b.id);
    gelezen = leesBestand(bytes);
  } catch (e) { inhoudEl.innerHTML = ''; inhoudEl.appendChild(regel('Niet gelukt', e.message)); return; }
  inhoudEl.innerHTML = '';
  if (!gelezen.ok) { inhoudEl.appendChild(regel('Niet terug te zetten', gelezen.reden === 'onbekend-formaat' ? 'ouder formaat' : 'niet te lezen')); return; }
  const m = gelezen.model;
  inhoudEl.appendChild(regel('Winkels', m.winkels.size));
  inhoudEl.appendChild(regel('Artikelen', m.artikelen.size));
  inhoudEl.appendChild(regel('Op de lijst', Array.from(m.artikelen.values()).filter((a) => a.op).length));
  inhoudEl.appendChild(regel('Acties', m.acties.size));
  const knop = k.querySelector('.knop');
  knop.disabled = false;
  knop.addEventListener('click', async () => {
    sluitKeuze();
    if (await terugzetten(new TextDecoder().decode(bytes), true)) {
      backupSluiten(false);
      const id = 'm-terug';
      melding(id, ['Backup van ', { vet: datumLabel(b.datum).replace('Vandaag · ', '') }, ' teruggezet.'], [{ tekst: 'Ongedaan maken', actie: async () => {
        meldingWeg(id);
        try { if (await terugzetten(new TextDecoder().decode(await bestandInhoudOpNaam(VOOR_TERUGZETTEN)), false)) melding(id, 'Terugzetten ongedaan gemaakt.', [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg(id) }], 'info'); }
        catch (e) { melding(id, 'Ongedaan maken niet gelukt (' + e.message + ').', [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg(id) }]); }
      } }], 'info');
    }
  });
}
async function bestandInhoudOpNaam(naam) {
  const map = await kvGet('map');
  const res = await graph('/drives/' + map.driveId + '/items/' + map.itemId + ':/' + naam);
  if (!res.ok) throw new Error('code ' + res.status);
  return bestandInhoud(map, (await res.json()).id);
}

/* De inhoud van een backup in thuis.json zetten. Eerst de huidige stand
   bewaren (zodat ook terugzetten terug te draaien is), alleen als er geen
   wijzigingen meer klaarstaan, en met If-Match: is het bestand intussen
   veranderd, dan gebeurt er niets. */
async function terugzetten(tekst, voorBewaren) {
  const fout = (t) => { melding('m-terug', t, [{ tekst: 'Sluiten', tweede: true, actie: () => meldingWeg('m-terug') }]); return false; };
  const terug = leesBestand(tekst);
  if (!terug.ok) return fout('Deze backup is niet te lezen.');
  /* Na terugzetten ruimt de app vandaag niets op (anders verdwijnt meteen weer wat je terugzette). */
  terug.model.instellingen.opruimen = { tot: datumTekst(new Date()) };
  tekst = schrijfBestand(terug.model);
  if (sync.bezig) return fout('Even geduld: de app is aan het synchroniseren.');
  sync.bezig = true; tekenWolk();
  try {
    const map = await kvGet('map');
    const opgehaald = await bestandOphalen(map);
    if (opgehaald.geenToegang) return fout('Geen toegang tot de gedeelde map; er is niets teruggezet.');
    if (opgehaald.weg) return fout(BESTAND + ' staat niet in de map.');
    const huidig = opgehaald.tekst || new TextDecoder().decode(opgehaald.bytes);
    /* Verdachte klok: niet terugzetten. Anders komt er een backup met een datum in de
       toekomst en ruimt de app de echte backups op (H1, ronde 4). */
    const nuGelezen = leesBestand(huidig);
    /* Wachtende wijzigingen: eerst versturen. Behalve als het huidige bestand onleesbaar is:
       dan kunnen ze niet weg, en worden ze na het terugzetten op de backup toegepast (M3, data). */
    if (wachtrij.length && nuGelezen.ok) { sync.opnieuw = true; return fout('Er staan nog wijzigingen klaar. Probeer het zo opnieuw.'); }
    if (klokIsVerdacht(klokInfo(opgehaald.item), nuGelezen.ok ? nuGelezen.model : leegModel(), new Date())) return fout('De datum van deze telefoon lijkt niet te kloppen; er is niets teruggezet.');
    if (voorBewaren) {
      /* Eerst de dagbackup van vandaag (als die er nog niet is). Daarna de stand van
         vóór het terugzetten, maar niet als die minder dan een uur oud is en er
         sinds het vorige terugzetten niets veranderde: zet je meteen nog een backup
         terug, dan blijft de stand van vóór de eerste poging bewaard en gaat
         Ongedaan maken daarheen (M4). */
      if (nuGelezen.ok) await dagbackup(map, huidig);
      const pad = '/drives/' + map.driveId + '/items/' + map.itemId + ':/' + VOOR_TERUGZETTEN;
      /* Alleen eigen wijzigingen tellen: wat de app zelf schrijft (wekelijks terug) of de
         ander deed, niet (M4, ronde 4). Na een herstart is er geen vorige: dan bewaren. */
      const v = terugzetten.vorige;
      if (!(v && Date.now() - v.tijd < 3600 * 1000 && v.eigen === eigenTeller)) {
        const r = await graph(pad + ':/content', {
          method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: huidig
        });
        if (!r.ok) return fout('De huidige stand kon niet worden bewaard; er is niets teruggezet.');
      }
    }
    const res = await graph('/drives/' + map.driveId + '/items/' + opgehaald.item.id + '/content', {
      method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8', 'If-Match': opgehaald.item.eTag }, body: tekst
    });
    if (res.status === 412) return fout('Het bestand is net gewijzigd. Probeer het opnieuw.');
    if (!res.ok) return fout('Terugzetten niet gelukt (code ' + res.status + ').');
    const item = await res.json();
    kopie = { formaat: FORMAAT, tekst, eTag: item.eTag, fileId: item.id, tijd: Date.now(), serverDag: serverDag(item), scheef: scheefVan(item) };
    terugzetten.vorige = { tijd: Date.now(), eigen: eigenTeller };
    meldingWeg('m-bestand');
    if (wachtrij.length) sync.opnieuw = true;
    await bewaar('kopie', kopie);
    bouwModel();
    tekenAlles();
    tekenInstellingen();
    return true;
  } catch (e) {
    return fout('Terugzetten niet gelukt (' + e.message + ').');
  } finally {
    sync.bezig = false; tekenWolk();
    /* Een synchronisatie die intussen werd uitgesteld, alsnog doen (K8). */
    if (sync.opnieuw) { sync.opnieuw = false; planSync(0); }
  }
}

function vakLeeg(inp) { inp.value = ''; const w = inp.parentNode.querySelector('.wis'); if (w) w.hidden = true; }
/* Het kruisje in elk zoekvak: zichtbaar zolang er tekst staat; een tik maakt het
   vak leeg (met een input-event, zodat de lijst meteen bijwerkt) en houdt de focus. */
document.addEventListener('input', (e) => {
  const wis = e.target.parentNode && e.target.parentNode.querySelector && e.target.parentNode.querySelector('.wis');
  if (wis && e.target.tagName === 'INPUT') wis.hidden = e.target.value === '';
});
document.addEventListener('click', (e) => {
  const wis = e.target.closest && e.target.closest('.wis');
  if (!wis) return;
  const inp = wis.parentNode.querySelector('input');
  inp.value = '';
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.focus();
});

/* ---------- vegen tussen de tabbladen (rondom) ---------- */
/* Niet vanaf de rand (daar zit het terug-gebaar van Android), niet tijdens typen,
   niet als er een menu of keuzelijst open is, en alleen bij een duidelijk
   horizontale beweging. */
const TABS = ['winkels', 'boodschappen', 'winkel', 'doen', 'instellingen'];
const veeg = { x: 0, y: 0, actief: false };
$('midden').addEventListener('touchstart', (e) => {

  veeg.actief = e.touches.length === 1 && !(e.target.closest && e.target.closest('.greep')) && t.clientX > 24 && t.clientX < window.innerWidth - 24 &&
    !$('keuze') && $('soortMenu').hidden && !document.body.classList.contains('typen');
  veeg.x = t.clientX; veeg.y = t.clientY;
}, { passive: true });
$('midden').addEventListener('touchend', (e) => {
  if (!veeg.actief) return;
  veeg.actief = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - veeg.x, dy = t.clientY - veeg.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const nu = TABS.findIndex((n) => !$('scherm-' + n).hidden);
  toonScherm(TABS[(nu + (dx < 0 ? 1 : -1) + TABS.length) % TABS.length]);
}, { passive: true });

/* De browser mag opslag bij ruimtegebrek wissen; vastzetten voorkomt dat, zodat
   een wachtrij die nog niet in OneDrive staat niet verloren gaat. Lukt het niet,
   dan is dat geen fout: alleen het woord "nee", in oranje (gedeelde conventie). */
async function opslagVastzetten() {
  let vast = false;
  try {
    if (navigator.storage && navigator.storage.persist) {
      vast = await navigator.storage.persisted() || await navigator.storage.persist();
    }
  } catch (e) { vast = false; }
  $('appOpslag').textContent = vast ? 'ja' : 'nee';
  $('appOpslag').style.color = vast ? '' : '#A84A0A';
}

/* ---------- start ---------- */
(async () => {
  try {
    await gegevensLaden();
    await winkelLaden();
    opslagVastzetten();
    await terugVanMicrosoft();
    await aanmeldingOpTijd();
    await toonStatus();
    planSync(0);
    const auth = await kvGet('auth');
    if (auth && auth.refresh) wieBenIk();
  } catch (e) {
    melding('m-start', 'De app kon zijn gegevens in de browser niet openen (' + (e.message || e) + ').', []);
  }
})();
</script>

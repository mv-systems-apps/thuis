<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.1drv.com https://*.microsoftpersonalcontent.com https://*.sharepoint.com https://*.livefilestore.com">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1D3FAF">
<title>thuis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --kobalt:#1D3FAF; --paars:#4B3CC0; --violet:#7A3FC8; --turkoois:#0A7581; --eenmalig:#6A3BC4;
    --tekst:#18202B; --zacht:#3A4250; --grijs:#5A6472; --lijn:#DEDCEE; --rij:#EFEEF7; --achter:#F4F3FB;
    --oranje-bg:#FFF5E6; --oranje:#6B3D02; --rood:#B42318;
  }
  *{box-sizing:border-box}
  /* Een eigen display (flex) mag hidden niet overstemmen. */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;color:var(--tekst);background:var(--achter);
       display:flex;flex-direction:column;overflow:hidden;position:fixed;inset:0}
  /* Vast aan de randen van het scherm (zoals trends) in plaats van 100dvh: die
     hoogte klopt bij het openen van de geïnstalleerde app op Android niet altijd,
     waardoor de tabbalk onder het scherm viel. Met resizes-content krimpt het
     scherm mee met het toetsenbord, zodat het invoervak erboven blijft. */
  button,input{font:inherit}
  /* Vaste kop, scrollend midden, vaste tabbalk: de navigatie scrollt niet weg. */
  header{flex-shrink:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;color:#FFFFFF;
         background:linear-gradient(115deg,var(--kobalt) 0%,var(--paars) 60%,var(--violet) 100%)}
  .merk{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
  #wolk{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;background:transparent;color:#E4E0FF;font-size:17px}
  #wolk svg{flex-shrink:0}
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scherm{padding:14px;display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto}
  h2{margin:0 0 6px 2px;font-size:17px;font-weight:700;color:var(--paars)}
  .kaart{background:#FFFFFF;border:1px solid var(--lijn)}
  .rij{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 14px;border-bottom:1px solid var(--rij)}
  .rij:last-child{border-bottom:0}
  .rij .label{flex:1}
  .rij .waarde{font-size:17px;color:var(--grijs);text-align:right}
  .knoprij{width:100%;border:0;border-bottom:1px solid var(--rij);background:#FFFFFF;font:inherit;color:var(--tekst);text-align:left}
  .label2{font-size:17px;color:var(--grijs)}
  .dagen{display:flex;gap:4px}
  .dagen button{flex:1;min-width:0;height:44px;border:0;background:#E9E6F8;color:var(--paars);font-size:17px;font-weight:600}
  .dagen button[aria-checked="true"]{background:var(--paars);color:#FFFFFF}
  input.tijd,select.tijd{width:150px;flex:none;height:44px;border:2px solid #CFCBE6;padding:0 10px;font-size:18px;background:#FFFFFF;color:var(--tekst)}
  #scherm-instellingen.sub > :not(#backupScherm){display:none}
  #scherm-winkel.sub > :not(#aankopenScherm){display:none}
  .loglijst{padding-top:12px}
  /* Regels buiten beeld slaat de browser over bij het opmaken, tot je ernaartoe scrolt (H1, performance). */
  .item,.actierij,.aankooprij,.wrij{content-visibility:auto;contain-intrinsic-size:auto 56px}
  .aankooprij{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 14px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .aankooprij:first-child{border-top:0}
  .aankooprij .nm{flex:1;min-width:0;font-size:20px;overflow-wrap:anywhere}
  .aankooprij .tijd{font-size:17px;color:var(--grijs)}
  .aankoopgroep{margin-bottom:12px}
  #scherm-boodschappen.sub > :not(#artikelScherm){display:none}
  /* ---------- artikel bewerken ---------- */
  #artikelScherm{display:flex;flex-direction:column;gap:12px}
  #artikelScherm .wdkop{padding:0 6px 0 16px}
  #artikelScherm .veld{padding:0}
  #artikelScherm #artikelLink{height:54px;border:2px solid #CFCBE6;padding:0 12px;font-size:20px;width:100%;box-sizing:border-box;background:#FFFFFF;color:var(--tekst)}
  #artikelScherm #artikelLink:focus{outline:none;border-color:var(--paars)}
  #artikelScherm textarea,#artikelScherm #artikelNotitie{min-height:54px;border:2px solid #CFCBE6;padding:12px;font:inherit;font-size:20px;line-height:1.3;width:100%;box-sizing:border-box;resize:none;overflow:hidden;background:#FFFFFF;color:var(--tekst)}
  #artikelScherm textarea:focus{outline:none;border-color:var(--paars)}
  .soorten{display:flex;gap:6px}
  .soorten button{flex:1;min-width:0;height:56px;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;font-weight:600}
  .plekrij{display:flex;align-items:center;gap:6px;padding-right:8px;background:#FFFFFF}
  .plekrij .winkelrij{flex:1;min-width:0;padding-right:4px}
  .plekrij .sub.leeg2{color:#6B7482}
  .toevoegrij{width:100%;min-height:52px;border:0;background:#FFFFFF;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--paars);font-size:18px;font-weight:600;text-align:left}
  .gekochtregel{padding:12px 14px;font-size:17px;color:var(--grijs)}
  #balk-actie .bewerkknoppen,#balk-artikel .bewerkknoppen{max-width:612px;margin:0 auto;display:flex;gap:10px}
  .bewerkknoppen .prul{width:56px;height:56px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#FBE4E5}
  #balk-artikel .knop,#balk-actie .knop{flex:1;min-height:56px;font-size:18px}
  /* ---------- tags kiezen ---------- */
  #tagLijst{position:fixed;left:14px;right:14px;z-index:25;overflow-y:auto;background:#FFFFFF;border:1px solid #CFCBE6;box-shadow:0 10px 28px rgba(30,20,80,.22)}
  #tagLijst .tagoptie{width:100%;min-height:52px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:20px;color:var(--tekst);text-align:left}
  #tagLijst .tagoptie:first-child{border-top:0}
  #tagLijst .h{color:var(--paars);font-weight:700}
  #tagLijst .nm{flex:1;min-width:0;overflow-wrap:anywhere}
  #tagLijst .n{font-size:17px;color:var(--grijs)}
  /* ---------- Doen ---------- */
  #scherm-doen.sub > :not(#actieScherm):not(#historieScherm){display:none}
  #doenLijst{display:flex;flex-direction:column;gap:12px}
  #actieScherm{display:flex;flex-direction:column;gap:12px}
  #actieScherm .wdkop{padding:0 6px 0 16px}
  #actieScherm .veld{padding:0}
  #actieScherm textarea,#actieScherm input{min-height:54px;border:2px solid #CFCBE6;padding:12px;font:inherit;font-size:20px;line-height:1.3;width:100%;box-sizing:border-box;resize:none;overflow:hidden;background:#FFFFFF;color:var(--tekst)}
  #actieScherm textarea:focus,#actieScherm input:focus{outline:none;border-color:var(--paars)}
  .kopbalk.laat{background:#FBF0DA}
  .kopbalk.laat h2,.kopbalk.laat .kopnaam{color:#A84A0A}
  .actierij{display:flex;align-items:center;gap:8px;min-height:56px;padding:4px 10px 4px 8px;border-top:1px solid var(--rij);background:#FFFFFF}
  .actierij:first-child{border-top:0}
  .actierij .tekst{flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;justify-content:center;text-align:left;color:var(--tekst)}
  .actierij .nm{font-size:20px;line-height:1.3;overflow-wrap:anywhere}
  .actierij .wanneer{font-size:17px;color:var(--grijs);line-height:1.3}
  .actierij .wanneer.laat{color:#A84A0A}
  .actierij.afgerond .nm{text-decoration:line-through;color:#6B7482}
  .actierij.vertrekt{opacity:.55}
  .segment{display:flex;gap:4px}
  .segment button{flex:1;min-width:0;height:44px;border:0;padding:0;background:#E9E6F8;color:var(--paars);font-size:17px;font-weight:600}
  .segment button[aria-checked="true"]{background:var(--paars);color:#FFFFFF}
  .blader{display:flex;align-items:center;height:52px;background:#FFFFFF;border:1px solid var(--lijn)}
  .blader button{width:52px;height:50px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
  .blader span{flex:1;text-align:center;font-size:20px;font-weight:600}
  .backupgroep{display:flex;flex-direction:column}
  .synctoestand{padding:14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--rij)}
  .synctoestand .regel{display:flex;align-items:center;gap:12px}
  .synctoestand .ic{flex-shrink:0;display:flex}
  .synctoestand .woord{font-size:20px;font-weight:700}
  .synctoestand .sub{font-size:17px;color:var(--grijs)}
  .synctoestand.warn .woord,.synctoestand.warn .sub{color:#A84A0A}
  .logregel{padding:10px 14px;font-size:17px;line-height:1.35}
  .logregel .tijd{display:block;color:var(--grijs)}
  .backuprij .nm{flex:1;line-height:1.3}
  .backuprij .sub{display:block;font-size:17px;color:var(--grijs)}
  .leeg{padding:28px 18px;text-align:center;color:var(--zacht);font-size:17px;line-height:1.45}
  .knop{min-height:52px;border:0;padding:0 16px;font-size:18px;font-weight:600;color:#FFFFFF;background:linear-gradient(135deg,var(--paars),var(--violet))}
  .knop.tweede{background:#FFFFFF;color:var(--paars);border:2px solid var(--paars)}
  .knop.rood{background:#FFFFFF;color:var(--rood);border:2px solid var(--rood)}
  .knop:disabled{opacity:.45}
  .knoppen{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
  .knoppen.vol .knop{flex:1 1 100%}
  .veld{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .veld label{font-size:17px;font-weight:600;color:var(--paars)}
  .veld input{height:52px;border:2px solid #CFCBE6;padding:0 12px;font-size:20px;width:100%;background:#FFFFFF;color:var(--tekst)}
  .stempel{text-align:center;font-size:17px;color:#6B7482;padding:4px 0 8px}
  /* Meldingen: één melding per regel, de knoppen eronder; ze blijven staan tot je
     ze wegtikt of het is opgelost (gedeelde conventie). */
  #meldingen{display:flex;flex-direction:column;gap:8px;padding:14px 14px 0;max-width:640px;margin:0 auto}
  #meldingen:empty{display:none}
  .melding{background:var(--oranje-bg);color:var(--oranje);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .melding.info{background:#ECEAF8;color:#2E2A4F}
  .melding p{margin:0;font-size:17px;line-height:1.4}
  .melding .knoppen{padding:0}
  /* Knoppen in een melding vullen de breedte: één knop over de hele breedte, twee naast elkaar elk de helft. */
  .melding .knoppen .knop{flex:1 1 0;min-width:0}
  .melding .knoppen .knop.vinkknop{flex:0 0 56px;padding:0;display:flex;align-items:center;justify-content:center;border:0;background:linear-gradient(135deg,var(--paars),var(--violet))}
  /* Systeemknoppen (in meldingen) omrand, zoals Afmelden, zodat ze zich onderscheiden
     van de gewone, gevulde knoppen. Sluiten en Annuleren grijs omrand. */
  .melding .knop{background:#FFFFFF;color:var(--paars);border:2px solid var(--paars)}
  .melding .knop.tweede,.knop.grijs{color:var(--grijs);border-color:#CFCBE6}
  /* Nieuwe versie: bovenaan, in oranje, met een gevulde oranje knop (zoals events). */
  .melding .knop{position:relative;overflow:hidden}
  .aftel{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#9A93C9;transform-origin:left;animation:aftellen linear forwards}
  @keyframes aftellen{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.aftel{animation-timing-function:steps(6)}}
  .melding .knop.warn{background:#E0A458;color:#2A1A02;border-color:#E0A458}
  nav{flex-shrink:0;height:64px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid var(--lijn);
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;border-top:3px solid transparent;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
  nav button svg{width:28px;height:28px;stroke:#6B7482;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current="page"]{border-top-color:var(--paars);background:#F1EFFB}
  nav button[aria-current="page"] svg{stroke:var(--paars)}
  /* ---------- boodschappen ---------- */
  /* Kruisje om een zoekvak leeg te maken; alleen als er iets in staat. */
  .wis{width:44px;flex-shrink:0;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
  .onderbalk{flex-shrink:0;padding:10px 14px 12px;background:#FFFFFF;border-top:1px solid var(--lijn);box-shadow:0 -4px 12px rgba(24,20,60,.06)}
  .onderbalk .invoerbalk{max-width:612px;margin:0 auto;height:56px;box-shadow:none}
  /* Tijdens het typen staan de treffers onderaan, vlak boven het vak. */
  body.typen #scherm-boodschappen{min-height:100%;justify-content:flex-end}
  /* De filters blijven daarbij bovenaan staan (ook bij een lange lijst); alleen de lijst zakt. */
  body.typen #filters{margin-bottom:auto;position:sticky;top:0;z-index:2;background:var(--achter);margin-top:-14px;padding-top:14px}
  .invoerbalk{position:relative;display:flex;align-items:stretch;height:60px;background:#FFFFFF;border:2px solid var(--paars);box-shadow:0 4px 14px rgba(75,60,192,.14)}
  .invoerbalk input{flex:1;min-width:0;border:0;outline:none;padding:0 12px;font-size:20px;color:var(--tekst);background:transparent}
  .terugknop{background:#F4F3FB}
  .soortknop{width:52px;flex-shrink:0;border:0;border-right:1px solid var(--lijn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
  .plusknop{width:56px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--paars),var(--violet))}
  .menu{position:absolute;z-index:10;bottom:56px;left:-2px;width:230px;background:#FFFFFF;border:1px solid #CFCBE6;box-shadow:0 10px 28px rgba(30,20,80,.22)}
  .menu button{width:100%;height:52px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:18px;color:var(--tekst);text-align:left}
  .menu button:first-child{border-top:0}
  .menu button span{flex:1}
  #achtergrond{position:fixed;inset:0;z-index:5;border:0;padding:0;background:rgba(24,20,60,.12)}
  .filters{display:flex;gap:6px}
  /* Filterrijen (Artikelen en Doen): boven het icoon of de naam, eronder het aantal. */
  .doenfilters .filter{height:58px;flex-direction:column;gap:0;line-height:1.2;padding:4px 2px;white-space:nowrap}
  #filters .filter{height:58px;flex-direction:column;gap:2px;line-height:1.1}
  .filter .n{font-weight:400}
  .filter{flex:1;height:46px;border:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px}
  .kopregel{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0}
  /* Kopbalk boven een lijst: lichtpaars, paarse titel, rechts het aantal (en
     eventueel een pijltje om in te klappen). Elke lijst in de app ziet er zo uit. */
  .kopbalk{width:100%;min-height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#E9E6F8;border:1px solid var(--lijn);border-bottom:0;text-align:left;font:inherit}
  .kopbalk h2,.kopbalk h3,.kopbalk .kopnaam{flex:1;min-width:0;margin:0;font-size:18px;font-weight:700;color:var(--paars)}
  .kopbalk .tal{flex-shrink:0;font-size:17px;font-weight:400;color:var(--grijs)}
  .kopbalk svg{flex-shrink:0}
  #lijstPijl{display:flex}
  #lijstPijl:empty{display:none}
  button.kopbalk{cursor:pointer}
  .blok{display:flex;flex-direction:column}
  .item.archief .tekst,.item.archief .icoon{opacity:.7}
  .kopregel h2{margin:0;font-size:18px}
  .kopregel span{font-size:17px;color:var(--grijs)}
  .lijst{background:#FFFFFF;border:1px solid var(--lijn)}
  .item{display:flex;align-items:center;gap:8px;min-height:54px;padding:4px 6px 4px 10px;border-bottom:1px solid var(--rij)}
  .item:last-child{border-bottom:0}
  .item .icoon{width:40px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;padding:0;background:transparent}
  /* "2×": als een label in de regel, verticaal gecentreerd op de naam. */
  .item .aantal,.wrij .aantal{display:inline-block;margin-left:8px;padding:0 7px;line-height:26px;vertical-align:2px;background:var(--paars);color:#FFFFFF;font-size:17px;font-weight:700;white-space:nowrap}
  .teller{display:flex;align-items:center;gap:0;padding:6px 14px 8px 58px;background:#F1EFFB;border-bottom:1px solid var(--rij)}
  .teller > span:first-child{flex:1;font-size:17px;color:var(--grijs)}
  .teller button{width:44px;height:44px;border:0;padding:0;background:#E9E6F8;color:var(--paars);font-size:22px;font-weight:700}
  .teller button:disabled{opacity:.4}
  .teller .n{width:40px;text-align:center;font-size:18px;font-weight:700}
  .item .tekst{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:44px;border:0;background:transparent;padding:0;color:var(--tekst);text-align:left}
  /* Lange namen lopen door op een volgende regel; winkelsymbool en "nieuw" lopen mee. */
  .item .naam{display:block;font-size:20px;line-height:1.25;overflow-wrap:anywhere;padding:4px 0}
  /* De notitie onder de winkels, zelfde letter, in paars. */
  .notitie .tag{font-weight:700}
  .notitie .link{font-weight:600;text-decoration:underline;cursor:pointer}
  .item .notitie,.wrij .notitie,.actierij .notitie,.winkelrij .notitie{display:block;font-size:17px;font-weight:400;color:var(--paars);line-height:1.3;margin-top:-2px;padding-bottom:4px;overflow-wrap:anywhere}
  .item .winkels,.wrij .winkels{display:block;font-size:17px;font-weight:400;color:var(--grijs);line-height:1.3;margin-top:-2px;padding-bottom:4px}
  .item .naam .nieuw{margin-left:6px;white-space:nowrap}
  .item .hint{font-size:17px;color:var(--grijs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nieuw{padding:1px 7px;background:#DDF1F2;color:#0A6570;font-size:17px;font-weight:600}
  .rondje{width:44px;height:44px;flex-shrink:0;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
  .lijst .leeg{padding:16px 14px;text-align:left;font-size:18px;color:var(--grijs)}
  /* Tijdens het typen de onderbalk weg: dan is er ruimte voor de zoekresultaten. */
  body.typen nav{display:none}
  /* ---------- tabblad Winkels ---------- */
  .wsectie{display:flex;flex-direction:column}
  .wsectie > .kopbalk[aria-expanded="false"]{border-bottom:1px solid var(--lijn)}
  .wkaart{background:#FFFFFF;border:1px solid var(--lijn)}
  .wkaart > *{border-top:1px solid var(--rij)}
  .wkaart > *:first-child{border-top:0}
  .winkelrij{width:100%;min-height:60px;border:0;background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:6px 12px 6px 14px;text-align:left;color:var(--tekst)}
  .winkelrij .nm{flex:1;min-width:0;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
  .winkelrij .sub{display:block;font-size:17px;color:var(--grijs)}
  .wdkop{position:sticky;top:-14px;z-index:2;margin:-14px -14px 0;height:60px;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;background:#FFFFFF;border-bottom:1px solid var(--lijn)}
  #winkelDetail{display:flex;flex-direction:column;gap:12px}
  #winkelsOverzicht{display:flex;flex-direction:column;gap:12px}
  .wdkop h2{flex:1;min-width:0;margin:0;font-size:21px;font-weight:700;color:var(--tekst);overflow-wrap:anywhere;line-height:1.2}
  .wdkop{min-height:60px;height:auto}
  .wdkop .terug{width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
  .kopregel2{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  .kopregel2 h3{margin:0;font-size:18px;color:var(--paars)}
  .kopregel2 span{font-size:17px;color:var(--grijs)}
  .arij{min-height:56px;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 2px;background:#FFFFFF;position:relative}
  .arij .nm{flex:1;min-width:0;min-height:48px;border:0;background:transparent;padding:0 4px;font-size:20px;color:var(--tekst);text-align:left;overflow-wrap:anywhere}
  .arij.sleept{z-index:3;background:#F1EFFB;box-shadow:0 6px 16px rgba(24,20,60,.18)}
  .greep{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  .leegregel{padding:16px 14px;font-size:18px;color:var(--grijs)}
  #keuze .naamveld{display:flex;flex-direction:column;gap:6px;padding:8px 16px 14px}
  #keuze .naamveld label{font-size:17px;font-weight:600;color:var(--paars)}
  #keuze .naamveld input{height:54px;border:2px solid var(--paars);padding:0 12px;font-size:20px;outline:none}
  #keuze .naamveld textarea{min-height:54px;border:2px solid var(--paars);padding:12px;font:inherit;font-size:20px;line-height:1.3;resize:none;overflow:hidden;outline:none;color:var(--tekst)}
  #keuze .bewerkknoppen{display:flex;gap:10px;padding:0 16px 14px}
  #keuze .bewerkknoppen .prul{width:54px;height:54px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#FBE4E5}
  #keuze .bewerkknoppen .knop{flex:1;min-height:54px;font-size:18px}
  /* ---------- tabblad Winkel ---------- */
  /* Bovenaan de voortgang van de hele lijst; daaronder wat bij geen winkel hoort,
     dan de gekozen winkel als één kaart (paarse streep links) met alles wat je
     daar haalt, en los en grijs wat elders ligt en het mandje. */
  /* De balk ligt vast op de eerste kaart (geen ruimte ertussen). */
  .voortgang{display:flex;flex-direction:column;gap:8px;margin-bottom:-16px}
  .voortgang .balk{height:6px;background:#DCD7F3}
  .voortgang .balk div{height:6px;width:0;background:linear-gradient(90deg,#5EE0E8,var(--violet))}
  /* De winkel waar je bent: kop gevuld paars (zoals de balk bovenin); "Zonder
     winkel": grijze kop met een doorgestreept winkeltje. */
  .winkelkaart{background:#FFFFFF;border:1px solid var(--lijn)}
  .winkelkaart .afd{border:0;border-top:1px solid var(--rij)}
  .winkelkaart > .winkelkop{background:linear-gradient(115deg,var(--paars),var(--violet))}
  .winkelkaart > .winkelkop .winkelnaam{color:#FFFFFF}
  .winkelkaart > .winkelkop .tal{color:#E4E0FF}
  .winkelkaart.zonder > .winkelkop{background:#E4E2EE;gap:8px}
  .winkelkop h3{flex:1;min-width:0;margin:0;font-size:21px;font-weight:700;color:var(--grijs)}
  .winkelkaart.zonder > .winkelkop .tal{color:var(--grijs)}
  .winkelkop{height:60px;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px}
  .winkelkop .winkelnaam{flex:1;min-width:0;height:48px;border:0;background:transparent;color:var(--tekst);font-size:21px;font-weight:700;display:flex;align-items:center;gap:6px;padding:0;text-align:left}
  .winkelkop .winkelnaam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .winkelkop .tal{flex-shrink:0;font-size:17px;color:var(--grijs)}
  #winkelLijst{display:flex;flex-direction:column;gap:12px}
  .afd{background:#FFFFFF;border:1px solid var(--lijn)}
  .afd .afdkop{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:#ECEAF8}
  .afd .afdkop span{flex:1;font-size:18px;font-weight:700;color:var(--paars)}
  .afd.grijs{background:#FAFAFD}
  /* Koppen van Niet bij, In het mandje en Aankopen: zoals de groepskoppen elders (paars op lichtpaars). */
  .afd.grijs .afdkop{background:#E9E6F8}
  .wrij{display:flex;align-items:center;gap:6px;padding-right:8px;border-top:1px solid var(--rij)}
  .afd > .wrij:first-child{border-top:0}
  .wrij .vink{flex:1;min-width:0;min-height:56px;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:4px 6px 4px 14px;color:var(--tekst);text-align:left}
  .wrij .vink .nm{flex:1;min-width:0;font-size:20px;font-weight:400;line-height:1.25;overflow-wrap:anywhere}
  .wrij.gedaan .vink{color:#6B7482}
  .wrij.gedaan .vink .nm{text-decoration:line-through;font-weight:400}
  .afd .uitklap{flex:1;min-height:44px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0;font-size:18px;font-weight:700;color:var(--paars);text-align:left}
  .afd .uitklap span{flex:1}
  .naaraankopen .rij{background:#E9E6F8}
  .naaraankopen .label{color:var(--paars);font-weight:700}
  .afd .uitklap .tal,.afd .afdkop .tal{flex:0 0 auto;font-size:17px;font-weight:400;color:var(--grijs)}
  /* Icoonknop: vierkant van 44 px, lichte tint, geen rand. */
  .icoonknop{width:44px;height:44px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#E9E6F8}
  .icoonknop.amber{background:#FBF0DA}
  /* ---------- keuzelijst van onderen ---------- */
  #keuze{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(24,20,60,.35)}
  .oplicht{animation:oplichten 1s ease-out}
  @keyframes oplichten{0%,40%{background:#DCD6F7}100%{background:#FFFFFF}}
  @media (prefers-reduced-motion:reduce){.oplicht{animation:none;outline:3px solid #DCD6F7}}
  #keuze .paneeltekst{margin:0;padding:4px 16px 6px;font-size:18px;color:var(--tekst)}
  #keuze .paneelfout{margin:0;padding:0 16px 10px;font-size:17px;color:var(--rood, #B3261E)}
  #keuze .paneel{background:#FFFFFF;max-height:80dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #keuze .kop{display:flex;align-items:center;gap:8px;padding:6px 6px 4px 16px}
  #keuze h3{flex:1;min-width:0;margin:0;font-size:18px;color:var(--paars)}
  /* Een titel met namen erin: de namen vet, de rest gewoon. */
  #keuze h3.delen{font-weight:400}
  #keuze h3.delen b{font-weight:700}
  #keuze .kruis{width:44px;height:44px;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#E9E6F8}
  #keuze .opties{flex:1;min-height:120px;overflow-y:auto}
  #keuze .optie{width:100%;min-height:56px;border:0;border-top:1px solid var(--rij);background:#FFFFFF;display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:20px;color:var(--tekst);text-align:left}
  #keuze .optie .nm{flex:1;min-width:0;line-height:1.3;overflow-wrap:anywhere}
  #keuze .optie .sub{display:block;font-size:17px;color:var(--grijs)}
  /* De gekozen optie: lichtpaars met een paarse streep links. */
  #keuze .optie.actief{color:var(--paars);font-weight:700;border-left:5px solid var(--paars);padding-left:11px}
  #keuze .optie.actief .sub{font-weight:400}
  #keuze .optie.sterk .nm{font-weight:700}
  #keuze .optie.sterk .sub{font-weight:400}
  #keuze .optie .sub .grijs{color:var(--grijs);flex-shrink:0}
  #keuze .optie.metsub .sub{display:flex;gap:6px;color:var(--tekst)}
  #keuze .optie.metsub .sub .namen{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #keuze .optie .tal,#keuze .uitklapper .tal{flex:0 0 auto;font-size:17px;font-weight:400;color:var(--grijs)}
  /* Alle koppen in een keuzelijst gelijk: paars op lichtpaars, rechts het aantal. */
  #keuze .uitklapper{width:100%;min-height:46px;border:0;border-top:1px solid var(--lijn);background:#E9E6F8;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:18px;font-weight:700;color:var(--paars);text-align:left}
  #keuze .uitklapper span{flex:1}
  #keuze .leeg{padding:16px;font-size:18px;color:var(--grijs)}
  #keuze .zoek{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--lijn);background:var(--achter)}
  #keuze .zoekbalk{display:flex;height:54px;border:2px solid var(--paars);background:#FFFFFF}
  #keuze .zoeklinks{width:52px;flex:none;border:0;border-right:1px solid var(--lijn);background:#F4F3FB;display:flex;align-items:center;justify-content:center;padding:0}
  #keuze .zoekbalk input{flex:1;min-width:0;border:0;outline:none;padding:0 12px;font-size:20px}
  /* ---------- van de lijst gehaald (boodschappen) ---------- */
  .item.vertrekt{opacity:.55}
  .weggehaald .item{opacity:.7}
  .rondsvg{flex-shrink:0}
  button:focus-visible{outline:3px solid #5EE0E8;outline-offset:2px}
  /* Een invoervak krijgt geen losse rand binnen de balk: de hele balk licht op,
     en een los vak krijgt een paarse rand. */
  input:focus,input:focus-visible{outline:none}
  .invoerbalk:focus-within,#keuze .zoekbalk:focus-within{box-shadow:0 0 0 3px rgba(94,224,232,.55)}
  .veld input:focus,input.tijd:focus{border-color:var(--paars)}
</style>
</head>
<body>
<header>
  <div class="merk">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5EE0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
    <span>thuis</span>
  </div>
  <button id="wolk" type="button" aria-label="Synchroniseren">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4E0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"></path><path id="wolkTeken" d="M9.5 13.5l2 2 3.5-3.5"></path></svg>
    <span id="wolkTekst">—</span>
  </button>
</header>

<main id="midden">
  <div id="meldingen" aria-live="polite"></div>
  <section class="scherm" id="scherm-winkels" aria-labelledby="tab-winkels" hidden>
    <div id="winkelsOverzicht"></div>
    <div id="winkelDetail" hidden></div>
  </section>

  <section class="scherm" id="scherm-boodschappen" aria-labelledby="tab-boodschappen">
    <div class="filters" id="filters" role="group" aria-label="Welke lijst"></div>
    <div class="blok" id="lijstBlok">
      <button class="kopbalk" type="button" id="lijstKop" aria-expanded="true"><span class="kopnaam" id="lijstTitel">Op de lijst</span><span class="tal" id="lijstAantal"></span><span id="lijstPijl"></span></button>
      <div class="lijst" id="lijst"></div>
    </div>
    <div id="artikelScherm" hidden></div>
  </section>

  <section class="scherm" id="scherm-winkel" aria-labelledby="tab-winkel" hidden>
    <div class="voortgang">
      <div class="kopregel"><h2>Boodschappen</h2><span id="winkelTeller"></span></div>
      <div class="balk" aria-hidden="true"><div id="winkelVoortgang"></div></div>
    </div>
    <div id="winkelLijst"></div>
    <div class="winkelkop" id="winkelKop">
      <button class="winkelnaam" id="winkelKies" type="button" aria-haspopup="dialog">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5EE0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v11H4z"></path><path d="M10 20v-5h4v5"></path></svg>
        <span id="winkelNaam">Winkel kiezen</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span class="tal" id="winkelHier"></span>
    </div>
    <div id="aankopenScherm" hidden></div>
  </section>

  <section class="scherm" id="scherm-doen" aria-labelledby="tab-doen" hidden>
    <div class="filters doenfilters" id="doenFilters" role="group" aria-label="Welke periode"></div>
    <div id="doenLijst"></div>
    <div id="actieScherm" hidden></div>
    <div id="historieScherm" hidden></div>
  </section>

  <section class="scherm" id="scherm-instellingen" aria-labelledby="tab-instellingen" hidden>
    <div class="blok">
      <div class="kopbalk"><h2>Synchroniseren</h2></div>
      <div class="kaart">
        <div class="synctoestand" id="syncToestand">
          <div class="regel"><span class="ic" id="syncIcoon"></span><div><div class="woord" id="syncWoord">—</div><div class="sub" id="syncSub"></div></div></div>
          <button class="knop tweede" id="btnSyncNu" type="button">Nu synchroniseren</button>
        </div>
        <div class="rij" id="rijAangemeld"><span class="label">Aangemeld als</span><span class="waarde" id="wieAangemeld">niet aangemeld</span></div>
        <div class="rij"><span class="label">Gedeelde map</span><span class="waarde" id="mapNaam">nog geen</span></div>
        <div class="veld" id="mapVeld">
          <label for="deellink">Deellink naar de map</label>
          <input id="deellink" type="url" inputmode="url" autocomplete="off" placeholder="https://1drv.ms/…">
          <button class="knop tweede" id="btnMap" type="button">Map koppelen</button>
        </div>
        <div class="knoppen vol">
          <button class="knop" id="btnAanmelden" type="button">Aanmelden bij Microsoft</button>
          <button class="knop rood" id="btnAfmelden" type="button" hidden>Afmelden</button>
        </div>
      </div>
    </div>
    <div class="blok">
      <div class="kopbalk"><h2>Wekelijks terug op de lijst</h2></div>
      <div class="kaart">
        <div class="veld"><span class="label2">Dag</span><div class="dagen" id="wekDagen" role="radiogroup" aria-label="Dag"></div></div>
        <div class="rij"><label class="label" for="wekTijd">Tijd</label><input class="tijd" id="wekTijd" type="time" step="300"></div>
      </div>
    </div>
    <div class="blok">
      <div class="kopbalk"><h2>Archief</h2></div>
      <div class="kaart">
        <div class="veld"><span class="label2">Verwijderen als niet gekocht in</span><div class="dagen" id="archiefBewaren" role="radiogroup" aria-label="Verwijderen als niet gekocht in"></div></div>
        <div class="rij"><label class="label" for="aankopenBewaren">Aankopen bewaren</label><select class="tijd" id="aankopenBewaren"></select></div>
      </div>
    </div>
    <div class="blok">
      <div class="kopbalk"><h2>Doen</h2></div>
      <div class="kaart">
        <div class="veld"><span class="label2">Standaard tonen</span><div class="dagen" id="doenStandaard" role="radiogroup" aria-label="Standaard tonen"></div></div>
        <div class="veld"><span class="label2">Historie verwijderen na</span><div class="dagen" id="historieBewaren" role="radiogroup" aria-label="Historie verwijderen na"></div></div>
      </div>
    </div>
    <div class="blok">
      <div class="kopbalk"><h2>Gegevens</h2></div>
      <div class="kaart">
        <button class="rij knoprij" id="naarBackups" type="button"><span class="label">Backups</span><span class="waarde" id="backupAantal"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A93C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        <button class="rij knoprij" id="naarLogboek" type="button"><span class="label">Logboek</span><span class="waarde" id="logboekAantal"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A93C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>
    <div class="blok">
      <div class="kopbalk"><h2>App</h2></div>
      <div class="kaart">
        <div class="rij"><span class="label">Browser</span><span class="waarde" id="appBrowser">—</span></div>
        <div class="rij"><span class="label">Aanmelding geldig</span><span class="waarde" id="appToken">—</span></div>
        <div class="rij"><span class="label">Opslag vastgezet</span><span class="waarde" id="appOpslag">—</span></div>
      </div>
    </div>
    <div id="backupScherm" hidden></div>
    <div class="stempel" id="app-version-stamp">Versie 1352903-009</div>
  </section>
</main>

<div class="onderbalk" id="balk-boodschappen">
  <div class="invoerbalk">
    <button class="soortknop" id="invoerSoort" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="soortknop terugknop" id="invoerTerug" type="button" aria-label="Annuleren" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    <input id="invoerTekst" type="text" aria-label="Artikel zoeken of toevoegen" placeholder="Artikel" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    <button class="wis" type="button" aria-label="Leegmaken" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D96A6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <button class="plusknop" id="invoerPlus" type="button" aria-label="Toevoegen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <div class="menu" id="soortMenu" role="menu" aria-label="Soort voor nieuw artikel" hidden></div>
  </div>
</div>
<div class="onderbalk" id="balk-artikel" hidden>
  <div class="bewerkknoppen">
    <button class="prul" id="artikelWeg" type="button" aria-label="Artikel verwijderen"></button>
    <button class="knop" id="artikelOpslaan" type="button">Opslaan</button>
  </div>
</div>
<div class="onderbalk" id="balk-log" hidden>
  <div class="invoerbalk">
    <button class="soortknop terugknop links" id="logLinks" type="button" aria-label="Zoeken"></button>
    <input id="logZoek" type="text" placeholder="Zoeken" aria-label="Zoeken" autocomplete="off" autocapitalize="sentences" enterkeyhint="search">
    <button class="wis" type="button" aria-label="Leegmaken" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D96A6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
</div>
<div class="onderbalk" id="balk-doen" hidden>
  <div class="invoerbalk">
    <button class="soortknop terugknop links" id="doenLinks" type="button" aria-label="Zoeken"></button>
    <input id="doenTekst" type="text" placeholder="Actie" aria-label="Actie zoeken of toevoegen" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    <button class="wis" type="button" aria-label="Leegmaken" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D96A6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <button class="plusknop" id="doenPlus" type="button" aria-label="Toevoegen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
<div class="onderbalk" id="balk-actie" hidden>
  <div class="bewerkknoppen">
    <button class="prul" id="actieWeg" type="button" aria-label="Actie verwijderen"></button>
    <button class="knop" id="actieOpslaan" type="button">Opslaan</button>
  </div>
</div>
<div class="onderbalk" id="balk-winkels" hidden>
  <div class="invoerbalk">
